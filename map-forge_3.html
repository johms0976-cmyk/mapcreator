<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Forge — board game map editor</title>
<style>
:root{
  --ink:#0e1118; --ink2:#151a24; --edge:#2a3346;
  --leather:#1c1712; --leather2:#241d14;
  --parch:#e3d5ae; --parch-dim:#a99c78;
  --gold:#c9a24b; --gold-dim:#8a7136; --danger:#e05a3a;
  --sea:#16202e; --landfill:#232a37; --cellfill:#1e2530;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  /* map palette — overwritten by applyTheme(), mirrored into exports */
  --m-landstroke:#5b6b83; --m-cellstroke:#39424f; --m-coast:#5b6b83;
  --m-wall:#7d5a3c; --m-road:#c9b98a; --m-borderwall:#4a5265;
  --m-peak:#3b4457; --m-peaklit:#59637a; --m-peakstroke:#141a26; --m-snow:#8f9db5;
  --m-wood:#1d3323; --m-tree:#2f5b3a; --m-treelit:#477d51; --m-treestroke:#12281a;
  --m-riverbed:#2c4763; --m-riverlit:#7ea6c9; --m-lake:#274766; --m-lakestroke:#7ea6c9;
  --m-label:#cdbf97; --m-labelhalo:#0e1118; --m-node:#e8d9a8; --m-nodestroke:#6b5a2c;
  --m-settle:#e3d5ae; --m-settlestroke:#3a2f1e; --m-deco:#0e1118;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--parch);font-family:var(--sans);font-size:13px}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:var(--sans)}
/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:10px;padding:6px 12px;
  background:linear-gradient(180deg,#14100b,#1c1712);border-bottom:1px solid #3a2f1e;flex:0 0 auto;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--gold)}
.brand span{font-style:italic;font-weight:400;letter-spacing:.02em;color:var(--parch-dim);font-size:11px;margin-left:6px}
.tb-group{display:flex;gap:4px;align-items:center}
.tb-sep{width:1px;height:20px;background:#463a26;margin:0 4px}
.tb-btn{background:#26201a;border:1px solid #463a26;color:var(--parch);font-size:11.5px;
  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tb-btn:hover{background:#332a1f}
.tb-btn:disabled{opacity:.35;pointer-events:none}
.tb-btn.gold{border-color:var(--gold-dim);color:var(--gold)}
select,input[type=text],input[type=number]{background:#12161f;border:1px solid var(--edge);color:var(--parch);
  border-radius:5px;padding:4px 6px;font-size:12px}
input[type=range]{accent-color:var(--gold)}
input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--edge);border-radius:4px;background:none}
/* ---------- main ---------- */
#main{flex:1 1 auto;display:flex;min-height:0}
/* tool rail */
#tools{width:46px;flex:0 0 auto;background:var(--leather);border-right:1px solid #3a2f1e;
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto}
.tool{width:34px;height:34px;border-radius:7px;border:1px solid transparent;background:none;color:var(--parch-dim);
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative}
.tool:hover{background:#2a2218;color:var(--parch)}
.tool.on{background:#2f2717;border-color:var(--gold-dim);color:var(--gold)}
.tool .tip{position:absolute;left:44px;top:50%;transform:translateY(-50%);background:#0b0e14;border:1px solid var(--edge);
  color:var(--parch);font-size:11px;padding:4px 8px;border-radius:5px;white-space:nowrap;display:none;z-index:40;pointer-events:none}
.tool:hover .tip{display:block}
.tool-sep{width:24px;height:1px;background:#3a2f1e;margin:4px 0}
/* canvas */
#stage{flex:1 1 auto;position:relative;min-width:0;background:
  radial-gradient(120% 90% at 65% 55%, #1a2130 0%, var(--ink2) 55%, #0d1017 100%)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#svg.tool-select{cursor:default}
#svg.tool-pan{cursor:grab}
#svg.panning{cursor:grabbing}
/* status */
#status{flex:0 0 auto;display:flex;gap:16px;align-items:center;padding:4px 12px;font-size:11px;
  color:var(--parch-dim);background:#14110c;border-top:1px solid #3a2f1e}
#hint{color:var(--gold)}
/* ---------- side panel ---------- */
#panel{width:300px;flex:0 0 auto;background:var(--leather);border-left:1px solid #3a2f1e;
  overflow-y:auto;display:flex;flex-direction:column}
#panel.hidden{display:none}
.sec{border-bottom:1px solid #322818}
.sec>h3{font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  padding:8px 12px;cursor:pointer;user-select:none;display:flex;justify-content:space-between}
.sec>h3::after{content:"–";color:var(--parch-dim)}
.sec.closed>h3::after{content:"+"}
.sec.closed .body{display:none}
.sec .body{padding:2px 12px 12px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:0 0 88px;color:var(--parch-dim);font-size:11.5px}
.row input[type=text],.row select{flex:1;min-width:0}
.row input[type=number]{width:64px}
.row input[type=range]{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:#26201a;border:1px solid #463a26;border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer}
.chip:hover{border-color:var(--danger);color:var(--danger)}
.mini{font-size:11px;color:var(--parch-dim)}
.btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.small-btn{background:#26201a;border:1px solid #463a26;color:var(--parch);font-size:11px;padding:4px 8px;border-radius:5px;cursor:pointer}
.small-btn:hover{background:#332a1f}
.small-btn.danger{border-color:#6e2a1e;color:var(--danger)}
.list{max-height:170px;overflow-y:auto;border:1px solid #322818;border-radius:6px;margin-top:6px}
.list .item{padding:4px 8px;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:6px}
.list .item:hover{background:#241d12}
.list .item.on{background:#2f2717;color:var(--gold)}
.list .item .x{color:var(--parch-dim);cursor:pointer;padding:0 3px}
.list .item .x:hover{color:var(--danger)}
.check{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px;cursor:pointer}
.check input{accent-color:var(--gold)}
.shapegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.shapebtn{aspect-ratio:1;background:#26201a;border:1px solid #463a26;border-radius:6px;color:var(--parch-dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px}
.shapebtn:hover{background:#332a1f;color:var(--parch)}
.shapebtn.on{background:#2f2717;border-color:var(--gold);color:var(--gold)}
.shapebtn svg{width:100%;height:100%;display:block}
.shapebtn svg *{fill:none;stroke:currentColor;stroke-width:1.6;vector-effect:non-scaling-stroke}
/* ---------- SVG classes (colours come from the active theme) ---------- */
.land{stroke:var(--m-landstroke);stroke-width:var(--land-w,1.4);fill:var(--landfill)}
.coastline{fill:none;stroke:var(--m-coast);stroke-linejoin:round;pointer-events:none}
.cell{stroke:var(--m-cellstroke);stroke-width:var(--ink-w,1);cursor:pointer;fill:var(--cellfill);fill-opacity:.78}
.cell.sel{stroke:var(--gold);stroke-width:2.4;filter:drop-shadow(0 0 6px rgba(201,162,75,.7))}
.cell.multi{stroke:var(--gold);stroke-width:1.8;stroke-dasharray:5 3}
.terrfill{pointer-events:none}
.wall{stroke:var(--m-wall);stroke-width:var(--wall-w,4);stroke-linecap:round;opacity:.85;cursor:pointer}
.wall.sel{stroke:var(--gold)}
.roadline{stroke:var(--m-road);stroke-width:var(--road-w,2);stroke-dasharray:1 5;stroke-linecap:round;fill:none;cursor:pointer;opacity:.9}
.roadline.sel{stroke:var(--gold);stroke-dasharray:none}
.adjline{stroke:#7ea6c9;stroke-width:.8;opacity:.35;pointer-events:none;vector-effect:non-scaling-stroke}
/* B6 — editor chrome keeps a constant on-screen weight at any zoom */
.vx,.mid,.anchor-h,.marquee,.draft,.preview,.seqhl,.draftpt,.gridline,.forestsel,.blockmark,
.cell.sel,.cell.multi{vector-effect:non-scaling-stroke}
.node{fill:var(--m-node);stroke:var(--m-nodestroke);stroke-width:1;cursor:move}
.node.sel{fill:var(--gold);stroke:#fff}
.anchor-h{fill:none;stroke:#7ea6c9;stroke-width:1.2;cursor:move}
.vx{fill:#0e1118;stroke:var(--gold);stroke-width:1.4;cursor:move}
.vx:hover{fill:var(--gold)}
.vx.weld{stroke:#7ee0a8}
.mid{fill:#0e1118;stroke:#7ea6c9;stroke-width:1;cursor:copy;opacity:.75}
.mid:hover{fill:#7ea6c9}
.peak{fill:var(--m-peak);stroke:var(--m-peakstroke);stroke-width:.5;stroke-linejoin:round}
.peaklit{fill:var(--m-peaklit);stroke:none}
.peakshadow{fill:var(--m-peakstroke);opacity:.28;stroke:none}
.snow{fill:var(--m-snow);opacity:.9;stroke:none}
.wood{fill:var(--m-wood);opacity:.55}
.tree{fill:var(--m-tree);stroke:var(--m-treestroke);stroke-width:.35;stroke-linejoin:round}
.treelit{fill:var(--m-treelit);stroke:none;opacity:.75}
.treetrunk{fill:var(--m-treestroke);stroke:none;opacity:.9}
.treeshadow{fill:var(--m-peakstroke);opacity:.22;stroke:none}
.riverbed{fill:none;stroke:var(--m-riverbed);stroke-linecap:round;stroke-linejoin:round}
.riverlit{fill:none;stroke:var(--m-riverlit);stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.lake{fill:var(--m-lake);stroke:var(--m-lakestroke);stroke-width:1;opacity:.9;cursor:pointer}
.lake.sel{stroke:var(--gold);stroke-width:2}
.rgname{font-family:var(--serif);font-size:9.5px;fill:var(--m-label);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--m-labelhalo);stroke-width:2.4;stroke-opacity:.75}
.maplabel{font-family:var(--serif);fill:var(--m-label);text-anchor:middle;paint-order:stroke;stroke:var(--m-labelhalo);stroke-width:2.6;stroke-opacity:.7;cursor:pointer}
.maplabel.sel{fill:var(--gold)}
.labelhit{fill:transparent;stroke:none;cursor:pointer}
.settle-t{fill:var(--m-settle);stroke:var(--m-settlestroke);stroke-width:1;pointer-events:none}
.settle-ring{fill:none;stroke:var(--m-settle);stroke-width:1.4;pointer-events:none}
.settle-ico{stroke:var(--m-settlestroke);stroke-width:.9;stroke-linejoin:round;pointer-events:none}
.deco{fill:none;stroke:var(--m-deco);stroke-width:1;opacity:.45;pointer-events:none}
.borderwall{fill:none;stroke:var(--m-borderwall);stroke-width:var(--wall-w,4);stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.marquee{fill:rgba(201,162,75,.10);stroke:var(--gold);stroke-width:1.2;stroke-dasharray:4 3;pointer-events:none}
.blockmark{fill:none;stroke:var(--danger);stroke-width:1.2;stroke-dasharray:2 4;opacity:.55}
.terrhit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.preview{stroke:var(--gold);stroke-width:1.6;fill:rgba(201,162,75,.16);pointer-events:none}
.draft{stroke:var(--gold);stroke-width:1.5;fill:rgba(201,162,75,.12);stroke-dasharray:5 4;pointer-events:none}
.draftpt{fill:var(--gold);pointer-events:none}
.seqhl{stroke:var(--gold);stroke-width:2.5;fill:none;stroke-dasharray:4 3;pointer-events:none}
.gridline{stroke:#2a3346;stroke-width:.5;opacity:.5;pointer-events:none}
.forestsel{stroke:var(--gold);stroke-width:1.6;fill:none;stroke-dasharray:4 3;pointer-events:none}
/* ---------- tool rail groups & shortcut badges ---------- */
#tools{width:60px}
.tool-group{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#6d5c3e;
  margin:7px 0 2px;user-select:none;text-align:center;width:100%}
.tool{width:48px;height:38px;flex-direction:column;gap:1px;font-size:14px;line-height:1;flex:0 0 auto}
.tool .key{font-size:8.5px;letter-spacing:.06em;color:#7a6949;font-family:var(--sans)}
.tool.on .key{color:var(--gold)}
.tool:hover .key{color:var(--parch-dim)}
/* ---------- coach bar ---------- */
#coach{flex:0 0 auto;display:none;align-items:flex-start;gap:10px;padding:7px 12px;
  background:linear-gradient(180deg,#2a2213,#211a10);border-bottom:1px solid #4a3c22;font-size:12px;color:var(--parch)}
#coach.show{display:flex}
#coach .ic{color:var(--gold);font-size:14px;line-height:1.3}
#coach .txt{flex:1;line-height:1.5}
#coach .txt b{color:var(--gold);font-weight:600}
#coach .x{background:none;border:1px solid #4a3c22;color:var(--parch-dim);border-radius:5px;
  font-size:10.5px;padding:3px 7px;cursor:pointer;white-space:nowrap}
#coach .x:hover{color:var(--parch);border-color:var(--gold-dim)}
/* ---------- empty state ---------- */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
#empty.hide{display:none}
.ecard{background:rgba(28,23,18,.94);border:1px solid var(--gold-dim);border-radius:14px;
  padding:26px 30px;max-width:660px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.ecard h1{font-family:var(--serif);font-size:26px;color:var(--gold);letter-spacing:.1em;margin-bottom:4px}
.ecard .sub{font-size:12.5px;color:var(--parch-dim);margin-bottom:20px;font-style:italic}
.echoices{display:flex;gap:12px;flex-wrap:wrap}
.echoice{flex:1 1 180px;background:#26201a;border:1px solid #463a26;border-radius:10px;padding:16px 14px;
  cursor:pointer;text-align:left;color:var(--parch);transition:border-color .12s,background .12s}
.echoice:hover{background:#332a1f;border-color:var(--gold-dim)}
.echoice .big{font-size:22px;margin-bottom:7px;display:block}
.echoice .t{font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:.05em;display:block;margin-bottom:5px}
.echoice .d{font-size:11.5px;color:var(--parch-dim);line-height:1.5}
.ecard .foot2{margin-top:18px;font-size:11.5px;color:var(--parch-dim);display:flex;gap:14px;flex-wrap:wrap}
.ecard .foot2 a{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--gold-dim)}
/* ---------- context menu ---------- */
#ctx{position:fixed;z-index:120;background:#1c1712;border:1px solid var(--gold-dim);border-radius:8px;
  padding:4px;min-width:172px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none}
#ctx.show{display:block}
#ctx .mi{padding:5px 10px;font-size:12px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;white-space:nowrap}
#ctx .mi:hover{background:#2f2717;color:var(--gold)}
#ctx .mi.danger:hover{background:#3a1d15;color:var(--danger)}
#ctx .mi .sc{color:var(--parch-dim);font-size:10.5px}
#ctx .sep{height:1px;background:#3a2f1e;margin:4px 2px}
#ctx .hd{padding:4px 10px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6d5c3e}
/* ---------- minimap ---------- */
#minimap{position:absolute;right:10px;bottom:10px;width:150px;height:120px;background:rgba(10,13,19,.82);
  border:1px solid #3a2f1e;border-radius:7px;overflow:hidden;z-index:15;cursor:crosshair;display:none}
#minimap.show{display:block}
#minimap svg{width:100%;height:100%;display:block}
#minimap .mm-view{fill:rgba(201,162,75,.14);stroke:var(--gold);stroke-width:2;vector-effect:non-scaling-stroke}
#minimap .mm-land{fill:#39424f;stroke:none}
#minimap .mm-cell{fill:#5a6577;stroke:none}
/* ---------- toasts ---------- */
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(28,23,18,.96);border:1px solid var(--gold-dim);border-radius:7px;padding:7px 12px;
  font-size:12px;color:var(--parch);box-shadow:0 6px 20px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;
  pointer-events:auto;max-width:min(560px,80vw);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.toast .act{background:#332a1f;border:1px solid var(--gold-dim);color:var(--gold);border-radius:5px;
  font-size:11px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.toast .act:hover{background:#443722}
/* ---------- problems ---------- */
.prob{padding:5px 8px;font-size:11.5px;border-bottom:1px solid #2a2216;cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.prob:last-child{border-bottom:none}
.prob:hover{background:#241d12}
.prob .sev{flex:0 0 auto;font-size:11px}
.prob.err .sev{color:var(--danger)}
.prob.warn .sev{color:var(--gold)}
.prob .msg{flex:1;line-height:1.4;color:var(--parch)}
.prob .msg em{color:var(--parch-dim);font-style:normal;font-size:10.5px;display:block}
.okline{color:#7ee0a8;font-size:11.5px;padding:6px 2px}
/* ---------- modal ---------- */
#modal-bg{position:fixed;inset:0;background:rgba(5,7,10,.7);display:none;align-items:center;justify-content:center;z-index:100}
#modal-bg.show{display:flex}
#modal{background:var(--leather);border:1px solid var(--gold-dim);border-radius:10px;min-width:340px;max-width:460px;
  max-height:82vh;overflow-y:auto;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#modal h2{font-family:var(--serif);font-size:16px;color:var(--gold);margin-bottom:10px;letter-spacing:.06em}
#modal .row label{flex:0 0 110px}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#modal p{font-size:12px;color:var(--parch-dim);margin:6px 0;line-height:1.5}
kbd{background:#12161f;border:1px solid var(--edge);border-radius:4px;padding:0 5px;font-size:11px;font-family:monospace}
#helptable td{padding:2px 10px 2px 0;font-size:12px;vertical-align:top}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">MAP FORGE<span>region-map editor</span></div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" id="b-new">New map</button>
      <button class="tb-btn" id="b-open">Open HTML / JSON</button>
      <input type="file" id="f-open" accept=".html,.htm,.json,.svg,.geojson" style="display:none">
      <input type="file" id="f-import" accept=".svg,.geojson,.json" style="display:none">
      <button class="tb-btn" id="b-slots" title="Recent projects Map Forge has autosaved">Recent…</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn gold" id="b-savehtml" title="Write map data back into the loaded game HTML">Save game HTML</button>
      <button class="tb-btn" id="b-savepng">Export PNG</button>
      <button class="tb-btn" id="b-savejson">Export JSON</button>
      <button class="tb-btn" id="b-savesvg">Export SVG</button>
      <button class="tb-btn" id="b-savejs">Export JS blocks</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" id="b-undo" title="Ctrl+Z">↶</button>
      <button class="tb-btn" id="b-redo" title="Ctrl+Y">↷</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <span class="mini">Theme</span>
      <select id="sel-theme"></select>
    </div>
    <div style="flex:1"></div>
    <button class="tb-btn" id="b-help">? Help</button>
    <button class="tb-btn" id="b-panel">Panel ⇄</button>
  </div>

  <div id="coach">
    <span class="ic">◆</span>
    <span class="txt" id="coach-txt"></span>
    <button class="x" id="coach-x">Got it</button>
  </div>

  <div id="main">
    <div id="tools"></div>
    <div id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="toasts"></div>
      <div id="minimap"><svg id="mmsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="empty">
        <div class="ecard">
          <h1>MAP FORGE</h1>
          <div class="sub">A region-map editor for board games — draw it, wire it, export it.</div>
          <div class="echoices">
            <button class="echoice" id="e-open">
              <span class="big">📂</span>
              <span class="t">Open a game file</span>
              <span class="d">Load a War-of-the-Ring-style game HTML and edit its live map, or reopen a Map Forge JSON project.</span>
            </button>
            <button class="echoice" id="e-new">
              <span class="big">✦</span>
              <span class="t">Start a new map</span>
              <span class="d">Blank canvas. Trace a coastline, drop regions, or generate a whole hex board in one click.</span>
            </button>
            <button class="echoice" id="e-sample">
              <span class="big">⬡</span>
              <span class="t">Try the sample map</span>
              <span class="d">A small finished island with regions, nations, mountains, a river and a blocked border. Best way to learn.</span>
            </button>
          </div>
          <div class="foot2">

/* ---------------- geometry helpers ---------------- */
function parseD(d){ // path string -> array of rings [[x,y],...]
  const rings=[]; let cur=null;
  const re=/([MLZmlz])|(-?\d*\.?\d+)[ ,]+(-?\d*\.?\d+)/g; let m, mode="M";
  while((m=re.exec(d))){
    if(m[1]){ mode=m[1].toUpperCase(); if(mode==="M"){cur=[];rings.push(cur);} continue; }
    if(!cur){cur=[];rings.push(cur);}
    cur.push([+m[2],+m[3]]);
  }
  return rings.filter(r=>r.length>1);
}
function ringD(pts){ return pts.map((p,i)=>(i?"L":"M")+fmt(p[0])+","+fmt(p[1])).join("")+"Z"; }
function ringsD(rings){ return rings.map(ringD).join(""); }
function centroid(pts){
  let a=0,cx=0,cy=0;
  for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];
    const c=x1*y2-x2*y1; a+=c; cx+=(x1+x2)*c; cy+=(y1+y2)*c; }
  if(Math.abs(a)<1e-6){ const s=pts.reduce((s,p)=>[s[0]+p[0],s[1]+p[1]],[0,0]); return [s[0]/pts.length,s[1]/pts.length]; }
  return [cx/(3*a), cy/(3*a)];
}
function ptSegDist(p,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;
  if(!L2) return dist(p,a);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2; t=Math.max(0,Math.min(1,t));
  return dist(p,[a[0]+t*dx,a[1]+t*dy]);
}
function inradius(pts, a){
  let r=Infinity;
  for(let i=0;i<pts.length;i++) r=Math.min(r, ptSegDist(a, pts[i], pts[(i+1)%pts.length]));
  return Math.max(3, r);
}
function slug(name){
  let s=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "region";
  let id=s,n=2; while(P.regions.some(r=>r.id===id)) id=s+"_"+n++;
  return id;
}
function snapPt(p){ return snap ? [Math.round(p[0]/snap)*snap, Math.round(p[1]/snap)*snap] : p; }

/* ---------------- point & polyline utilities ---------------- */
function projOnSeg(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy;
  if(!L2) return {pt:a.slice(), d:dist(p,a)};
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2; t=Math.max(0,Math.min(1,t));
  const q=[a[0]+t*dx, a[1]+t*dy];
  return {pt:q, d:dist(p,q)};
}
function nearestEdge(pts,p,closed){
  let best={d:Infinity,i:-1,pt:null};
  const n=pts.length, last=closed? n : n-1;
  for(let i=0;i<last;i++){
    const r=projOnSeg(p,pts[i],pts[(i+1)%n]);
    if(r.d<best.d) best={d:r.d,i,pt:r.pt};
  }
  return best;
}
function nearestVertex(pts,p){
  let best={d:Infinity,i:-1};
  pts.forEach((q,i)=>{ const d=dist(p,q); if(d<best.d) best={d,i}; });
  return best;
}
/* Ramer–Douglas–Peucker: drops points that don't change the outline */
function rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  let max=0,idx=0;
  for(let i=1;i<pts.length-1;i++){
    const d=ptSegDist(pts[i],pts[0],pts[pts.length-1]);
    if(d>max){ max=d; idx=i; }
  }
  if(max<=eps) return [pts[0],pts[pts.length-1]];
  return rdp(pts.slice(0,idx+1),eps).slice(0,-1).concat(rdp(pts.slice(idx),eps));
}
function simplifyRing(pts,eps){
  const out=rdp(pts.concat([pts[0]]),eps);
  out.pop();
  return out.length>=3? out : pts.slice();
}
/* Chaikin corner cutting — rounds an outline off, doubling its points */
function chaikin(pts){
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    out.push([a[0]+(b[0]-a[0])*.25, a[1]+(b[1]-a[1])*.25]);
    out.push([a[0]+(b[0]-a[0])*.75, a[1]+(b[1]-a[1])*.75]);
  }
  return out.map(p=>[+p[0].toFixed(2),+p[1].toFixed(2)]);
}
function densifyRing(pts){
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    out.push(a.slice(), [+((a[0]+b[0])/2).toFixed(2), +((a[1]+b[1])/2).toFixed(2)]);
  }
  return out;
}
function densifyPolyline(pts,step){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], L=dist(a,b), n=Math.max(1,Math.round(L/step));
    for(let j=0;j<n;j++) out.push([a[0]+(b[0]-a[0])*j/n, a[1]+(b[1]-a[1])*j/n]);
  }
  out.push(pts[pts.length-1].slice());
  return out;
}
function ringToPolyline(pts,step){
  return densifyPolyline(pts.concat([pts[0]]),step);
}
function polyDist(p,pts){
  let m=Infinity;
  for(let i=0;i<pts.length;i++){ const d=ptSegDist(p,pts[i],pts[(i+1)%pts.length]); if(d<m)m=d; }
  return m;
}
/* The stretch of A's outline that runs alongside B — the border the two
   regions share. Returns a polyline, or a short bridge if they don't touch. */
function sharedBorder(aId,bId,tol){
  const A=P.cells[aId], B=P.cells[bId];
  if(!A||!B||A.pts.length<3||B.pts.length<3) return bridgeBetween(aId,bId);
  tol = tol||6;
  const S=ringToPolyline(A.pts, 2.5);
  const near=S.map(p=>polyDist(p,B.pts)<=tol);
  const n=near.length;
  if(!near.some(Boolean)) return bridgeBetween(aId,bId);
  // longest contiguous run, wrapping around the ring
  let bestStart=0,bestLen=0,i=0;
  while(i<n*2){
    if(near[i%n]){
      let j=i; while(j<i+n && near[j%n]) j++;
      if(j-i>bestLen){ bestLen=j-i; bestStart=i; }
      i=j;
    } else i++;
    if(bestLen>=n) break;
  }
  const run=[];
  for(let k=0;k<Math.min(bestLen,n);k++) run.push(S[(bestStart+k)%n].slice());
  if(run.length<2) return bridgeBetween(aId,bId);
  return rdp(run, 1.2).map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]);
}
function bridgeBetween(aId,bId){
  const A=P.cells[aId], B=P.cells[bId], ra=byId(aId), rb=byId(bId);
  if(!ra||!rb) return [];
  if(A&&B&&A.pts.length&&B.pts.length){
    let best={d:Infinity,p:null,q:null};
    for(const p of A.pts) for(const q of B.pts){ const d=dist(p,q); if(d<best.d) best={d,p,q}; }
    const mid=[(best.p[0]+best.q[0])/2,(best.p[1]+best.q[1])/2];
    const dx=best.q[0]-best.p[0], dy=best.q[1]-best.p[1], L=Math.hypot(dx,dy)||1;
    const nx=-dy/L*10, ny=dx/L*10;
    return [[+(mid[0]+nx).toFixed(1),+(mid[1]+ny).toFixed(1)],[+(mid[0]-nx).toFixed(1),+(mid[1]-ny).toFixed(1)]];
  }
  const mid=[(ra.x+rb.x)/2,(ra.y+rb.y)/2];
  const dx=rb.x-ra.x, dy=rb.y-ra.y, L=Math.hypot(dx,dy)||1;
  return [[+(mid[0]-dy/L*12).toFixed(1),+(mid[1]+dx/L*12).toFixed(1)],
          [+(mid[0]+dy/L*12).toFixed(1),+(mid[1]-dx/L*12).toFixed(1)]];
}
function refreshBorders(){
  if(!P) return;
  P.terrain.forEach(f=>{ if(f.t==="border") f.pts=sharedBorder(f.a,f.b,f.tol||6); });
}
function detachShape(id){
  const c=P.cells[id];
  if(c&&c.shape){ delete c.shape; delete c.deco; return true; }
  return false;
}

/* ---------------- shape primitives ----------------
   Every shape is baked down to a plain point list, so shapes stay compatible
   with the region format the game engine reads. The parameters are kept on the
   cell as `shape` so the sliders can rebuild it; export drops them. */
const SHAPE_KINDS=[
  ["rect","Rectangle","M2,5H22V19H2Z"],
  ["square","Square","M4,4H20V20H4Z"],
  ["rrect","Rounded square","M8,4H16A4,4 0 0 1 20,8V16A4,4 0 0 1 16,20H8A4,4 0 0 1 4,16V8A4,4 0 0 1 8,4Z"],
  ["circle","Circle","M12,3A9,9 0 1 1 11.99,3Z"],
  ["ellipse","Oval","M12,5A10,7 0 1 1 11.99,5Z"],
  ["pill","Pill","M8,7H16A5,5 0 0 1 16,17H8A5,5 0 0 1 8,7Z"],
  ["hexP","Hexagon (pointy top)","M12,2L21,7V17L12,22L3,17V7Z"],
  ["hexF","Hexagon (flat top)","M22,12L17,21H7L2,12L7,3H17Z"],
  ["diamond","Diamond","M12,2L22,12L12,22L2,12Z"],
  ["tri","Triangle","M12,3L22,20H2Z"],
  ["cyl","Cylinder","M4,7A8,3.4 0 0 1 20,7V17A8,3.4 0 0 1 4,17ZM4,7A8,3.4 0 0 0 20,7"],
  ["ngon","Polygon (n sides)","M12,2L21.5,8.9L17.9,20.1H6.1L2.5,8.9Z"],
];
const SHAPE_LABEL = Object.fromEntries(SHAPE_KINDS.map(s=>[s[0],s[1]]));
let shapeOpts = { kind:"hexP", sides:5, corner:.28, rotd:0, seg:14 };
const BORDER_LABEL = { ridge:"Mountains", river:"River", forest:"Forest", wall:"Barrier" };
let borderOpts = { style:"ridge", block:true, s:.75, w:2.6, size:4 };

function rotPts(pts,cx,cy,deg){
  if(!deg) return pts;
  const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  return pts.map(([x,y])=>{ const dx=x-cx,dy=y-cy; return [cx+dx*c-dy*s, cy+dx*s+dy*c]; });
}
function ellipsePts(cx,cy,rx,ry,n,a0,a1){
  a0=a0===undefined?0:a0; a1=a1===undefined?Math.PI*2:a1;
  const out=[];
  for(let i=0;i<n;i++){ const a=a0+(a1-a0)*(i/(a1-a0===Math.PI*2? n : n-1));
    out.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return out;
}
function ngonPts(cx,cy,rx,ry,n,phase){
  const out=[];
  for(let i=0;i<n;i++){ const a=phase+i*2*Math.PI/n; out.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return out;
}
function roundRectPts(cx,cy,rx,ry,r,seg){
  r=Math.max(0,Math.min(r,Math.min(rx,ry)));
  if(r<.4) return [[cx-rx,cy-ry],[cx+rx,cy-ry],[cx+rx,cy+ry],[cx-rx,cy+ry]];
  const out=[], corners=[
    [cx+rx-r, cy-ry+r, -Math.PI/2, 0],
    [cx+rx-r, cy+ry-r, 0, Math.PI/2],
    [cx-rx+r, cy+ry-r, Math.PI/2, Math.PI],
    [cx-rx+r, cy-ry+r, Math.PI, Math.PI*1.5],
  ];
  for(const [ox,oy,a0,a1] of corners)
    for(let i=0;i<=seg;i++){ const a=a0+(a1-a0)*(i/seg); out.push([ox+Math.cos(a)*r, oy+Math.sin(a)*r]); }
  return out;
}
/* returns {pts, deco} — deco is optional decoration (cylinder rim) drawn in
   the editor / SVG / PNG but not part of the region polygon the engine sees */
function makeShape(kind, cx, cy, rx, ry, o){
  o=Object.assign({},shapeOpts,o||{});
  const seg=Math.max(4,o.seg|0), sides=Math.max(3,Math.min(24,o.sides|0));
  let pts, deco=null;
  switch(kind){
    case "square": { const s=Math.min(rx,ry); pts=[[cx-s,cy-s],[cx+s,cy-s],[cx+s,cy+s],[cx-s,cy+s]]; break; }
    case "rect":   pts=[[cx-rx,cy-ry],[cx+rx,cy-ry],[cx+rx,cy+ry],[cx-rx,cy+ry]]; break;
    case "rrect":  pts=roundRectPts(cx,cy,rx,ry,Math.min(rx,ry)*o.corner*2,Math.max(3,Math.round(seg/2))); break;
    case "pill":   pts=roundRectPts(cx,cy,rx,ry,Math.min(rx,ry),Math.max(5,seg)); break;
    case "circle": { const s=Math.min(rx,ry); pts=ellipsePts(cx,cy,s,s,seg*3); break; }
    case "ellipse":pts=ellipsePts(cx,cy,rx,ry,seg*3); break;
    case "hexP":   pts=ngonPts(cx,cy,rx,ry,6,-Math.PI/2); break;
    case "hexF":   pts=ngonPts(cx,cy,rx,ry,6,0); break;
    case "diamond":pts=[[cx,cy-ry],[cx+rx,cy],[cx,cy+ry],[cx-rx,cy]]; break;
    case "tri":    pts=ngonPts(cx,cy,rx,ry,3,-Math.PI/2); break;
    case "ngon":   pts=ngonPts(cx,cy,rx,ry,sides,-Math.PI/2); break;
    case "cyl": {
      const e=Math.max(2,Math.min(ry*.34, rx*.7)), n=Math.max(6,seg);
      // top half-ellipse, left→right over the rim
      const top=[];
      for(let i=0;i<=n;i++){ const a=Math.PI+Math.PI*(i/n);
        top.push([cx+Math.cos(a)*rx, (cy-ry+e)+Math.sin(a)*e]); }
      // bottom half-ellipse, right→left along the underside
      const under=[];
      for(let i=0;i<=n;i++){ const a=Math.PI-Math.PI*(i/n);
        under.push([cx-Math.cos(a)*rx, (cy+ry-e)+Math.sin(a)*e]); }
      pts=top.concat(under);
      deco=ellipsePts(cx, cy-ry+e, rx, e, n*2);
      break;
    }
    default: pts=[[cx-rx,cy-ry],[cx+rx,cy-ry],[cx+rx,cy+ry],[cx-rx,cy+ry]];
  }
  pts=rotPts(pts,cx,cy,o.rotd||0);
  if(deco) deco=rotPts(deco,cx,cy,o.rotd||0);
  return { pts:pts.map(p=>[+p[0].toFixed(2),+p[1].toFixed(2)]), deco };
}
function shapeMeta(kind,cx,cy,rx,ry,o){
  o=Object.assign({},shapeOpts,o||{});
  return { kind, cx:+cx.toFixed(2), cy:+cy.toFixed(2), rx:+rx.toFixed(2), ry:+ry.toFixed(2),
           sides:o.sides, corner:o.corner, rotd:o.rotd, seg:o.seg };
}
function rebuildShape(cell){
  if(!cell||!cell.shape) return;
  const m=cell.shape, r=makeShape(m.kind,m.cx,m.cy,m.rx,m.ry,m);
  cell.pts=r.pts; cell.deco=r.deco;
  cell.a=[m.cx,m.cy];
}

/* ---------------- undo ----------------
   C3/D3. Three changes over the naive stringify-everything stack:
   · entries are labelled, so the toolbar can say what Ctrl+Z will do;
   · the selection is captured and restored, instead of being blown away;
   · pushUndo(label,{coalesce}) merges a run of slider events into one step,
     and the snapshot is taken lazily so dragging a slider costs one
     serialisation rather than one per input event. */
const UNDO_LIMIT=60;
function snapSelection(){
  return { sel: sel? JSON.parse(JSON.stringify(sel)) : null, multi:[...multi] };
}
function restoreSelection(s){
  if(!s){ clearSelection(); return; }
  multi=new Set((s.multi||[]).filter(id=>byId(id)));
  const v=s.sel;
  if(!v){ sel=null; return; }
  // only restore a selection that still points at something real
  if(v.type==="region" && !byId(v.id)) { sel=null; return; }
  if(v.type==="terrain" && !P.terrain[v.idx]) { sel=null; return; }
  if(v.type==="label" && !(P.labels||[])[v.idx]) { sel=null; return; }
  if(v.type==="land" && !P.land[v.ring]) { sel=null; return; }
  if(v.type==="wall" && !P.walls[v.idx]) { sel=null; return; }
  if(v.type==="road" && !P.roads[v.idx]) { sel=null; return; }
  sel=v;
}
let coalesceKey=null;
function pushUndo(label, opts){
  opts=opts||{};
  // a run of slider events with the same key collapses into one undo step
  if(opts.coalesce){
    if(coalesceKey===opts.coalesce) { scheduleAutosave(); return; }
    coalesceKey=opts.coalesce;
  } else coalesceKey=null;
  undoStack.push({ data:JSON.stringify(P), label:label||"edit", selection:snapSelection() });
  if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  redoStack.length=0;
  scheduleAutosave();
  updateUndoUI();
}
/* call when a slider/drag interaction finishes so the next one is its own step */
function endCoalesce(){ coalesceKey=null; }
function applyUndoEntry(entry){
  P=JSON.parse(entry.data);
  restoreSelection(entry.selection);
  render(); panel(); updateUndoUI();
}
function doUndo(){
  if(!undoStack.length) return;
  endCoalesce();
  const entry=undoStack.pop();
  redoStack.push({ data:JSON.stringify(P), label:entry.label, selection:snapSelection() });
  applyUndoEntry(entry);
}
function doRedo(){
  if(!redoStack.length) return;
  endCoalesce();
  const entry=redoStack.pop();
  undoStack.push({ data:JSON.stringify(P), label:entry.label, selection:snapSelection() });
  applyUndoEntry(entry);
}
function updateUndoUI(){
  const u=$("#b-undo"), r=$("#b-redo");
  if(!u||!r) return;
  const ul=undoStack.length? undoStack[undoStack.length-1].label : null;
  const rl=redoStack.length? redoStack[redoStack.length-1].label : null;
  u.disabled=!undoStack.length; r.disabled=!redoStack.length;
  u.title = ul? "Undo: "+ul+"  (Ctrl+Z)" : "Nothing to undo";
  r.title = rl? "Redo: "+rl+"  (Ctrl+Y)" : "Nothing to redo";
}

/* ---------------- autosave: named slots (A8) + game HTML (D4) ---------------- */
let asTimer=null;
const AS_INDEX="mapforge_slots";
function slotKey(id){ return "mapforge_slot_"+id; }
let currentSlot=null;
async function readSlots(){
  try{
    if(!window.storage) return [];
    const r=await window.storage.get(AS_INDEX);
    return r? (JSON.parse(r.value)||[]) : [];
  }catch(e){ return []; }
}
async function writeSlots(list){
  try{ if(window.storage) await window.storage.set(AS_INDEX, JSON.stringify(list)); }catch(e){}
}
function scheduleAutosave(){
  clearTimeout(asTimer);
  asTimer=setTimeout(async ()=>{
    try{
      if(!window.storage||!P) return;
      if(!currentSlot) currentSlot="s"+Date.now().toString(36);
      // D4 — keep the original game HTML with the project so "Save game HTML"
      // still works after a restore. Skip it if it's implausibly large.
      const keepHTML = origHTML && origHTML.length < 4.5e6 ? origHTML : null;
      await window.storage.set(slotKey(currentSlot),
        JSON.stringify({p:P, name:origName, html:keepHTML}));
      const list=await readSlots();
      const rec={ id:currentSlot, name:origName||"map", at:Date.now(),
                  regions:P.regions.length, theme:P.theme, hasHTML:!!keepHTML };
      const i=list.findIndex(x=>x.id===currentSlot);
      if(i>=0) list[i]=rec; else list.unshift(rec);
      // keep the last 8 projects, not just the last one
      const drop=list.slice(8);
      for(const d of drop){ try{ await window.storage.delete(slotKey(d.id)); }catch(e){} }
      await writeSlots(list.slice(0,8));
    }catch(e){}
  }, 1200);
}
async function loadSlot(id){
  try{
    const r=await window.storage.get(slotKey(id));
    return r? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function tryRestore(){
  const list=await readSlots();
  if(list.length) return await loadSlot(list[0].id);
  // migrate the old single-key autosave if it's still there
  try{
    if(!window.storage) return null;
    const r=await window.storage.get("mapforge_autosave");
    return r? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
function adoptRestored(saved){
  P=saved.p;
  origName=saved.name||"map";
  origHTML=saved.html||null;
  P.labels=P.labels||[];
  $("#sel-theme").value=P.theme||"lotr";
  undoStack.length=0; redoStack.length=0; clearSelection();
  setEmpty(false); fitView(); panel(); setTool("select"); updateUndoUI();
  toast(origHTML? "Session restored, including the game HTML — “Save game HTML” still works."
                : "Session restored. Re-open the original game HTML if you need to save back into it.");
}

/* ---------------- import: game HTML ---------------- */
function extractBlock(text, name){
  // matches `const NAME = <expr>;` where expr is a single JSON-ish literal.
  const re = new RegExp("const\\s+"+name+"\\s*=\\s*");
  const m = re.exec(text); if(!m) return null;
  let i = m.index + m[0].length, depth=0, inStr=false, q="";
  for(let j=i;j<text.length;j++){
    const c=text[j];
    if(inStr){ if(c==="\\") j++; else if(c===q) inStr=false; continue; }
    if(c==='"'||c==="'") { inStr=true; q=c; continue; }
    if(c==="{"||c==="[") depth++;
    else if(c==="}"||c==="]"){ depth--; if(depth===0){
      // consume to the terminating ;
      let k=j+1; while(k<text.length && text[k]!==";") k++;
      return { start:m.index, exprStart:i, exprEnd:j+1, end:k+1, expr:text.slice(i,j+1) };
    }}
  }
  return null;
}
/* D2 — opened files are other people's code. Try strict JSON, then a
   tolerant JSON5-ish normaliser that handles the things a hand-written game
   file actually contains (unquoted keys, single quotes, trailing commas,
   comments). Only if both fail do we consider `new Function`, and then only
   after the user says yes to a warning. */
function stripComments(src){
  let out="", i=0;
  const n=src.length;
  while(i<n){
    const c=src[i];
    if(c==="/"&&src[i+1]==="/"){ while(i<n&&src[i]!=="\n") i++; continue; }
    if(c==="/"&&src[i+1]==="*"){ i+=2; while(i<n&&!(src[i]==="*"&&src[i+1]==="/")) i++; i+=2; continue; }
    if(c==='"'||c==="'"){
      const q=c; out+=c; i++;
      while(i<n){
        if(src[i]==="\\"){ out+=src[i]+(src[i+1]||""); i+=2; continue; }
        out+=src[i];
        if(src[i]===q){ i++; break; }
        i++;
      }
      continue;
    }
    out+=c; i++;
  }
  return out;
}
function relaxedJSONParse(raw){
  // comments come out first: otherwise a trailing comma followed by a comment
  // is invisible to the lookahead below
  const src=stripComments(raw);
  let out="", i=0;
  const n=src.length;
  const isIdentStart=c=>/[A-Za-z_$]/.test(c);
  while(i<n){
    const c=src[i];
    // single-quoted -> double-quoted
    if(c==="'"){
      let j=i+1, buf="";
      while(j<n){
        if(src[j]==="\\"){ buf+=src[j]+(src[j+1]||""); j+=2; continue; }
        if(src[j]==="'") break;
        buf += src[j]==='"' ? '\\"' : src[j];
        j++;
      }
      out+='"'+buf+'"'; i=j+1; continue;
    }
    if(c==='"'){
      let j=i+1; out+='"';
      while(j<n){
        if(src[j]==="\\"){ out+=src[j]+(src[j+1]||""); j+=2; continue; }
        out+=src[j];
        if(src[j]==='"'){ j++; break; }
        j++;
      }
      i=j; continue;
    }
    // quote bare object keys
    if(isIdentStart(c)){
      let j=i, word="";
      while(j<n && /[A-Za-z0-9_$]/.test(src[j])){ word+=src[j]; j++; }
      let k=j; while(k<n && /\s/.test(src[k])) k++;
      if(src[k]===":" && !["true","false","null"].includes(word)){
        out+='"'+word+'"'; i=j; continue;
      }
      out+=word; i=j; continue;
    }
    // drop trailing commas
    if(c===","){
      let k=i+1; while(k<n && /\s/.test(src[k])) k++;
      if(src[k]==="}"||src[k]==="]"){ i++; continue; }
    }
    out+=c; i++;
  }
  return JSON.parse(out);
}
let allowEval=false;
function evalExpr(src){
  try{ return JSON.parse(src); }catch(e){}
  try{ return relaxedJSONParse(src); }catch(e){}
  if(!allowEval){
    allowEval = confirm(
      "Map Forge couldn't read this file's map data as plain data.\n\n"+
      "It can try running that section of the file as JavaScript instead. "+
      "Only do this for a file you trust \u2014 running code from an untrusted "+
      "file is a security risk.\n\nRun it?");
    if(!allowEval) return null;
  }
  try{ return (new Function("return ("+src+")"))(); }catch(e2){ return null; }
}
function loadGameHTML(text, name){
  const bD=extractBlock(text,"DATA"), bG=extractBlock(text,"MAPGEO"), bT=extractBlock(text,"TERRAIN");
  if(!bD || !bG){ toast("Couldn't find DATA / MAPGEO blocks in that file."); return false; }
  const DATA=evalExpr(bD.expr), GEO=evalExpr(bG.expr);
  const TER = bT ? (evalExpr(bT.expr)||[]) : [];
  if(!DATA||!DATA.regions||!GEO||!GEO.cells){ toast("Map data in that file didn't parse."); return false; }
  origHTML = text.replace(/\s*<script id="mapforge-shim">[\s\S]*?<\/script>/i,"");
  origName = (name||"map").replace(/\.(html?|json)$/i,"");
  P = newProject(1000, 940);
  P.extra = { data:DATA };           // keep nations/pools/cards etc. untouched on save
  P.regions = DATA.regions.map(r=>Object.assign({},r));
  P.nations = {}; for(const k in (DATA.nations||{})) P.nations[k]=Object.assign({color:autoColor(k)},DATA.nations[k]);
  P.cells = {};
  for(const id in GEO.cells){ const c=GEO.cells[id];
    P.cells[id]={ pts:(parseD(c.d)[0]||[]), a:c.a?c.a.slice():null, r:c.r, tap:c.tap }; }
  P.walls = (GEO.walls||[]).filter(w=>w.length<=4).map(w=>w.slice(0,4));
  P.roads = (GEO.roads||[]).map(r=>({a:r.a,b:r.b,p:(r.p||[]).slice(),gap:r.gap}));
  P.land  = parseD(GEO.land||"");
  P.labels = Array.isArray(GEO.labels)? GEO.labels.map(L=>Object.assign({},L)) : [];
  P.iconScale = GEO.iconScale||1;
  P.terrain = TER.map(t=>Object.assign({},t, t.via?{via:t.via.slice()}:{}));
  // view bounds from land / cells
  let xs=[],ys=[];
  P.land.flat().forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  Object.values(P.cells).forEach(c=>c.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  if(xs.length){ P.w=Math.ceil(Math.max(...xs)+20); P.h=Math.ceil(Math.max(...ys)+20);
    vb={x:Math.min(...xs)-20, y:Math.min(...ys)-20, w:(Math.max(...xs)-Math.min(...xs))+40, h:(Math.max(...ys)-Math.min(...ys))+40}; }
  else { vb={x:0,y:0,w:P.w,h:P.h}; }
  undoStack.length=0; redoStack.length=0; sel=null;
  refreshBorders();
  const bc=P.terrain.filter(f=>f.t==="border").length;
  toast("Loaded "+P.regions.length+" regions, "+P.walls.length+" walls, "+P.roads.length+" roads, "+
        P.terrain.length+" terrain features"+(bc?" ("+bc+" border features)":"")+".");
  return true;
}
function autoColor(seed){
  let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))%360;
  return "hsl("+h+",42%,52%)";
}

/* ---------------- A9: import SVG / GeoJSON ----------------
   Curves are sampled with getPointAtLength rather than parsed, so arcs and
   béziers from Illustrator or Inkscape come in at whatever fidelity we ask
   for instead of being dropped. */
function sampleSVGShape(node, tol){
  const holder=document.createElementNS(NS,"svg");
  holder.setAttribute("width","1"); holder.setAttribute("height","1");
  holder.style.cssText="position:absolute;left:-9999px;top:-9999px;visibility:hidden";
  document.body.appendChild(holder);
  const clone=node.cloneNode(true);
  holder.appendChild(clone);
  let pts=[];
  try{
    const L=clone.getTotalLength? clone.getTotalLength() : 0;
    if(L>0){
      const n=Math.max(12, Math.min(600, Math.round(L/Math.max(1.5,tol))));
      for(let i=0;i<n;i++){ const q=clone.getPointAtLength(L*i/n); pts.push([q.x,q.y]); }
    }
  }catch(e){}
  holder.remove();
  return pts;
}
function importSVGText(text, fname){
  const doc=new DOMParser().parseFromString(text,"image/svg+xml");
  if(doc.querySelector("parsererror")){ toast("That SVG didn't parse."); return false; }
  const root=doc.documentElement;
  const nodes=[...root.querySelectorAll("path,polygon,polyline,rect,circle,ellipse")];
  if(!nodes.length){ toast("No drawable shapes found in that SVG."); return false; }
  const rings=[];
  nodes.forEach(n=>{
    // rect/circle/ellipse have no getTotalLength — convert them first
    let src=n;
    if(/^(rect|circle|ellipse)$/i.test(n.tagName)){
      const p=document.createElementNS(NS,"path");
      const g=(a,d)=>parseFloat(n.getAttribute(a)||d||0);
      if(n.tagName.toLowerCase()==="rect"){
        const x=g("x"),y=g("y"),w=g("width"),h=g("height");
        p.setAttribute("d",`M${x},${y}H${x+w}V${y+h}H${x}Z`);
      } else {
        const cx=g("cx"),cy=g("cy"),rx=g("r")||g("rx"),ry=g("r")||g("ry");
        p.setAttribute("d",`M${cx-rx},${cy}a${rx},${ry} 0 1 0 ${rx*2},0a${rx},${ry} 0 1 0 ${-rx*2},0Z`);
      }
      src=p;
    }
    const pts=sampleSVGShape(src, 2.2);
    if(pts.length>4){
      const label=n.getAttribute("id")||n.getAttribute("data-name")||n.getAttribute("inkscape:label")||"";
      rings.push({pts:simplifyRing(pts,1.0), label});
    }
  });
  if(!rings.length){ toast("Couldn't sample any usable outlines from that SVG."); return false; }
  return placeImportedRings(rings, fname, "SVG");
}
function importGeoJSONText(text, fname){
  let j; try{ j=JSON.parse(text); }catch(e){ toast("That GeoJSON didn't parse."); return false; }
  const feats = j.type==="FeatureCollection" ? (j.features||[])
              : j.type==="Feature" ? [j]
              : j.type && j.coordinates ? [{geometry:j, properties:{}}] : [];
  if(!feats.length){ toast("No GeoJSON features found."); return false; }
  const rings=[];
  feats.forEach(f=>{
    const g=f.geometry; if(!g) return;
    const label=(f.properties&&(f.properties.name||f.properties.NAME||f.properties.title))||"";
    const polys = g.type==="Polygon" ? [g.coordinates]
                : g.type==="MultiPolygon" ? g.coordinates : [];
    polys.forEach(poly=>{
      const outer=poly[0];
      if(outer&&outer.length>3) rings.push({pts:outer.map(c=>[c[0],c[1]]), label, geo:true});
    });
  });
  if(!rings.length){ toast("Only Polygon / MultiPolygon features can be imported."); return false; }
  // equirectangular projection with a latitude correction, then fit to the map
  const allLat=rings.flatMap(r=>r.pts.map(p=>p[1]));
  const midLat=(Math.min(...allLat)+Math.max(...allLat))/2;
  const k=Math.cos(midLat*Math.PI/180)||1;
  rings.forEach(r=>{ r.pts=r.pts.map(([lon,lat])=>[lon*k, -lat]); });
  return placeImportedRings(rings, fname, "GeoJSON");
}
/* scale imported outlines to fit the map area, then make them regions */
function placeImportedRings(rings, fname, what){
  const xs=rings.flatMap(r=>r.pts.map(p=>p[0])), ys=rings.flatMap(r=>r.pts.map(p=>p[1]));
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=40, tw=(P.w||1000)-pad*2, th=(P.h||940)-pad*2;
  const s=Math.min(tw/Math.max(1e-6,x1-x0), th/Math.max(1e-6,y1-y0));
  const ox=pad+(tw-(x1-x0)*s)/2, oy=pad+(th-(y1-y0)*s)/2;
  pushUndo();
  const made=[];
  rings.forEach((r,i)=>{
    let pts=r.pts.map(p=>[+((p[0]-x0)*s+ox).toFixed(2), +((p[1]-y0)*s+oy).toFixed(2)]);
    if(pts.length>300) pts=simplifyRing(pts,1.2);
    if(pts.length<3) return;
    const name=(r.label||"").trim() || ("Region "+(P.regions.length+made.length+1));
    const id=slug(name);
    const a=centroid(pts);
    P.regions.push({id,name,nation:null,settle:null,
      x:+a[0].toFixed(1),y:+a[1].toFixed(1),adj:[],start:null});
    P.cells[id]={pts, a:[+a[0].toFixed(1),+a[1].toFixed(1)], r:+inradius(pts,a).toFixed(1)};
    made.push(id);
  });
  if(!made.length){ toast("Nothing usable in that file."); return false; }
  setSelection(made);
  fitView(); panel(); render();
  toast("Imported "+made.length+" outline"+(made.length>1?"s":"")+" from "+what+
        ". Run Auto-link to wire up adjacency.", {action:"Auto-link", onAction:()=>autoLink(4)});
  return true;
}

/* ---------------- export ---------------- */
function borderWallSegments(){
  const out=[];
  P.terrain.forEach(f=>{
    if(f.t!=="border" || !(f.style==="ridge"||f.style==="wall")) return;
    const pts=f.pts||[];
    for(let i=0;i<pts.length-1;i++)
      out.push([+pts[i][0].toFixed(1),+pts[i][1].toFixed(1),
                +pts[i+1][0].toFixed(1),+pts[i+1][1].toFixed(1),"mf"]);
  });
  return out;
}
function serializeGEO(){
  const cells={};
  for(const r of P.regions){
    const c=P.cells[r.id]; if(!c||c.pts.length<3){ if(c) cells[r.id]={d:"",a:c.a||[r.x,r.y],r:c.r||10, ...(c.tap?{tap:c.tap}:{})}; continue; }
    const a=c.a||centroid(c.pts);
    const rr=+inradius(c.pts,a).toFixed(1);
    const o={ d:ringD(c.pts), a:[+a[0].toFixed(1),+a[1].toFixed(1)], r:rr };
    if(c.tap) o.tap=c.tap; else if(rr<8) o.tap=13.0;
    cells[r.id]=o;
  }
  const roads=P.roads.map(r=>{
    const gap = r.p&&r.p.length===4 ? +Math.hypot(r.p[2]-r.p[0],r.p[3]-r.p[1]).toFixed(1) : (r.gap||0);
    return {a:r.a,b:r.b,p:r.p,gap};
  });
  const suspect=roads.filter(r=>r.gap>60).map(r=>({a:r.a,b:r.b,gap:r.gap}));
  const geo={ cells, walls:P.walls.map(w=>w.slice(0,4).map(v=>+(+v).toFixed(1))).concat(borderWallSegments()),
              roads, suspect, land:ringsD(P.land) };
  // extra keys the base engine ignores, but the shim and Map Forge both read
  if(P.labels&&P.labels.length) geo.labels=P.labels;
  if(P.iconScale&&P.iconScale!==1) geo.iconScale=P.iconScale;
  return geo;
}
function serializeDATA(){
  const base = P.extra && P.extra.data ? Object.assign({},P.extra.data) : {};
  base.regions = P.regions.map(r=>{
    const o=Object.assign({},r);
    o.x=+(+o.x).toFixed(1); o.y=+(+o.y).toFixed(1);
    o.adj=(o.adj||[]).slice().sort();
    delete o.color;
    if(!o.terr) delete o.terr;
    return o;
  });
  const nat={}; for(const k in P.nations){ const n=Object.assign({},P.nations[k]); nat[k]=n; }
  base.nations = nat;
  if(!base.pools) base.pools={};
  if(!base.cards) base.cards=[];
  return base;
}
function download(name, text, mime){
  const b=new Blob([text],{type:mime||"text/plain"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* Border rivers, border forests and lakes have no equivalent in the base
   engine's terrain painter, so when the map uses them we append a small script
   that extends drawTerrain. Border mountains and barriers need no shim — they
   are exported as wall segments, which the engine already draws with peaks. */
function needsShim(){
  return (P.labels&&P.labels.length>0) ||
    P.terrain.some(f => f.t==="lake" || (f.t==="river"&&f.free) ||
    (f.t==="border" && (f.style==="river"||f.style==="forest")));
}
function shimScript(){
  const body = `
(function(){
  if (typeof drawTerrain !== "function" || typeof TERRAIN === "undefined") return;
  var NS = "http://www.w3.org/2000/svg";
  function E(t,a,p){ var n=document.createElementNS(NS,t);
    for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }
  function line(p){ return "M"+p.map(function(q){return q[0]+","+q[1];}).join("L"); }
  function curve(p){
    if(p.length<2) return "";
    var d="M"+p[0][0]+","+p[0][1];
    for(var i=0;i<p.length-1;i++){
      var p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
      d+="C"+(p1[0]+(p2[0]-p0[0])/6)+","+(p1[1]+(p2[1]-p0[1])/6)+" "+
             (p2[0]-(p3[0]-p1[0])/6)+","+(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+","+p2[1];
    }
    return d;
  }
  function trees(p,size,g){
    for(var i=0;i<p.length-1;i++){
      var a=p[i], b=p[i+1], L=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.max(1,Math.round(L/(size*1.5)));
      for(var j=0;j<n;j++){
        var t=j/n, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t, s=size*(0.8+((j*7919)%5)/10);
        E("path",{"class":"tree",d:"M"+x+","+(y-s)+"L"+(x-s*0.8)+","+(y+s*0.25)+"L"+(x+s*0.8)+","+(y+s*0.25)+"Z"+
          "M"+x+","+(y-s*1.5)+"L"+(x-s*0.6)+","+(y-s*0.45)+"L"+(x+s*0.6)+","+(y-s*0.45)+"Z"},g);
      }
    }
  }
  function labels(g){
    var LS = (typeof MAPGEO !== "undefined" && MAPGEO.labels) || [];
    LS.forEach(function(L){
      if(!L.text) return;
      var t = E("text", {x:L.x, y:L.y, "text-anchor":"middle",
        "font-family":"'Iowan Old Style',Palatino,Georgia,serif",
        "font-size":(L.size||16), fill:(L.color||"#cdbf97"),
        "paint-order":"stroke", stroke:"#0e1118", "stroke-width":2.6,
        "stroke-opacity":0.7, opacity:(L.opacity===undefined?1:L.opacity)}, g);
      if(L.italic) t.setAttribute("font-style","italic");
      if(L.weight) t.setAttribute("font-weight",L.weight);
      if(L.track) t.setAttribute("letter-spacing",L.track);
      if(L.rot) t.setAttribute("transform","rotate("+L.rot+" "+L.x+" "+L.y+")");
      t.textContent = L.text;
    });
  }
  var base = drawTerrain;
  window.drawTerrain = function(g){
    base(g);
    TERRAIN.slice().sort(function(a,b){ return (a.z||0)-(b.z||0); }).forEach(function(f){
      if(f.t === "river" && f.free && f.pts && f.pts.length > 1){
        var rd = curve(f.pts);
        E("path",{"class":"riverbed",d:rd,"stroke-width":(f.w||2.4)},g);
        E("path",{"class":"riverlit",d:rd,"stroke-width":(f.w||2.4)*0.45},g);
      } else if(f.t === "border" && f.pts && f.pts.length > 1){
        if(f.style === "river"){
          var d = curve(f.pts);
          E("path",{"class":"riverbed",d:d,"stroke-width":(f.w||2.6)},g);
          E("path",{"class":"riverlit",d:d,"stroke-width":(f.w||2.6)*0.45},g);
        } else if(f.style === "forest"){
          trees(f.pts, f.size||4, g);
        }
      } else if(f.t === "lake" && f.pts && f.pts.length > 2){
        E("path",{d:line(f.pts)+"Z",fill:"#274766",stroke:"#5b8dae","stroke-width":1,opacity:0.9},g);
      }
    });
    labels(g);
  };
  try{ if(typeof drawMap === "function"){ drawMap(); if(typeof renderSheet === "function") renderSheet(); } }catch(e){}
})();`;
  return '<script id="mapforge-shim">'+body+'\n<'+'/script>';
}

function exportArea(which){
  if(which==="view") return {x:vb.x,y:vb.y,w:vb.w,h:vb.h};
  if(which==="map")  return {x:0,y:0,w:P.w,h:P.h};
  let xs=[],ys=[];
  P.land.flat().forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  Object.values(P.cells).forEach(c=>c.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  P.regions.forEach(r=>{xs.push(r.x);ys.push(r.y);});
  if(!xs.length) return {x:0,y:0,w:P.w,h:P.h};
  const pad=16, x0=Math.min(...xs)-pad, y0=Math.min(...ys)-pad;
  return {x:x0, y:y0, w:Math.max(1,Math.max(...xs)+pad-x0), h:Math.max(1,Math.max(...ys)+pad-y0)};
}

function buildExportSVG(o){
  const base=exportArea(o.area);
  const bleed=o.bleed||0;
  const area={x:base.x-bleed, y:base.y-bleed, w:base.w+bleed*2, h:base.h+bleed*2};
  const clone=svg.cloneNode(true);
  clone.querySelectorAll(".editor-only").forEach(n=>n.remove());
  if(!o.image) clone.querySelectorAll("image").forEach(n=>n.remove());
  if(!o.labels) clone.querySelectorAll(".rgname,.maplabel").forEach(n=>n.remove());
  if(!o.nodes) clone.querySelectorAll(".node,.settle-t,.settle-ring,.settle-ico").forEach(n=>n.remove());
  if(o.transparent) clone.querySelectorAll(".vignette").forEach(n=>n.remove());
  clone.querySelectorAll(".labelhit,.terrhit").forEach(n=>n.remove());
  clone.setAttribute("viewBox", area.x+" "+area.y+" "+area.w+" "+area.h);
  clone.setAttribute("width", area.w); clone.setAttribute("height", area.h);
  clone.setAttribute("xmlns",NS);
  clone.setAttributeNS("http://www.w3.org/2000/xmlns/","xmlns:xlink","http://www.w3.org/1999/xlink");
  if(!o.transparent){
    const bg=document.createElementNS(NS,"rect");
    bg.setAttribute("x",area.x); bg.setAttribute("y",area.y);
    bg.setAttribute("width",area.w); bg.setAttribute("height",area.h);
    bg.setAttribute("fill",(THEMES[P.theme]||THEMES.lotr).sea);
    clone.insertBefore(bg, clone.firstChild);
  }
  const style=document.createElementNS(NS,"style"); style.textContent=exportCSS();
  clone.insertBefore(style, clone.firstChild);
  // D5 — crop marks sit in the bleed, trim line marks the cut
  if(o.cutlines){
    const g=document.createElementNS(NS,"g");
    g.setAttribute("fill","none");
    g.setAttribute("stroke", o.transparent? "#888" : theme().label);
    g.setAttribute("stroke-width", Math.max(.35, area.w/2400));
    const t={x:base.x,y:base.y,w:base.w,h:base.h};
    const mk=(x1,y1,x2,y2)=>{ const l=document.createElementNS(NS,"line");
      l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
      g.appendChild(l); };
    const arm=Math.max(6,(bleed||10)*0.8), gap=Math.max(2,(bleed||10)*0.25);
    [[t.x,t.y,-1,-1],[t.x+t.w,t.y,1,-1],[t.x,t.y+t.h,-1,1],[t.x+t.w,t.y+t.h,1,1]]
      .forEach(([x,y,sx,sy])=>{
        mk(x+sx*gap, y, x+sx*(gap+arm), y);
        mk(x, y+sy*gap, x, y+sy*(gap+arm));
      });
    const r=document.createElementNS(NS,"rect");
    r.setAttribute("x",t.x); r.setAttribute("y",t.y);
    r.setAttribute("width",t.w); r.setAttribute("height",t.h);
    r.setAttribute("stroke-dasharray","6 5"); r.setAttribute("opacity",".5");
    g.appendChild(r);
    clone.appendChild(g);
  }
  return {node:clone, area};
}
function saveSVG(o){

function savePNG(o){

function buildDefs(host){
  const t=theme();
  const defs=el("defs",{},host);
  // terrain hatch patterns
  for(const key in TERR_PATTERNS){
    const P0=TERR_PATTERNS[key];
    const pat=el("pattern",{id:"mf-pat-"+key, width:P0.size, height:P0.size,
      patternUnits:"userSpaceOnUse"},defs);
    const g=el("g",{},pat);
    g.innerHTML=P0.marks;
    g.setAttribute("fill", P0.fill? t.peakstroke : "none");
    g.setAttribute("stroke", P0.w? t.peakstroke : "none");
    if(P0.w) g.setAttribute("stroke-width", P0.w);
    g.setAttribute("stroke-linecap","round");
    g.setAttribute("opacity",".38");
  }
  // tree / peak shading gradients
  const tg=el("linearGradient",{id:"mf-treeg",x1:"0",y1:"0",x2:"1",y2:"1"},defs);
  el("stop",{offset:"0","stop-color":t.treelit},tg);
  el("stop",{offset:"1","stop-color":t.tree},tg);
  const pg=el("linearGradient",{id:"mf-peakg",x1:"0",y1:"0",x2:"1",y2:"0.6"},defs);
  el("stop",{offset:"0","stop-color":t.peaklit},pg);
  el("stop",{offset:"1","stop-color":t.peak},pg);
  // paper grain
  const gr=el("filter",{id:"mf-grain",x:"-5%",y:"-5%",width:"110%",height:"110%"},defs);
  el("feTurbulence",{type:"fractalNoise",baseFrequency:"0.85",numOctaves:"4",stitchTiles:"stitch",result:"n"},gr);
  el("feColorMatrix",{type:"saturate",values:"0"},gr);
  // hand-drawn wobble
  const wb=el("filter",{id:"mf-wobble",x:"-6%",y:"-6%",width:"112%",height:"112%"},defs);
  el("feTurbulence",{type:"fractalNoise",baseFrequency:"0.028",numOctaves:"3",seed:"7",result:"t"},wb);
  el("feDisplacementMap",{in:"SourceGraphic",in2:"t",scale:"2.6",
    xChannelSelector:"R",yChannelSelector:"G"},wb);
  // vignette
  const vg=el("radialGradient",{id:"mf-vig",cx:"50%",cy:"50%",r:"72%"},defs);
  el("stop",{offset:"0.55","stop-color":"#000","stop-opacity":"0"},vg);
  el("stop",{offset:"1","stop-color":"#000","stop-opacity":"0.34"},vg);
  return defs;
}
/* multi-strand coastline halo — the "water lines" trick that makes a map read

function drawCoastHalo(g, d){

function render(){

  svg.innerHTML="";

    const im=el("image",{href:bgImg.url, x:bgImg.x, y:bgImg.y,

      opacity:bgImg.opacity, class:"refimg", "pointer-events":"none"},svg);
    im.setAttributeNS("http://www.w3.org/1999/xlink","href",bgImg.url);
  }
  // land (+ coastline halo + paper grain)
  const gLand=el("g",{id:"gLand"},svg);

    const d=ringsD(P.land);
    if(show.coastlines) drawCoastHalo(gLand, d);
    const lp=el("path",{class:"land",d,"fill-rule":"evenodd"},gLand);
    if(show.wobble) lp.setAttribute("filter","url(#mf-wobble)");

  }

  const gDeco=el("g",{id:"gDeco","pointer-events":"none"},svg);
  if(show.cells) for(const r of P.regions){
    const c=P.cells[r.id];
    if(c&&c.deco&&c.deco.length) el("path",{class:"deco",d:ringD(c.deco)},gDeco);
  }
  // terrain
  if(show.terrain){ const gT=el("g",{id:"gTerr","pointer-events":"none"},svg); drawTerrain(gT); }
  // walls & roads
  if(show.walls){ const gW=el("g",{},svg);
    P.walls.forEach((w,i)=> el("line",{class:"wall"+(sel&&sel.type==="wall"&&sel.idx===i?" sel":""),
      x1:w[0],y1:w[1],x2:w[2],y2:w[3],"data-wall":i},gW)); }
  if(show.roads){ const gR=el("g",{},svg);
    P.roads.forEach((r,i)=>{ if(r.p&&r.p.length===4)
      el("line",{class:"roadline"+(sel&&sel.type==="road"&&sel.idx===i?" sel":""),
        x1:r.p[0],y1:r.p[1],x2:r.p[2],y2:r.p[3],"data-road":i},gR); }); }

  if(show.adj){ const gA=el("g",{class:"editor-only"},svg); const seen=new Set();
    for(const r of P.regions) for(const b of (r.adj||[])){

function drawLabels(host){
  if(!P.labels||!P.labels.length||!show.labels) return;
  const g=el("g",{id:"gLabels"},host);
  P.labels.forEach((L,i)=>{
    const size=L.size||16, isSel=sel&&sel.type==="label"&&sel.idx===i;
    const style=`font-size:${size}px;`+
      (L.color?`fill:${L.color};`:"")+

      (L.font==="sans"?"font-family:var(--sans);":"")+
      (L.opacity!==undefined?`opacity:${L.opacity};`:"");
    if(L.curve){
      // bend the baseline into an arc and run the text along it (textPath)
      const w=Math.max(30,(L.text||"").length*size*.56);

        fill:"none"},defs);
      const txt=el("text",{class:"maplabel"+(isSel?" sel":""),style,"data-label":i},g);
      if(L.rot) txt.setAttribute("transform",`rotate(${L.rot} ${fmt(L.x)} ${fmt(L.y)})`);
      const tp=el("textPath",{startOffset:"50%"},txt);
      tp.setAttributeNS("http://www.w3.org/1999/xlink","href","#"+pid);

    } else {
      const txt=el("text",{class:"maplabel"+(isSel?" sel":""),x:L.x,y:L.y,style,"data-label":i},g);
      if(L.rot) txt.setAttribute("transform",`rotate(${L.rot} ${fmt(L.x)} ${fmt(L.y)})`);
      txt.textContent=L.text||"";

/* terrain painters (mirrors the game's drawing so edits preview faithfully) */
function REGxy(id){ const r=byId(id); return r?[r.x,r.y]:null; }
function terrainPoints(via){ return (via||[]).map(REGxy).filter(Boolean); }
function smoothPath(pts){
  if(pts.length<2) return "";
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=`C${fmt(p1[0]+(p2[0]-p0[0])/6)},${fmt(p1[1]+(p2[1]-p0[1])/6)} ${fmt(p2[0]-(p3[0]-p1[0])/6)},${fmt(p2[1]-(p3[1]-p1[1])/6)} ${p2[0]},${p2[1]}`;
  } return d;

/* ---------- painterly terrain (B1) ----------
   Mountains get an asymmetric 5-point silhouette with a lit face, a cast
   shadow and a snow cap; trees come in three species with a trunk, a lit
   side and a ground shadow. Everything is jittered from a stable hash of its
   position, so a range looks hand-placed but never changes between renders. */
function hash2(x,y,k){
  let h=Math.sin(x*12.9898+y*78.233+(k||0)*37.719)*43758.5453;
  return h-Math.floor(h);
}
/* one mountain, drawn back-to-front by the caller */
function drawPeak(x,y,h,g,cls){
  const w=h*1.35, r1=hash2(x,y,1), r2=hash2(x,y,2), r3=hash2(x,y,3);
  const lean=(r1-.5)*w*.42;                 // summit offset — no two alike
  const sx=x+lean, base=y+h*.35;
  const shL=w*(.82+r2*.3), shR=w*(.82+r3*.3);
  const shoulderL=[x-shL*.55, y-h*.30-r2*h*.10];
  const shoulderR=[x+shR*.55, y-h*.26-r3*h*.10];
  // cast shadow on the ground
  el("ellipse",{class:"peakshadow",cx:fmt(x+w*.22),cy:fmt(base),rx:fmt(w*.95),ry:fmt(h*.13)},g);
  // main silhouette
  el("path",{class:cls||"peak",d:
    `M${fmt(x-w)},${fmt(base)}`+
    `L${fmt(shoulderL[0])},${fmt(shoulderL[1])}`+
    `L${fmt(sx)},${fmt(y-h)}`+
    `L${fmt(shoulderR[0])},${fmt(shoulderR[1])}`+
    `L${fmt(x+w)},${fmt(base)}Z`},g);
  // lit right-hand face
  el("path",{class:"peaklit",d:
    `M${fmt(sx)},${fmt(y-h)}L${fmt(shoulderR[0])},${fmt(shoulderR[1])}L${fmt(x+w)},${fmt(base)}`+
    `L${fmt(sx+w*.16)},${fmt(base)}Z`, opacity:.55},g);
  // snow cap, following the summit lean
  if(h>5) el("path",{class:"snow",d:
    `M${fmt(sx)},${fmt(y-h)}`+
    `L${fmt(sx-w*.30)},${fmt(y-h*.62)}`+
    `L${fmt(sx-w*.12)},${fmt(y-h*.70)}`+
    `L${fmt(sx+w*.06)},${fmt(y-h*.55)}`+
    `L${fmt(sx+w*.26)},${fmt(y-h*.66)}Z`},g);
}
/* a stretch of mountains, depth-sorted so nearer peaks overlap further ones */
function peaksAlong(pts,s,g,cls){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1], seg=Math.hypot(x2-x1,y2-y1);
    const n=Math.max(1,Math.round(seg/(15*s)));
    for(let j=0;j<n;j++){
      const t=j/n, x0=x1+(x2-x1)*t, y0=y1+(y2-y1)*t;
      const jx=(hash2(x0,y0,4)-.5)*7*s, jy=(hash2(x0,y0,5)-.5)*5*s;
      const x=x0+jx, y=y0+jy;
      out.push([x, y, (8.5+hash2(x0,y0,6)*5.5)*s]);
    }
  }
  out.sort((a,b)=>a[1]-b[1]);                    // back to front
  out.forEach(([x,y,h])=>drawPeak(x,y,h,g,cls));
}
/* three species so a forest doesn't read as one stamp repeated */
function drawTree(x,y,s,g,variant){

  if(variant===0){            // conifer — stacked tiers
    el("rect",{class:"treetrunk",x:fmt(x-s*.10),y:fmt(y-s*.05),width:fmt(s*.20),height:fmt(s*.38)},g);
    el("path",{class:"tree",d:
      `M${fmt(x)},${fmt(y-s*1.62)}L${fmt(x-s*.58)},${fmt(y-s*.48)}L${fmt(x+s*.58)},${fmt(y-s*.48)}Z`+
      `M${fmt(x)},${fmt(y-s*1.02)}L${fmt(x-s*.80)},${fmt(y+s*.10)}L${fmt(x+s*.80)},${fmt(y+s*.10)}Z`},g);
    el("path",{class:"treelit",d:
      `M${fmt(x)},${fmt(y-s*1.62)}L${fmt(x)},${fmt(y-s*.48)}L${fmt(x+s*.58)},${fmt(y-s*.48)}Z`},g);
  } else if(variant===1){     // broadleaf — round crown
    el("rect",{class:"treetrunk",x:fmt(x-s*.11),y:fmt(y-s*.30),width:fmt(s*.22),height:fmt(s*.55)},g);
    el("circle",{class:"tree",cx:fmt(x),cy:fmt(y-s*.72),r:fmt(s*.72)},g);
    el("path",{class:"treelit",d:
      `M${fmt(x)},${fmt(y-s*1.44)}A${fmt(s*.72)},${fmt(s*.72)} 0 0 1 ${fmt(x)},${fmt(y)}Z`},g);
  } else {                    // scrub — low twin crown
    el("rect",{class:"treetrunk",x:fmt(x-s*.09),y:fmt(y-s*.14),width:fmt(s*.18),height:fmt(s*.40)},g);
    el("circle",{class:"tree",cx:fmt(x-s*.28),cy:fmt(y-s*.46),r:fmt(s*.48)},g);
    el("circle",{class:"tree",cx:fmt(x+s*.30),cy:fmt(y-s*.60),r:fmt(s*.54)},g);

  }

function treesAlong(pts,size,g){
  const line=densifyPolyline(pts, Math.max(3,size*1.5));
  const out=line.map((p,i)=>{
    const h1=hash2(p[0],p[1],7), h2=hash2(p[0],p[1],8);
    return [p[0]+(h1-.5)*size*.9, p[1]+((i%2)?size*.3:0)+(h2-.5)*size*.7,

/* B5 — features draw in z order (default 0), stable within a layer */
function terrainOrder(){

    .sort((a,b)=>((a.f.z||0)-(b.f.z||0)) || (a.idx-b.idx));
}
function riverPts(f){ return (f.free&&f.pts&&f.pts.length)? f.pts : terrainPoints(f.via); }
function drawTerrain(g){
