/* =========================================================================
   10.3 — REAL-TIME COLLABORATION
   -------------------------------------------------------------------------
   Honest scope: this is a single-file tool with no server, so this is
   *same-device, multi-window* collaboration over BroadcastChannel — two
   browser windows, or a designer and a second screen. It gives live presence,
   a shared cursor and pushed edits, which is genuinely most of the value of
   collaboration during a working session, without pretending to be a hosted
   service (§11.2 declines that deliberately).
   ========================================================================= */
MFX2.collab = { on: false, ch: null, id: null, peers: new Map(), name: null, applying: false };
MFX2.startCollab = function (roomRaw) {
  if (!window.BroadcastChannel) { toast("This browser can't share sessions between windows."); return; }
  const room = slug(roomRaw || origName || "mapforge") || "mapforge";
  MFX2.stopCollab();
  const C = MFX2.collab;
  C.id = "u" + Math.random().toString(36).slice(2, 7);
  C.name = MFX2.prefs.author || ("Designer " + C.id.slice(1, 3));
  C.room = room;
  C.ch = new BroadcastChannel("mapforge:" + room);
  C.on = true;
  C.ch.onmessage = ev => MFX2.onCollab(ev.data);
  C.ch.postMessage({ t: "hello", id: C.id, name: C.name });
  C.ping = setInterval(() => {
    C.ch.postMessage({ t: "ping", id: C.id, name: C.name });
    const now = Date.now();
    [...C.peers].forEach(([k, v]) => { if (now - v.at > 9000) C.peers.delete(k); });
    MFX2.paintPresence();
  }, 3000);
  svg.addEventListener("pointermove", MFX2.collabCursor);
  panel();
  toast("Sharing session “" + room + "”. Open this file in another window and join the same name.");
};
MFX2.stopCollab = function () {
  const C = MFX2.collab;
  if (C.ch) { try { C.ch.postMessage({ t: "bye", id: C.id }); C.ch.close(); } catch (e) {} }
  clearInterval(C.ping);
  svg.removeEventListener("pointermove", MFX2.collabCursor);
  C.on = false; C.ch = null; C.peers.clear();
  MFX2.paintPresence();
  panel();
};
MFX2.collabCursor = function (ev) {
  const C = MFX2.collab;
  if (!C.on || !C.ch) return;
  const now = performance.now();
  if (C._last && now - C._last < 70) return;
  C._last = now;
  const p = svgPt(ev);
  C.ch.postMessage({ t: "cur", id: C.id, name: C.name, x: p[0], y: p[1] });
};
MFX2.onCollab = function (m) {
  const C = MFX2.collab;
  if (!m || m.id === C.id) return;
  if (m.t === "bye") { C.peers.delete(m.id); MFX2.paintPresence(); return; }
  const peer = C.peers.get(m.id) || { id: m.id, colour: MFX.ramp((MFX2.hashStr(m.id) % 100) / 100) };
  peer.name = m.name || peer.name;
  peer.at = Date.now();
  if (m.t === "cur") { peer.x = m.x; peer.y = m.y; }
  C.peers.set(m.id, peer);
  if (m.t === "hello") C.ch.postMessage({ t: "ping", id: C.id, name: C.name });
  if (m.t === "state" && m.project) {
    /* last-write-wins on the whole document. Crude, but correct, and it is
       the right trade for two windows on one desk — operational transforms
       would be a project of their own for a case this small. */
    C.applying = true;
    pushUndo("collaborator's change");
    P = JSON.parse(m.project);
    MFX.ensure();
    render(); panel();
    C.applying = false;
    toast((peer.name || "A collaborator") + " pushed a change.");
  }
  MFX2.paintPresence();
};
MFX2.pushCollab = function () {
  const C = MFX2.collab;
  if (!C.on || !C.ch) { toast("Start a shared session first."); return; }
  C.ch.postMessage({ t: "state", id: C.id, name: C.name, project: JSON.stringify(P) });
  toast("Pushed the current map to " + C.peers.size + " peer(s).");
};
MFX2.paintPresence = function () {
  let host = $("#mf2-presence");
  if (!host) {
    host = document.createElement("div");
    host.id = "mf2-presence";
    $("#stage").appendChild(host);
  }
  const C = MFX2.collab;
  host.innerHTML = "";
  if (!C.on) { host.classList.remove("show"); return; }
  host.classList.add("show");
  const me = document.createElement("span");
  me.className = "mf2-peer";
  me.style.borderColor = "var(--gold)";
  me.textContent = C.name + " (you)";
  host.appendChild(me);
  [...C.peers.values()].forEach(p => {
    const s = document.createElement("span");
    s.className = "mf2-peer";
    s.style.borderColor = p.colour;
    s.textContent = p.name || p.id;
    host.appendChild(s);
  });
  /* peer cursors live in the SVG so they sit in map space and follow zoom */
  const old = svg.querySelector("#gPeers");
  if (old) old.remove();
  const g = document.createElementNS(NS, "g");
  g.setAttribute("id", "gPeers");
  g.setAttribute("class", "editor-only");
  g.setAttribute("pointer-events", "none");
  svg.appendChild(g);
  [...C.peers.values()].forEach(p => {
    if (p.x === undefined) return;
    const s = Math.max(5, vb.w / 120);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", "M" + p.x + "," + p.y + " l" + (s * 1.6) + "," + (s * 0.55) + " l" + (-s * 0.62) + "," + (s * 0.22) + " l" + (s * 0.3) + "," + (s * 0.8) + " l" + (-s * 0.42) + "," + (s * 0.18) + " l" + (-s * 0.32) + "," + (-s * 0.82) + " l" + (-s * 0.5) + "," + (s * 0.45) + " Z");
    path.setAttribute("fill", p.colour);
    path.setAttribute("stroke", "#0008");
    path.setAttribute("stroke-width", 0.5);
    g.appendChild(path);
    const tx = document.createElementNS(NS, "text");
    tx.setAttribute("x", p.x + s * 1.8); tx.setAttribute("y", p.y + s * 1.9);
    tx.setAttribute("font-size", s * 1.2);
    tx.setAttribute("fill", p.colour);
    tx.textContent = p.name || "";
    g.appendChild(tx);
  });
};

/* =========================================================================
   10.4 — AI-ASSISTED AUTHORING
   -------------------------------------------------------------------------
   Scoped to the two things a language model is actually good at here:
   *naming* things in a consistent voice, and *critiquing* a board it can be
   handed as structured data. It is not asked to draw, place or balance
   anything — the tool's own analytics do that better and deterministically.
   ========================================================================= */
MFX2.ai = { busy: false, model: "claude-sonnet-4-6" };
MFX2.askAI = async function (prompt, system, maxTokens) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MFX2.ai.model,
      max_tokens: maxTokens || 1000,
      system: system || undefined,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) throw new Error("The request failed (" + res.status + ").");
  const data = await res.json();
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
};
MFX2.aiJSON = async function (prompt, system) {
  const raw = await MFX2.askAI(prompt, (system || "") + " Reply with JSON only. No prose, no markdown fences.", 2000);
  const clean = raw.replace(/```json|```/g, "").trim();
  const start = Math.min(...[clean.indexOf("{"), clean.indexOf("[")].filter(i => i >= 0));
  return JSON.parse(isFinite(start) ? clean.slice(start) : clean);
};
MFX2.aiModal = function () {
  const d = MFX2.modalCard("AI assistance", 560);
  d.appendChild(MFX.note("Two jobs a language model does well on a map: naming things in one consistent voice, and reading the board back to you as a critic. Placement and balance stay with the tool's own analytics, which are deterministic and explainable."));
  const out = document.createElement("div");
  out.className = "mf2-airesult";
  const setBusy = on => {
    MFX2.ai.busy = on;
    d.querySelectorAll("button").forEach(b => { b.disabled = on; });
    if (on) out.innerHTML = "<div class='mini'>Thinking…</div>";
  };
  const fail = e => { out.innerHTML = "<div class='mini' style='color:var(--danger)'>" + (e.message || e) + "</div>"; };

  const styleI = inp("text", MFX2.prefs.aiStyle || "", v => { MFX2.prefs.aiStyle = v; MFX2.savePrefs(); },
    { placeholder: "e.g. wind-scoured northern coast, Norse-flavoured" });
  d.appendChild(MFX2.field("Setting", styleI));

  const grid = document.createElement("div");
  grid.className = "btnrow";
  grid.appendChild(btn("Name unnamed regions", async () => {
    const targets = P.regions.filter(r => !r.name || /^Region \d+$/.test(r.name) || /^[A-Z]+\d+$/.test(r.name));
    if (!targets.length) { out.innerHTML = "<div class='mini'>Every region already has a name.</div>"; return; }
    setBusy(true);
    try {
      const ctx = targets.slice(0, 60).map(r => ({ id: r.id, terrain: r.terr || "unknown", neighbours: (r.adj || []).map(a => (byId(a) || {}).name).filter(Boolean).slice(0, 3) }));
      const names = await MFX2.aiJSON(
        "Name these regions of a fantasy board-game map. Setting: " + (styleI.value || "generic high fantasy") +
        ". Each name should suit its terrain and sit naturally beside its named neighbours. Two words at most.\n" +
        JSON.stringify(ctx) +
        '\nReturn {"id": "Name", ...} covering every id.',
        "You are a cartographer naming places for a printed board game.");
      pushUndo("AI: name regions");
      let n = 0;
      Object.keys(names).forEach(id => { const r = byId(id); if (r && typeof names[id] === "string") { r.name = names[id]; n++; } });
      render(); panel();
      out.innerHTML = "<div class='mini'>Named " + n + " regions. Undo if you don't like them.</div>";
    } catch (e) { fail(e); }
    setBusy(false);
  }));
  grid.appendChild(btn("Critique the board", async () => {
    setBusy(true);
    try {
      const g = MFX.graph();
      const summary = {
        regions: P.regions.length,
        factions: Object.keys(P.nations).map(k => ({ name: P.nations[k].name || k, regions: P.regions.filter(r => r.nation === k).length, starts: P.regions.filter(r => r.start === k).map(r => r.name) })),
        degrees: P.regions.map(r => ({ name: r.name, links: (r.adj || []).length, terrain: r.terr || null })),
        problems: findProblems().slice(0, 12).map(p => p.msg),
      };
      const txt = await MFX2.askAI(
        "Here is the structure of a board-game map. Give me a short, concrete critique as a game designer: three things that will play well, three risks, and one specific change. Be blunt and refer to regions by name.\n\n" +
        JSON.stringify(summary),
        "You are an experienced board-game developer reviewing a map's structure. Be specific and brief. No preamble.", 1200);
      out.innerHTML = "<div class='mf2-aitext'>" + txt.replace(/[<>]/g, "") .replace(/\n/g, "<br>") + "</div>";
    } catch (e) { fail(e); }
    setBusy(false);
  }));
  grid.appendChild(btn("Write region flavour", async () => {
    const ids = selectedIds();
    if (!ids.length) { out.innerHTML = "<div class='mini'>Select one or more regions first.</div>"; return; }
    setBusy(true);
    try {
      const ctx = ids.slice(0, 20).map(id => { const r = byId(id); return { id, name: r.name, terrain: r.terr, settlement: r.settle, neighbours: (r.adj || []).map(a => (byId(a) || {}).name).filter(Boolean) }; });
      const res = await MFX2.aiJSON(
        "Write one sentence of evocative flavour text for each region, for a board game's reference sheet. Setting: " +
        (styleI.value || "generic high fantasy") + ".\n" + JSON.stringify(ctx) + '\nReturn {"id": "sentence", ...}',
        "You write terse, atmospheric copy for board-game components.");
      if (!(P.schema || []).some(f => f.key === "flavour")) {
        P.schema = P.schema || [];
        P.schema.push({ key: "flavour", label: "Flavour", type: "text", def: "", legend: false });
      }
      pushUndo("AI: flavour text");
      let n = 0;
      Object.keys(res).forEach(id => { const r = byId(id); if (r) { r.attrs = r.attrs || {}; r.attrs.flavour = res[id]; n++; } });
      panel(); render();
      out.innerHTML = "<div class='mini'>Wrote flavour for " + n + " regions — it's stored as a region attribute and appears in the player aid.</div>";
    } catch (e) { fail(e); }
    setBusy(false);
  }));
  grid.appendChild(btn("Suggest faction names", async () => {
    setBusy(true);
    try {
      const res = await MFX2.aiJSON(
        "Suggest a name and a one-line identity for each faction on this map. Setting: " + (styleI.value || "generic high fantasy") +
        ".\n" + JSON.stringify(Object.keys(P.nations).map(k => ({ key: k, current: P.nations[k].name, regions: P.regions.filter(r => r.nation === k).length }))) +
        '\nReturn {"key": {"name": "...", "identity": "..."}, ...}',
        "You name factions for board games. Distinct, pronounceable, not derivative.");
      out.innerHTML = "<div class='mf2-aitext'>" + Object.keys(res).map(k =>
        "<b>" + (res[k].name || "") + "</b> <span class='mini'>" + (res[k].identity || "") + "</span>").join("<br>") + "</div>";
      const apply = btn("Apply these names", () => {
        pushUndo("AI: faction names");
        Object.keys(res).forEach(k => { if (P.nations[k] && res[k].name) P.nations[k].name = res[k].name; });
        render(); panel();
        toast("Faction names applied.", { undo: true });
      }, "gold");
      out.appendChild(apply);
    } catch (e) { fail(e); }
    setBusy(false);
  }));
  d.appendChild(grid);
  d.appendChild(out);
  d.appendChild(MFX2.foot(btn("Close", closeModal)));
  openModal(d);
};

/* =========================================================================
   PROJECT DEFAULTS — extend the migration rather than replacing it
   ========================================================================= */
const _m2Ensure = MFX.ensure;
MFX.ensure = function () {
  _m2Ensure();
  if (!P) return;
  P.refs = P.refs || [];
  P.textures = P.textures || {};
  P.comments = P.comments || [];
  P.groups = P.groups || {};
  P.fx = P.fx || {};
  P.sketch = P.sketch || Object.assign({}, MFX2.sketchDefaults);
  P.bathy = P.bathy || Object.assign({}, MFX2.bathyDefaults);
  P.elev = P.elev || Object.assign({}, MFX2.elevDefaults);
  P.autolabel = P.autolabel || Object.assign({}, MFX2.labelDefaults);
  P.presentation = P.presentation || { frames: [], secs: 2.2, ease: true, loop: false };
  P.regions.forEach(r => { if (r.parent === undefined) r.parent = null; });
  if (show.hier === undefined) show.hier = false;
  MFX2.migrateLegacyImage();
};

/* ---------------- pointer handling for the new tools ----------------
   A capture-phase listener that yields to the core unless one of these
   tools is active. Nothing above is modified, so the existing tools keep
   behaving exactly as they did. */
MFX2.slice = { pts: [], id: null };
svg.addEventListener("pointerdown", ev => {
  if (!P) return;
  const p = svgPt(ev);

  /* corner-pin handles work under any tool, since pinning is a mode */
  if (MFX2.cornerPinMode) {
    const h = ev.target.closest && ev.target.closest("[data-refcorner]");
    if (h) {
      const ref = MFX2.refs().find(r => r.id === MFX2.refSel);
      const i = +h.getAttribute("data-refcorner");
      if (ref) {
        pushUndo("corner-pin");
        MFX2.dragCorner = { ref, i };
        svg.setPointerCapture(ev.pointerId);
        ev.stopImmediatePropagation(); ev.preventDefault();
        return;
      }
    }
  }
  /* a comment pin is clickable whatever the tool, or pins would be write-only */
  const pin = ev.target.closest && ev.target.closest("[data-comment]");
  if (pin && tool !== "comment") {
    MFX2.commentModal(pin.getAttribute("data-comment"));
    ev.stopImmediatePropagation(); ev.preventDefault();
    return;
  }
  if (!MFX2.myTools.has(tool)) return;
  ev.stopImmediatePropagation();
  ev.preventDefault();

  if (tool === "brush") {
    pushUndo("paint " + MFX2.brush.what);
    MFX2.brush.down = true;
    MFX2.brush.painted = new Set();
    MFX2.paintAt(p);
    svg.setPointerCapture(ev.pointerId);
  } else if (tool === "slice") {
    MFX2.slice = { pts: [p], id: MFX.regionAt(p) || null, down: true };
    svg.setPointerCapture(ev.pointerId);
  } else if (tool === "wand") {
    const pts = MFX2.wandAt(p);
    if (pts) MFX2.wandCommit(pts);
  } else if (tool === "measure") {
    MFX2.measure.on = true;
    MFX2.measure.pts.push(p);
    render();
  } else if (tool === "comment") {
    if (pin) { MFX2.commentModal(pin.getAttribute("data-comment")); return; }
    MFX2.addComment(p);
  }
}, true);

svg.addEventListener("pointermove", ev => {
  if (!P) return;
  if (MFX2.dragCorner) {
    const p = svgPt(ev);
    MFX2.dragCorner.ref.corners[MFX2.dragCorner.i] = [+p[0].toFixed(1), +p[1].toFixed(1)];
    MFX2.refCache.delete(MFX2.dragCorner.ref.id);
    render();
    ev.stopImmediatePropagation();
    return;
  }
  if (MFX2.brush.down && tool === "brush") {
    MFX2.paintAt(svgPt(ev));
    ev.stopImmediatePropagation();
    return;
  }
  if (MFX2.slice.down && tool === "slice") {
    const p = svgPt(ev);
    const last = MFX2.slice.pts[MFX2.slice.pts.length - 1];
    if (!last || dist(last, p) > 2) MFX2.slice.pts.push(p);
    MFX2.drawSlicePreview();
    ev.stopImmediatePropagation();
    return;
  }
  if (tool === "measure" && MFX2.measure.pts.length) {
    MFX2.measure.live = svgPt(ev);
    render();
  }
}, true);

svg.addEventListener("pointerup", ev => {
  if (MFX2.dragCorner) {
    MFX2.dragCorner = null;
    render(); panel();
    ev.stopImmediatePropagation();
    return;
  }
  if (MFX2.brush.down) {
    MFX2.brush.down = false;
    endCoalesce();
    panel();
    ev.stopImmediatePropagation();
    return;
  }
  if (MFX2.slice.down) {
    MFX2.slice.down = false;
    const S = MFX2.slice;
    if (S.pts.length > 1) {
      /* the region under the *start* of the stroke is the one being cut —
         less surprising than picking whichever the stroke ended over */
      let id = S.id;
      if (!id) id = MFX.regionAt(S.pts[0]);
      if (!id) toast("Start the cut inside the region you want to split.");
      else MFX2.splitRegion(id, simplifyRing(S.pts, 1.2));
    }
    MFX2.slice = { pts: [], id: null };
    render();
    ev.stopImmediatePropagation();
  }
}, true);

MFX2.drawSlicePreview = function () {
  let g = svg.querySelector("#gSlice");
  if (!g) {
    g = document.createElementNS(NS, "g");
    g.setAttribute("id", "gSlice");
    g.setAttribute("class", "editor-only");
    g.setAttribute("pointer-events", "none");
    svg.appendChild(g);
  }
  g.innerHTML = "";
  const pts = MFX2.slice.pts;
  if (pts.length < 2) return;
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", pts.map((p, i) => (i ? "L" : "M") + fmt(p[0]) + "," + fmt(p[1])).join(""));
  path.setAttribute("class", "draft");
  path.setAttribute("fill", "none");
  g.appendChild(path);
};

   shortcut editor and the macro recorder all read from this list.

MFX2.registerCommands = function () {
  const C = MFX2.cmd;
  const has = () => !!P;
  const hasSel = () => !!P && selCount() > 0;
  const multiSel = () => !!P && selCount() > 1;

  /* — colour — */
  C("colour.audit", "Colour audit & palette", "Colour", () => MFX2.colourReportModal(), { when: has, desc: "Which adjacent nations collide" });
  C("colour.palette", "Recolour nations perceptually", "Colour", () => MFX2.applyPalette(), { when: has });
  MFX2.PROOFS.forEach(([k, label]) => {
    C("colour.proof." + k, "Proof: " + label, "Colour", () => MFX2.setProof(k), { macro: false });
  });
  C("colour.proofcycle", "Cycle proof mode", "Colour", () => {
    const i = MFX2.PROOFS.findIndex(x => x[0] === MFX2.prefs.proof);
    MFX2.setProof(MFX2.PROOFS[(i + 1) % MFX2.PROOFS.length][0]);
  }, { keys: "Mod+Shift+P" });
  C("colour.printproof", "Toggle print proof (pattern only)", "Colour", () => MFX2.setPrintProof(!MFX2.printProof), { when: has });

  /* — geometry — */
  C("geom.merge", "Merge selected regions", "Regions", () => MFX2.mergeRegions(), { when: multiSel, keys: "Mod+Shift+M" });
  C("geom.subtract", "Subtract: cut the first from the rest", "Regions", () => {
    const ids = selectedIds();
    MFX2.subtractRegions(ids[0], ids.slice(1));
  }, { when: multiSel });
  C("geom.intersect", "Keep only the overlap", "Regions", () => MFX2.intersectRegions(), { when: multiSel });
  C("geom.splittool", "Split a region (tool)", "Regions", () => setTool("slice"), { when: has });

  C("geom.hier", "Show territory outlines", "Regions", () => { show.hier = !show.hier; render(); panel(); }, { when: has });

  /* — terrain model — */
  C("elev.toggle", "Toggle the elevation model", "Terrain", () => {
    P.elev.on = !P.elev.on;
    MFX2.elevCache = null;
    render(); panel();
    toast(P.elev.on ? "Elevation model on — relief is shaded from the field." : "Elevation model off.");
  }, { when: has });
  C("elev.reseed", "Reseed the terrain", "Terrain", () => {
    pushUndo("reseed terrain");

    P.elev.moistSeed = Math.floor(Math.random() * 1e6);
    MFX2.elevCache = null; MFX2.reliefCache = null;
    render(); panel();
  }, { when: has });
  C("elev.rivers", "Trace rivers from the flow model", "Terrain", () => MFX2.applyRivers(), { when: has });
  C("elev.biomes", "Assign biomes from the model", "Terrain", () => MFX2.applyBiomes(selCount() > 0), { when: has });
  C("elev.attr", "Store elevation on every region", "Terrain", () => MFX2.applyElevationAttr(), { when: has });
  C("terrain.brush", "Terrain brush", "Terrain", () => setTool("brush"), { when: has });

  /* — names — */
  C("name.unnamed", "Name every unnamed region", "Names", () => MFX2.nameRegions("unnamed"), { when: has });
  C("name.selected", "Rename the selection", "Names", () => MFX2.nameRegions("selected"), { when: hasSel });
  C("name.all", "Rename every region", "Names", () => {
    confirmModal("Rename everything?", "Every region gets a new generated name. This can be undone.", "Rename", () => MFX2.nameRegions("all"));
  }, { when: has });

  /* — labels — */
  C("label.auto", "Toggle automatic label placement", "Labels", () => {

  C("ref.wand", "Magic wand", "Reference", () => setTool("wand"), { when: has });

  C("export.viewer", "Export an interactive web viewer", "Export", () => MFX2.exportViewer(), { when: has });
  C("export.embed", "Embed code for the viewer", "Export", () => MFX2.embedSnippet(), { when: has });
  C("export.preflight", "Print preflight", "Export", () => MFX2.preflightModal(), { when: has });

/* WebP is one argument away and about 30% smaller than PNG for the web */
MFX2.saveWebP = function () {
  MFX2.rasterise({ scale: (exportOpts().scale || 2) }, res => {
    if (!res) return;
    res.canvas.toBlob(bl => {
      if (!bl) { toast("This browser can't encode WebP."); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(bl);
      a.download = origName + "_map.webp";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("WebP exported at " + res.W + "×" + res.H + " px.");
    }, "image/webp", 0.92);
  });
};
MFX2.pickRefFile = function () {
  const fi = document.createElement("input");
  fi.type = "file";
  fi.accept = "image/png,image/jpeg,image/webp";
  fi.onchange = () => { const f = fi.files[0]; if (f) MFX2.addRefFromFile(f); };
  fi.click();
};
MFX2.collabModal = function () {
  const d = MFX2.modalCard("Share this session", 480);
  d.appendChild(MFX.note("Map Forge is a single file with no server, so sharing works <b>between windows on this device</b> — a second browser window, or a second screen. You get live presence, peer cursors and pushed changes. Hosted, cross-internet sync is deliberately out of scope (§11.2 of the review)."));
  const nameI = inp("text", MFX2.prefs.author || "", v => { MFX2.prefs.author = v; MFX2.savePrefs(); }, { placeholder: "Your name" });
  const roomI = inp("text", MFX2.collab.room || slug(origName || "mapforge"), () => {}, { placeholder: "Session name" });
  d.appendChild(MFX2.field("You are", nameI));
  d.appendChild(MFX2.field("Session", roomI));
  if (MFX2.collab.on) {
    d.appendChild(MFX.note("Connected to <b>" + MFX2.collab.room + "</b> with " + MFX2.collab.peers.size + " other window(s)."));
    d.appendChild(MFX2.foot(
      btn("Leave", () => { MFX2.stopCollab(); closeModal(); }, "danger"),
      btn("Push my map to them", () => { MFX2.pushCollab(); closeModal(); }, "gold")
    ));
  } else {
    d.appendChild(MFX2.foot(
      btn("Cancel", closeModal),

/* =========================================================================

MFX2.secColour = function () {
  const s = mkSec("Colour & proofing", false), b = s.querySelector(".body");
  b.appendChild(MFX2.field("Proof mode", selInp(MFX2.PROOFS.map(([k, l]) => [k, t(l)]), MFX2.prefs.proof, v => MFX2.setProof(v))));
  b.appendChild(MFX.note("Simulates the canvas as a colour-blind player sees it, or as a monochrome printer will render it. Proofing never affects what you export unless you ask for it."));
  const audit = MFX2.colourAudit();
  const line = document.createElement("div");
  line.className = "mini";
  line.style.margin = "6px 0";
  line.innerHTML = audit.length
    ? "<b style='color:var(--danger)'>" + audit.length + " adjacent pair(s)</b> are hard to tell apart."
    : "<b style='color:#7ee0a8'>No adjacent pairs collide.</b>";
  b.appendChild(line);
  const sw = document.createElement("div");
  sw.className = "mf2-swatchrow";
  const bad = new Set();
  audit.forEach(a => { bad.add(a.a); bad.add(a.b); });
  Object.keys(P.nations || {}).forEach(k => {
    const n = P.nations[k];
    const c = document.createElement("div");
    c.className = "mf2-swatch" + (bad.has(k) ? " bad" : "");
    c.style.background = MFX2.prefs.proof !== "none" ? CM.simulate(n.color || "#888", MFX2.prefs.proof) : (n.color || "#888");
    c.title = (n.name || k) + (bad.has(k) ? " — flagged" : "");
    c.onclick = () => { selectByNation(k); render(); panel(); };
    sw.appendChild(c);
  });
  b.appendChild(sw);
  b.appendChild(MFX.btnrow(
    btn("Colour audit…", () => MFX2.colourReportModal()),
    btn("Recolour perceptually", () => MFX2.applyPalette(), "gold")
  ));

  b.appendChild(MFX2.sub("Pattern fills"));
  b.appendChild(MFX.note("A second, redundant encoding of ownership. Survives a monochrome printer and works where colour separation has run out."));
  const natKeys = Object.keys(P.nations || {});
  if (natKeys.length) {
    const pick = selInp(natKeys.map(k => [k, P.nations[k].name || k]), MFX2.patNation || natKeys[0], v => { MFX2.patNation = v; panel(); });
    const key = MFX2.patNation && P.nations[MFX2.patNation] ? MFX2.patNation : natKeys[0];
    MFX2.patNation = key;
    const n = P.nations[key];
    b.appendChild(MFX2.field("Nation", pick));
    b.appendChild(MFX2.field("Pattern", selInp(MFX2.PATTERN_LIST, n.pat || "none", v => {
      pushUndo("nation pattern"); n.pat = v === "none" ? null : v; render(); panel();
    })));
    if (n.pat) {
      b.appendChild(MFX2.field("Density", selInp([["1", "Sparse"], ["2", "Medium"], ["3", "Dense"]], n.patD || 2, v => { pushUndo("pattern density"); n.patD = +v; render(); })));
      b.appendChild(MFX2.field("Angle", inp("range", n.patA || 0, v => { n.patA = +v; render(); }, { min: 0, max: 90, step: 5, undo: "pattern angle" })));
      b.appendChild(MFX.btnrow(btn("Apply a distinct pattern to every nation", () => {
        pushUndo("pattern all nations");
        const pats = ["hatch", "cross", "dots", "chevron", "grid", "hatch2", "tartan", "brick", "wavepat"];
        natKeys.forEach((k, i) => { P.nations[k].pat = pats[i % pats.length]; P.nations[k].patD = 2; P.nations[k].patA = (i * 25) % 90; });

MFX2.secRefs = function () {
  const s = mkSec("Reference images", false), b = s.querySelector(".body");
  const refs = MFX2.refs();
  if (!refs.length) {
    b.appendChild(MFX.note("Load a sketch, a photographed whiteboard or a historical atlas. Several at once is fine — each keeps its own placement and tone."));
  } else {
    const list = document.createElement("div");
    list.className = "list";
    refs.forEach(r => {
      const it = document.createElement("div");
      it.className = "item" + (r.id === MFX2.refSel ? " on" : "");
      const eye = document.createElement("span");
      eye.textContent = r.visible ? "◉" : "○";
      eye.style.cursor = "pointer";
      eye.onclick = ev => { ev.stopPropagation(); r.visible = !r.visible; render(); panel(); };
      it.appendChild(eye);
      const nm = document.createElement("span");
      nm.style.flex = "1";
      nm.textContent = r.name + (r.corners ? " ⌗" : "");
      it.appendChild(nm);
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      x.onclick = ev => {
        ev.stopPropagation();
        pushUndo("remove reference");
        P.refs = refs.filter(o => o.id !== r.id);
        MFX2.refCache.delete(r.id);
        render(); panel();
      };
      it.appendChild(x);
      it.onclick = () => { MFX2.refSel = r.id; panel(); render(); };
      list.appendChild(it);
    });
    b.appendChild(list);
  }
  b.appendChild(MFX.btnrow(btn("Add an image…", () => MFX2.pickRefFile(), "gold")));

  const ref = refs.find(r => r.id === MFX2.refSel) || refs[0];
  if (ref) {
    MFX2.refSel = ref.id;
    b.appendChild(MFX2.sub("Placement"));
    b.appendChild(MFX2.field("Opacity", inp("range", ref.opacity, v => { ref.opacity = +v; render(); }, { min: 0, max: 1, step: .02, undo: "reference opacity" })));
    b.appendChild(MFX2.field("Blend", selInp(MFX2.BLENDS, ref.blend || "normal", v => { pushUndo("reference blend"); ref.blend = v; render(); })));
    if (!ref.corners) {
      b.appendChild(MFX2.field("Rotate", inp("range", ref.rot || 0, v => { ref.rot = +v; render(); }, { min: -180, max: 180, step: 1, undo: "reference rotation" })));
      b.appendChild(MFX2.field("Width", inp("number", Math.round(ref.w), v => {
        pushUndo("reference size");
        const k = +v / (ref.w || 1);
        ref.w = +v; ref.h = ref.h * k;
        MFX2.refCache.delete(ref.id); render();
      }, { step: 10 })));
    }
    b.appendChild(MFX.btnrow(
      btn(ref.corners ? "Adjust corner-pin" : "Corner-pin…", () => MFX2.startCornerPin(ref), "gold"),
      ref.corners ? btn("Drop the warp", () => {
        pushUndo("clear corner-pin");
        ref.corners = null; MFX2.cornerPinMode = false;
        MFX2.refCache.delete(ref.id); render(); panel();
      }) : null,
      btn("Fit to map", () => {
        pushUndo("fit reference");
        const bb = MFX2.elevBounds();
        const sc = Math.min(bb.w / (ref.natW || ref.w), bb.h / (ref.natH || ref.h));
        ref.x = bb.x; ref.y = bb.y;
        ref.w = (ref.natW || ref.w) * sc; ref.h = (ref.natH || ref.h) * sc;
        ref.corners = null;
        MFX2.refCache.delete(ref.id); render(); panel();
      })
    ));
    if (MFX2.cornerPinMode) b.appendChild(MFX.note("Drag the four corner handles onto features you can identify in the map. A photographed sketch is a trapezium — this is what squares it up."));

    b.appendChild(MFX2.sub("Tone (non-destructive)"));
    (ref.adjust || []).forEach((a, i) => {
      const card = document.createElement("div");
      card.className = "mf2-adj";
      const head = document.createElement("header");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = a.on;
      cb.onchange = () => { pushUndo("toggle adjustment"); a.on = cb.checked; MFX2.refCache.delete(ref.id); render(); };
      head.appendChild(cb);
      const label = document.createElement("span");
      label.textContent = MFX2.ADJUSTMENTS[a.type].label;
      head.appendChild(label);
      const up = document.createElement("span");
      up.className = "x";
      up.textContent = "↑";
      up.title = "Move earlier in the stack";
      up.onclick = () => { if (i > 0) { pushUndo("reorder adjustment"); ref.adjust.splice(i - 1, 0, ref.adjust.splice(i, 1)[0]); MFX2.refCache.delete(ref.id); render(); panel(); } };
      head.appendChild(up);
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      x.onclick = () => { pushUndo("remove adjustment"); ref.adjust.splice(i, 1); MFX2.refCache.delete(ref.id); render(); panel(); };
      head.appendChild(x);
      card.appendChild(head);
      const def = MFX2.ADJUSTMENTS[a.type];
      Object.keys(a.p).forEach(pk => {

/* =========================================================================
   KEYBOARD
   Custom bindings are checked first, then this block's fixed keys. Anything
   the core already owns is left alone.
   ========================================================================= */
window.addEventListener("keydown", ev => {
  const tag = ev.target.tagName;
  const typing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
  const mod = ev.ctrlKey || ev.metaKey;

  /* the palette must open even from a field, since that is often where you
     realise you want it */
  if (mod && ev.key.toLowerCase() === "k") {
    ev.preventDefault(); ev.stopImmediatePropagation();
    MFX2.palette();
    return;
  }
  if (typing) return;

  const combo = MFX2.comboOf(ev);
  const bound = Object.keys(MFX2.prefs.shortcuts || {}).find(id => MFX2.prefs.shortcuts[id] === combo);
  if (bound) {
    ev.preventDefault(); ev.stopImmediatePropagation();
    MFX2.runCmd(bound);
    return;
  }
  if (!mod && (ev.key === "?" || (ev.key === "/" && ev.shiftKey))) {
    ev.preventDefault(); ev.stopImmediatePropagation();
    MFX2.cheatSheet();
    return;
  }
  if (mod && ev.shiftKey) {
    const k = ev.key.toLowerCase();
    const map = { p: "colour.proofcycle", h: "ui.history", m: "geom.merge" };
    if (map[k]) { ev.preventDefault(); ev.stopImmediatePropagation(); MFX2.runCmd(map[k]); return; }
  }
  if (ev.shiftKey && !mod && !ev.altKey) {
    const map = { B: "brush", X: "slice", W: "wand", M: "measure", C: "comment" };
    const tt = map[ev.key.toUpperCase()];
    if (tt && ev.key.length === 1) {
      ev.preventDefault(); ev.stopImmediatePropagation();
      setTool(tt);
      return;
    }
  }
  if (ev.key === "Escape") {
    /* Escape is progressive: leave the transient mode first, and only then
       let the core clear the drawing state */
    if (MFX2.cornerPinMode) { MFX2.cornerPinMode = false; render(); panel(); ev.stopImmediatePropagation(); return; }
    if (MFX2.measure.pts.length) { MFX2.measure = { on: false, pts: [], live: null }; render(); ev.stopImmediatePropagation(); return; }
    if (MFX2.pres.playing) { MFX2.stopPresentation(); ev.stopImmediatePropagation(); return; }
  }
  if (ev.key === "Enter" && tool === "measure" && MFX2.measure.pts.length > 1) {
    MFX2.measure.live = null;
    render();
    ev.stopImmediatePropagation();
  }
}, true);

MFX2._areaCache = { stamp: null, area: 0 };
MFX2.updateStatus = function () {
  const s = $("#mf2-stat");
  if (!s || !P) return;
  /* total area is O(all vertices), and this runs on every frame — cache it
     against a cheap stamp so a drag doesn't pay for it sixty times a second */
  const stamp = P.regions.length + ":" + Object.keys(P.cells).length + ":" + (P.regions[0] ? P.regions[0].x : 0);
  if (MFX2._areaCache.stamp !== stamp) {
    let a = 0;
    P.regions.forEach(r => { const c = P.cells[r.id]; if (c) a += Math.abs(G2.area2(c.pts)); });
    MFX2._areaCache = { stamp, area: a };
  }
  const area = MFX2._areaCache.area;
  const bits = [P.regions.length + " regions"];
  if (area) bits.push(MFX2.mapUnits(Math.sqrt(area)) + "²");
  if (MFX2.labelResult && MFX2.labelResult.hidden) bits.push(MFX2.labelResult.hidden + " labels hidden");
  if (MFX2.canvas.active) bits.push("canvas");
  s.textContent = bits.join(" · ");
};

  await MFX2.loadPrefs();
  MFX2.installProofFilters();
  MFX2.installChrome();
  MFX2.registerCommands();
  MFX2.initA11y();
  MFX2.initStylus();
  MFX2.hookImport();
  buildTools();
  if (P) { MFX.ensure(); }
  MFX2.applyProof();
  render();
  panel();
  MFX2.updateStatus();
  MFX2.fire("ready", MapForge);
};

/* status is refreshed from the render post-pass, which is the only place
   that knows a frame has actually been built */

/* a new or restored project must pick up the new defaults */
const _m2AdoptRestored = adoptRestored;
adoptRestored = function (saved) {
  _m2AdoptRestored(saved);
  MFX.ensure();
  MFX2.elevCache = null;
  MFX2.refCache.clear();
  MFX2.anchorCache.clear();
  render(); panel();
};
const _m2NewProject = newProject;
newProject = function (w, h, preset) {
  const p = _m2NewProject(w, h, preset);
  p.refs = []; p.textures = {}; p.comments = []; p.groups = {}; p.fx = {};
  p.sketch = Object.assign({}, MFX2.sketchDefaults);
  p.bathy = Object.assign({}, MFX2.bathyDefaults);
  p.elev = Object.assign({}, MFX2.elevDefaults);
  p.autolabel = Object.assign({}, MFX2.labelDefaults);
  p.presentation = { frames: [], secs: 2.2, ease: true, loop: false };
  return p;
};
const _m2LoadGameHTML = loadGameHTML;
loadGameHTML = function (text, name) {
  const r = _m2LoadGameHTML(text, name);
  MFX.ensure();
  MFX2.elevCache = null;
  MFX2.anchorCache.clear();
  return r;
};
/* the sample map should show the new machinery off, not hide it */
const _m2LoadSample = loadSample;
loadSample = function () {
  _m2LoadSample();
  MFX.ensure();
  P.autolabel.on = true;
  P.bathy = Object.assign({}, MFX2.bathyDefaults, { on: true, count: 4, gap: 12 });
  MFX2.anchorCache.clear();
  render(); panel();
};

MFX2.init();


</script>
