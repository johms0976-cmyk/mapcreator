/* =========================================================================
   9 — PDF EXPORT  (single page, and tiled multi-page poster)
   -------------------------------------------------------------------------
   Print shops want PDF. Each page carries the map as an embedded image at
   the chosen DPI, with vector crop marks, trim box, fold guides and page
   numbering drawn as real PDF line work so they stay crisp at any zoom.
   Tiles are rasterised one at a time from the SVG, so an A0 poster never
   needs a single 300-megapixel canvas in memory.
   ========================================================================= */
MFX.pdf = {paper:"a4", dpi:300, orient:"auto", overlap:8, marks:true, quality:.94,
           mode:"single", labels:true, nodes:true, image:false};

MFX.rasteriseArea = function(area, pxW, pxH, o){
  return new Promise((res,rej)=>{
    const {node}=buildExportSVG(Object.assign({area:"content", bleed:0, cutlines:false}, o));
    node.setAttribute("viewBox", area.x+" "+area.y+" "+area.w+" "+area.h);
    node.setAttribute("width", area.w); node.setAttribute("height", area.h);
    const src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(node));
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas"); cv.width=pxW; cv.height=pxH;
      const cx=cv.getContext("2d");
      cx.fillStyle=(THEMES[P.theme]||THEMES.lotr).sea;
      cx.fillRect(0,0,pxW,pxH);
      cx.imageSmoothingQuality="high";
      cx.drawImage(img,0,0,pxW,pxH);
      cv.toBlob(bl=>bl?bl.arrayBuffer().then(res):rej(new Error("encode")), "image/jpeg", MFX.pdf.quality);
    };
    img.onerror=()=>rej(new Error("raster"));
    img.src=src;
  });
};
/* a compact PDF writer — enough of the format for image pages plus line art */
MFX.buildPDF = function(pages){
  const enc=new TextEncoder();
  const parts=[]; let len=0;
  const push=x=>{ const b=(typeof x==="string")? enc.encode(x) : new Uint8Array(x);
    parts.push(b); len+=b.length; return len; };
  const offsets=[0];
  const obj=(n, body, stream)=>{
    offsets[n]=len;
    push(n+" 0 obj\n"+body+"\n");
    if(stream){ push("stream\n"); push(stream); push("\nendstream\n"); }
    push("endobj\n");
  };
  const nPages=pages.length;
  const firstPage=3;
  const ids=pages.map((p,i)=>({page:firstPage+i*3, content:firstPage+i*3+1, image:firstPage+i*3+2}));

  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids ["+ids.map(i=>i.page+" 0 R").join(" ")+"] /Count "+nPages+" >>");
  pages.forEach((p,i)=>{
    const id=ids[i];
    obj(id.page,
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+p.w.toFixed(2)+" "+p.h.toFixed(2)+"] "+
      "/Resources << /XObject << /Im0 "+id.image+" 0 R >> /Font << /F1 "+(firstPage+nPages*3)+" 0 R >> >> "+
      "/Contents "+id.content+" 0 R >>");
    obj(id.content, "<< /Length "+p.content.length+" >>", enc.encode(p.content));
    obj(id.image,
      "<< /Type /XObject /Subtype /Image /Width "+p.px+" /Height "+p.py+
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+p.jpeg.byteLength+" >>",
      new Uint8Array(p.jpeg));
  });
  obj(firstPage+nPages*3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  const xref=len;
  const total=firstPage+nPages*3+1;
  let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let n=1;n<total;n++) x+=String(offsets[n]||0).padStart(10,"0")+" 00000 n \n";
  push(x);
  push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  const out=new Uint8Array(len); let at=0;
  parts.forEach(b=>{ out.set(b,at); at+=b.length; });
  return out;
};
MFX.exportPDF = async function(o){
  o=Object.assign({},MFX.pdf,o||{});
  const paper=PAPER[o.paper]||PAPER.a4;
  const area=exportArea(o.area||"content");
  const landscape = o.orient==="landscape" || (o.orient==="auto" && area.w>=area.h);
  const mmW = landscape? paper.h : paper.w, mmH = landscape? paper.w : paper.h;
  const ptW = mmW/25.4*72, ptH = mmH/25.4*72;
  const margin = o.marks? 28 : 0;                       // points reserved for marks
  const liveW = ptW-margin*2, liveH = ptH-margin*2;

  /* Plan the sheet grid and the scale together, so the page count the
     dialog promises is the page count you get. */
  const plan = MFX.tilePlan(o, area, liveW, liveH);
  let tiles=[];
  if(o.mode==="single"){
    const sc=Math.min(liveW/area.w, liveH/area.h);
    const w=area.w*sc, h=area.h*sc;
    tiles=[{area, x:(ptW-w)/2, y:(ptH-h)/2, w, h, col:0, row:0, cols:1, rows:1}];
  } else {
    const {cols, rows, sc, stepU_W, stepU_H, tileU_W, tileU_H} = plan;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      tiles.push({area:{x:area.x+c*stepU_W, y:area.y+r*stepU_H, w:tileU_W, h:tileU_H},
        x:margin, y:margin, w:liveW, h:liveH, col:c, row:r, cols, rows});
    }
  }
  if(tiles.length>40){ toast("That would be "+tiles.length+" pages — pick a bigger paper size or a lower DPI."); return; }

  toast("Rendering "+tiles.length+" page"+(tiles.length>1?"s":"")+" at "+o.dpi+" dpi…");
  const pages=[];
  for(const t of tiles){
    const px=Math.max(1,Math.round(t.w/72*o.dpi)), py=Math.max(1,Math.round(t.h/72*o.dpi));
    if(px*py>60e6){ toast("A page at "+o.dpi+" dpi would be "+px+"×"+py+" px. Lower the DPI."); return; }
    let jpeg;
    try{ jpeg=await MFX.rasteriseArea(t.area, px, py, o); }
    catch(e){ toast("Couldn't rasterise the map. If a reference image is included, reload it and try again."); return; }
    /* content stream: image, then vector marks */
    let c="q "+t.w.toFixed(2)+" 0 0 "+t.h.toFixed(2)+" "+t.x.toFixed(2)+" "+t.y.toFixed(2)+" cm /Im0 Do Q\n";
    if(o.marks){
      c+="0.5 w 0 G\n";
      const arm=14, gap=5;
      [[t.x,t.y,-1,-1],[t.x+t.w,t.y,1,-1],[t.x,t.y+t.h,-1,1],[t.x+t.w,t.y+t.h,1,1]].forEach(([x,y,sx,sy])=>{
        c+=(x+sx*gap).toFixed(2)+" "+y.toFixed(2)+" m "+(x+sx*(gap+arm)).toFixed(2)+" "+y.toFixed(2)+" l S\n";
        c+=x.toFixed(2)+" "+(y+sy*gap).toFixed(2)+" m "+x.toFixed(2)+" "+(y+sy*(gap+arm)).toFixed(2)+" l S\n";
      });
      if(t.cols*t.rows>1){
        c+="0.4 w [3 3] 0 d 0.6 G\n"+
           t.x.toFixed(2)+" "+t.y.toFixed(2)+" "+t.w.toFixed(2)+" "+t.h.toFixed(2)+" re S\n[] 0 d 0 G\n";
        const label="Sheet "+(t.row*t.cols+t.col+1)+" of "+(t.cols*t.rows)+
                    "   (row "+(t.row+1)+", column "+(t.col+1)+")";
        c+="BT /F1 8 Tf "+(t.x).toFixed(2)+" "+(t.y-14).toFixed(2)+" Td ("+label+") Tj ET\n";
        c+="BT /F1 7 Tf "+(t.x).toFixed(2)+" "+(t.y+t.h+7).toFixed(2)+" Td "+
           "(Trim on the dashed line, then butt-join. Overlap "+o.overlap+" mm.) Tj ET\n";
      }
    }
    pages.push({w:ptW, h:ptH, px, py, jpeg, content:c});
  }
  const bytes=MFX.buildPDF(pages);
  const blob=new Blob([bytes],{type:"application/pdf"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=origName+(tiles.length>1?"_poster":"_map")+".pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Exported "+pages.length+" page PDF at "+o.dpi+" dpi"+
        (tiles.length>1? " — trim and butt-join the sheets." : "."));
};
MFX.tilePlan = function(o, area, liveW, liveH){
  /* Pick a sheet grid whose proportions match the map, then choose the one
     scale that makes the map span exactly that grid (allowing for the
     overlap each seam eats), then recount the sheets actually needed at
     that scale. Doing it in this order is what keeps the estimate honest —
     scaling first and counting afterwards is how "4 sheets" becomes 12. */
  const sheets=Math.max(1,o.sheets||4);
  const ovPt=(o.overlap||0)/25.4*72;
  const aspect=(area.w/area.h)*(liveH/liveW);
  let cols=Math.max(1,Math.round(Math.sqrt(sheets*aspect)));
  let rows=Math.max(1,Math.round(sheets/cols));
  const fitW=(cols*liveW-(cols-1)*ovPt)/area.w;
  const fitH=(rows*liveH-(rows-1)*ovPt)/area.h;
  const sc=Math.min(fitW,fitH);                       // points per map unit
  const stepW=Math.max(1,liveW-ovPt), stepH=Math.max(1,liveH-ovPt);
  cols=Math.max(1,Math.ceil((area.w*sc-ovPt)/stepW));
  rows=Math.max(1,Math.ceil((area.h*sc-ovPt)/stepH));
  return {cols, rows, sc, pages:cols*rows,
          tileU_W:liveW/sc, tileU_H:liveH/sc,
          stepU_W:stepW/sc, stepU_H:stepH/sc,
          mmW:(area.w*sc)/72*25.4, mmH:(area.h*sc)/72*25.4};
};

  d.appendChild(sheetRow);

  d.appendChild(ovRow);
  const chk=(label,val,set)=>{ const l=MFX.checkbox(label,val,v=>{set(v);upd();}); d.appendChild(l); return l; };
  chk("Region names & map labels", o.labels, v=>o.labels=v);
  chk("Nodes & settlement markers", o.nodes, v=>o.nodes=v);

  chk("Crop marks, trim line & sheet numbers", o.marks, v=>o.marks=v);
  const note=document.createElement("div"); note.className="mini"; d.appendChild(note);
  const upd=()=>{
    const tiled=o.mode==="tile";

    const landscape=o.orient==="landscape"||(o.orient==="auto"&&area.w>=area.h);
    const mmW=landscape?paper.h:paper.w, mmH=landscape?paper.w:paper.h;
    const px=Math.round(mmW/25.4*o.dpi), py=Math.round(mmH/25.4*o.dpi);
    const ptW=mmW/25.4*72, ptH=mmH/25.4*72, margin=o.marks?28:0;
    const plan=MFX.tilePlan(o, area, ptW-margin*2, ptH-margin*2);
    note.innerHTML="Each page "+px+" × "+py+" px · "+mmW+" × "+mmH+" mm"+
      (tiled? "<br><b>"+plan.pages+" sheet"+(plan.pages===1?"":"s")+"</b> ("+plan.cols+" × "+plan.rows+
        ") · finished size "+Math.round(plan.mmW)+" × "+Math.round(plan.mmH)+" mm" : "")+
      (px*py>60e6? " <b style='color:var(--danger)'>— too large, lower the DPI</b>":"")+
      (tiled&&plan.pages>40? " <b style='color:var(--danger)'>— too many sheets</b>":"");
  };
  upd();
  const foot=document.createElement("div"); foot.className="foot";
  foot.appendChild(btn("Cancel",closeModal));
  foot.appendChild(btn("Export PDF",()=>{ Object.assign(MFX.pdf,o); closeModal(); MFX.exportPDF(o); },"gold"));
  d.appendChild(foot);
  return d;
};

MFX.EXTRA_KEYS=["version","schema","layers","tokens","stamps","icons","fonts","customThemes",

saveJSON = function(){
  MFX.ensure();

/* ---------------- seeded noise ----------------
   Every generated jitter must be *stable*: a redraw during a drag must not
   reshuffle a coastline, or the map shimmers. Everything random in this
   block is derived from an object id, never from Math.random. */
MFX2.hashStr = function (s) {
  let h = 2166136261 >>> 0;
  s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};
MFX2.rng = function (seed) {
  let a = (typeof seed === "string" ? MFX2.hashStr(seed) : seed | 0) >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
};
/* value noise on a lattice — smooth, seeded, cheap; used by elevation & sketch */
MFX2.vnoise = function (x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const at = (px, py) => {
    let h = MFX2.hashStr(px + "," + py + "," + (seed || 0));
    return (h >>> 8) / 16777216;
  };
  const s = v => v * v * (3 - 2 * v);
  const u = s(xf), v = s(yf);
  const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
};
MFX2.fbm = function (x, y, oct, seed) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 4); i++) {
    sum += amp * MFX2.vnoise(x * f, y * f, (seed || 0) + i * 101);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
};

/* =========================================================================
   COLOUR SCIENCE (§5.1)
   -------------------------------------------------------------------------
   The review's central complaint is that the theme system is unaudited.
   Auditing needs a perceptual space, so this section carries sRGB → OKLab
   and back, the Machado CVD matrices, and WCAG relative luminance.
   ========================================================================= */
const CM = {};
CM.srgbToLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
CM.linToSrgb = c => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
CM.parse = function (hex) {
  const c = MFX.hexToRgb(hex || "#000");
  return [c[0] / 255, c[1] / 255, c[2] / 255];
};
CM.hex = function (rgb) {
  return MFX.rgbToHex([rgb[0] * 255, rgb[1] * 255, rgb[2] * 255]);
};
/* sRGB (0..1) → OKLab. Ottosson's transform: the only widely available space
   where "space these hues evenly" and "keep these lightnesses apart" are the
   same operation the eye performs. */
CM.toOklab = function (rgb) {
  const r = CM.srgbToLin(rgb[0]), g = CM.srgbToLin(rgb[1]), b = CM.srgbToLin(rgb[2]);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [
    0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
  ];
};
CM.fromOklab = function (lab) {
  const l_ = lab[0] + 0.3963377774 * lab[1] + 0.2158037573 * lab[2];
  const m_ = lab[0] - 0.1055613458 * lab[1] - 0.0638541728 * lab[2];
  const s_ = lab[0] - 0.0894841775 * lab[1] - 1.2914855480 * lab[2];
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  return [
    CM.linToSrgb(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
    CM.linToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
    CM.linToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s),
  ].map(v => MFX.clamp(v, 0, 1));
};
CM.toOklch = function (rgb) {
  const [L, a, b] = CM.toOklab(rgb);
  return [L, Math.hypot(a, b), (Math.atan2(b, a) * 180 / Math.PI + 360) % 360];
};
CM.fromOklch = function (L, C, h) {
  const r = h * Math.PI / 180;
  return CM.fromOklab([L, C * Math.cos(r), C * Math.sin(r)]);
};
/* Is this OKLCH triple actually reachable in sRGB? Chroma is the axis that
   clips first, so walk it down until the round-trip survives. */
CM.gamutFit = function (L, C, h) {
  let lo = 0, hi = C;
  for (let i = 0; i < 18; i++) {
    const mid = (lo + hi) / 2;
    const rgb = CM.fromOklch(L, mid, h);
    const back = CM.toOklch(rgb);
    if (Math.abs(back[0] - L) < 0.006 && Math.abs(back[1] - mid) < 0.006) lo = mid; else hi = mid;
  }
  return CM.fromOklch(L, lo, h);
};
/* ΔE in OKLab — Euclidean distance is meaningful here, which is the whole
   point of using it over HSL. ~0.02 is "only just different". */
CM.deltaE = function (hexA, hexB) {
  const A = CM.toOklab(CM.parse(hexA)), B = CM.toOklab(CM.parse(hexB));
  return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]);
};
CM.relLum = function (hex) {
  const c = CM.parse(hex);
  return 0.2126 * CM.srgbToLin(c[0]) + 0.7152 * CM.srgbToLin(c[1]) + 0.0722 * CM.srgbToLin(c[2]);
};
CM.contrast = function (a, b) {
  const la = CM.relLum(a), lb = CM.relLum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
};
/* Machado, Oliveira & Fernandes (2009), severity 1.0 — the same matrices
   browsers use, so the on-canvas proof matches other tooling. */
CM.CVD = {
  protan: [0.152286, 1.052583, -0.204868, 0.114503, 0.786281, 0.099216, -0.003882, -0.048116, 1.051998],
  deutan: [0.367322, 0.860646, -0.227968, 0.280085, 0.672501, 0.047413, -0.011820, 0.042940, 0.968881],
  tritan: [1.255528, -0.076749, -0.178779, -0.078411, 0.930809, 0.147602, 0.004733, 0.691367, 0.303900],
};
CM.simulate = function (hex, kind) {
  if (kind === "grey") {
    const y = CM.relLum(hex);
    const v = CM.linToSrgb(y);
    return CM.hex([v, v, v]);
  }
  const M = CM.CVD[kind];
  if (!M) return hex;
  const c = CM.parse(hex).map(CM.srgbToLin);
  const out = [0, 1, 2].map(i => MFX.clamp(M[i * 3] * c[0] + M[i * 3 + 1] * c[1] + M[i * 3 + 2] * c[2], 0, 1));
  return CM.hex(out.map(CM.linToSrgb));
};
MFX2.CM = CM;

/* =========================================================================
   GEOMETRY HELPERS
   Shared by boolean ops (6.2), elevation (6.3), labels (6.1) and bathymetry.
   ========================================================================= */
const G2 = {};
G2.area2 = pts => {
  let s = 0;
  for (let i = 0, n = pts.length; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; }
  return s / 2;
};
G2.cw = pts => G2.area2(pts) < 0;
G2.ensureCCW = pts => (G2.area2(pts) < 0 ? pts.slice().reverse() : pts.slice());
G2.bbox = pts => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { if (p[0] < x0) x0 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[0] > x1) x1 = p[0]; if (p[1] > y1) y1 = p[1]; }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0, x1, y1 };
};
G2.inside = function (p, pts) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
};
G2.segInt = function (a, b, c, d) {
  const r = [b[0] - a[0], b[1] - a[1]], s = [d[0] - c[0], d[1] - c[1]];
  const den = r[0] * s[1] - r[1] * s[0];
  if (Math.abs(den) < 1e-12) return null;
  const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den;
  const u = ((c[0] - a[0]) * r[1] - (c[1] - a[1]) * r[0]) / den;
  if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
  return { p: [a[0] + t * r[0], a[1] + t * r[1]], t, u };
};
G2.dedupe = function (pts, tol) {
  tol = tol || 1e-6;
  const out = [];
  for (const p of pts) {
    const q = out[out.length - 1];
    if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > tol) out.push(p);
  }
  while (out.length > 1 && Math.hypot(out[0][0] - out[out.length - 1][0], out[0][1] - out[out.length - 1][1]) < tol) out.pop();
  return out;
};
/* offset a closed ring outward by d, by pushing each vertex along the
   bisector of its two edge normals. Good enough for coastline echo lines;
   not a general-purpose Minkowski offset, and it is not asked to be. */
G2.offsetRing = function (pts, d) {
  const n = pts.length, out = [];
  const sign = G2.cw(pts) ? -1 : 1;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    let n1 = [p[1] - a[1], a[0] - p[0]], n2 = [b[1] - p[1], p[0] - b[0]];
    const l1 = Math.hypot(n1[0], n1[1]) || 1, l2 = Math.hypot(n2[0], n2[1]) || 1;
    n1 = [n1[0] / l1, n1[1] / l1]; n2 = [n2[0] / l2, n2[1] / l2];
    let bx = n1[0] + n2[0], by = n1[1] + n2[1];
    const bl = Math.hypot(bx, by);
    if (bl < 1e-9) { bx = n1[0]; by = n1[1]; } else { bx /= bl; by /= bl; }
    /* mitre limit — a sharp cape would otherwise fire a spike across the map */
    const cosHalf = Math.max(0.25, (n1[0] * bx + n1[1] * by));
    const scale = MFX.clamp(1 / cosHalf, 1, 4);
    out.push([p[0] + bx * d * sign * scale, p[1] + by * d * sign * scale]);
  }
  return out;
};
G2.centroidOf = function (pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n], f = p[0] * q[1] - q[0] * p[1];
    a += f; cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f;
  }
  if (Math.abs(a) < 1e-12) { const b = G2.bbox(pts); return [b.x + b.w / 2, b.y + b.h / 2]; }
  a *= 3;
  return [cx / a, cy / a];
};
MFX2.G2 = G2;

/* =========================================================================
   COMMAND REGISTRY (§8.1, and the substrate for §8.7 and §10.2)
   -------------------------------------------------------------------------
   One table that the command palette searches, the shortcut editor rebinds,
   the cheat sheet prints and the macro recorder replays. Registering a
   command once buys all four.
   ========================================================================= */
MFX2.commands = [];
MFX2.cmd = function (id, title, group, run, opts) {
  opts = opts || {};
  const c = { id, title, group, run, keys: opts.keys || "", when: opts.when || null, desc: opts.desc || "", macro: opts.macro !== false };
  const i = MFX2.commands.findIndex(x => x.id === id);
  if (i >= 0) MFX2.commands[i] = c; else MFX2.commands.push(c);
  return c;
};
MFX2.runCmd = function (id, arg) {
  const c = MFX2.commands.find(x => x.id === id);
  if (!c) { toast("No such command: " + id); return false; }
  if (c.when && !c.when()) { toast(c.title + " isn't available right now."); return false; }
  try {
    if (MFX2.macro && MFX2.macro.recording && c.macro) MFX2.macro.steps.push({ cmd: id, arg: arg === undefined ? null : arg });
    c.run(arg);
    return true;
  } catch (e) {
    console.error("[MapForge] command failed:", id, e);
    toast("“" + c.title + "” failed — see the console for details.");
    return false;
  }
};

MFX2.hr = function () {

/* ===== 01_colour.js ===== */
/* =========================================================================
   5.1 — COLOUR MANAGEMENT: PROOFING, AUDIT, PERCEPTUAL PALETTES
   -------------------------------------------------------------------------
   Three parts, in the order the review recommends:
     · proof modes      — see the board as a colour-blind player sees it
     · conflict report  — be *told* which adjacent nations collide
     · palette generator— stop the collisions happening in the first place
   The third is the real fix; the first two exist because a generated palette
   still has to survive a designer overriding one nation by hand.
   ========================================================================= */

/* The proof filters live in their own hidden SVG in the document body rather
   than in buildDefs(), because a CSS `filter:url(#id)` on #svg cannot
   reference a filter inside the element it is filtering. */
MFX2.installProofFilters = function () {
  if ($("#mf2-filters")) return;
  const host = document.createElement("div");
  host.id = "mf2-filters";
  host.setAttribute("aria-hidden", "true");
  host.style.cssText = "position:absolute;width:0;height:0;overflow:hidden;pointer-events:none";
  const mat = m => [
    m[0], m[1], m[2], 0, 0,
    m[3], m[4], m[5], 0, 0,
    m[6], m[7], m[8], 0, 0,
    0, 0, 0, 1, 0,
  ].map(v => (+v).toFixed(6)).join(" ");
  const grey = mat([0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722]);
  host.innerHTML =
    '<svg width="0" height="0"><defs>' +
    '<filter id="mf2-proof-protan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="' + mat(CM.CVD.protan) + '"/></filter>' +
    '<filter id="mf2-proof-deutan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="' + mat(CM.CVD.deutan) + '"/></filter>' +
    '<filter id="mf2-proof-tritan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="' + mat(CM.CVD.tritan) + '"/></filter>' +
    '<filter id="mf2-proof-grey" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="' + grey + '"/></filter>' +
    "</defs></svg>";
  document.body.appendChild(host);
};
MFX2.PROOFS = [
  ["none", "None"], ["grey", "Greyscale"], ["protan", "Protanopia"],
  ["deutan", "Deuteranopia"], ["tritan", "Tritanopia"],
];
MFX2.applyProof = function () {
  MFX2.installProofFilters();
  const p = MFX2.prefs.proof;
  const f = (p && p !== "none") ? "url(#mf2-proof-" + p + ")" : "";
  svg.style.filter = f;
  const mm = $("#minimap");
  if (mm) mm.style.filter = f;
  const badge = $("#mf2-proofbadge");
  if (badge) {
    const on = !!f;
    badge.classList.toggle("show", on);
    if (on) badge.textContent = "Proofing: " + t((MFX2.PROOFS.find(x => x[0] === p) || [, p])[1]);
  }
};
MFX2.setProof = function (p) {
  MFX2.prefs.proof = p;
  MFX2.savePrefs();
  MFX2.applyProof();
  panel();
};

/* ---------------- the audit ----------------
   Adjacency-aware by design: two similar colours on opposite edges of the
   board are not a problem, and flagging them trains people to ignore the
   report. Only pairs that actually touch, or that share a border via the
   adjacency graph, are scored. */
MFX2.COLOUR_LIMITS = { dE: 0.16, greyRatio: 1.35, dEsim: 0.12 };
MFX2.nationPairsInContact = function () {
  const pairs = new Map();
  const add = (a, b, why) => {
    if (!a || !b || a === b) return;
    const k = [a, b].sort().join("|");
    if (!pairs.has(k)) pairs.set(k, { a: k.split("|")[0], b: k.split("|")[1], why: new Set() });
    pairs.get(k).why.add(why);
  };
  for (const r of P.regions) {
    for (const bId of (r.adj || [])) {
      const o = byId(bId);
      if (o) add(r.nation, o.nation, "adjacent");
    }
  }
  return [...pairs.values()];
};
MFX2.colourAudit = function () {
  const out = [];
  if (!P) return out;
  const nat = P.nations || {};
  const pairs = MFX2.nationPairsInContact();
  for (const pr of pairs) {
    const A = nat[pr.a], B = nat[pr.b];
    if (!A || !B || !A.color || !B.color) continue;
    const dE = CM.deltaE(A.color, B.color);
    const gc = CM.contrast(CM.simulate(A.color, "grey"), CM.simulate(B.color, "grey"));
    const sims = {};
    for (const k of ["protan", "deutan", "tritan"]) {
      sims[k] = CM.deltaE(CM.simulate(A.color, k), CM.simulate(B.color, k));
    }
    const worst = Math.min(sims.protan, sims.deutan, sims.tritan);
    const fails = [];
    if (dE < MFX2.COLOUR_LIMITS.dE) fails.push("too close in normal vision");
    if (gc < MFX2.COLOUR_LIMITS.greyRatio) fails.push("merge in greyscale");
    if (worst < MFX2.COLOUR_LIMITS.dEsim) {
      const which = Object.keys(sims).filter(k => sims[k] < MFX2.COLOUR_LIMITS.dEsim)
        .map(k => ({ protan: "protanopia", deutan: "deuteranopia", tritan: "tritanopia" })[k]);
      fails.push("merge under " + which.join(" and "));
    }
    if (fails.length) {
      out.push({
        a: pr.a, b: pr.b, dE, grey: gc, sims, fails,
        sev: (dE < MFX2.COLOUR_LIMITS.dE * 0.65 || worst < MFX2.COLOUR_LIMITS.dEsim * 0.6) ? "err" : "warn",
      });
    }
  }
  return out.sort((x, y) => x.dE - y.dE);
};

/* ---------------- perceptual palette generation ----------------
   Replaces the hue walk in autoColor(). Candidates are sampled across hue and
   two lightness bands, then chosen by greedy farthest-point selection under a
   distance that is the *minimum* separation across normal vision and, when
   asked, all three dichromacies. Optimising the worst case is the point: a
   palette that is lovely for trichromats and useless for deuteranopes has not
   solved the problem. */
MFX2.paletteOpts = { safe: true, chroma: 0.11, lightA: 0.62, lightB: 0.78, bands: 2 };
MFX2.generatePalette = function (n, opts) {
  opts = Object.assign({}, MFX2.paletteOpts, opts || {});
  const cand = [];
  const bands = opts.bands >= 2 ? [opts.lightA, opts.lightB] : [opts.lightA];
  for (let h = 0; h < 360; h += 4) {
    for (const L of bands) {
      const rgb = CM.gamutFit(L, opts.chroma, h);
      cand.push(CM.hex(rgb));
    }
  }
  const spaces = opts.safe ? [null, "protan", "deutan", "tritan"] : [null];
  const cache = new Map();
  const enc = hex => {
    if (cache.has(hex)) return cache.get(hex);
    const v = spaces.map(s => CM.toOklab(CM.parse(s ? CM.simulate(hex, s) : hex)));
    cache.set(hex, v);
    return v;
  };
  const sep = (x, y) => {
    const X = enc(x), Y = enc(y);
    let m = Infinity;
    for (let i = 0; i < X.length; i++) {
      const d = Math.hypot(X[i][0] - Y[i][0], X[i][1] - Y[i][1], X[i][2] - Y[i][2]);
      if (d < m) m = d;
    }
    return m;
  };
  /* seed on a mid-blue: it is the hue that survives all three dichromacies
     best, so starting there tends to produce a better-spread final set */
  const picked = [cand.reduce((best, c) => {
    const h = CM.toOklch(CM.parse(c))[2];
    const d = Math.abs(((h - 250) % 360 + 540) % 360 - 180);
    return d > best.d ? { c, d } : best;
  }, { c: cand[0], d: -1 }).c];
  while (picked.length < n && picked.length < cand.length) {
    let best = null, bestD = -1;
    for (const c of cand) {
      if (picked.includes(c)) continue;
      let d = Infinity;
      for (const p of picked) d = Math.min(d, sep(c, p));
      if (d > bestD) { bestD = d; best = c; }
    }
    if (!best) break;
    picked.push(best);
  }
  return picked.slice(0, n);
};
MFX2.applyPalette = function (opts) {
  const keys = Object.keys(P.nations || {});
  if (!keys.length) { toast("There are no nations to recolour."); return; }
  const cols = MFX2.generatePalette(keys.length, opts);
  pushUndo("recolour nations");
  keys.forEach((k, i) => { if (cols[i]) P.nations[k].color = cols[i]; });
  render(); panel();
  const left = MFX2.colourAudit().length;
  toast(keys.length + " nations recoloured. " + (left ? left + " pair(s) still flagged." : "No adjacent pairs collide."));
};

/* the full pair matrix, for people who want to see the numbers */
MFX2.colourReportModal = function () {
  const keys = Object.keys(P.nations || {});
  const d = MFX2.modalCard("Colour audit", 560);
  const audit = MFX2.colourAudit();
  const head = MFX2.el("p", null,
    audit.length
      ? audit.length + " adjacent nation pair(s) are hard to tell apart. Contact-aware: pairs that never touch are ignored."
      : "Every pair of nations that shares a border is distinguishable in normal vision, in greyscale and under all three dichromacies.");
  d.appendChild(head);

  if (audit.length) {
    const list = MFX2.el("div", "list");
    list.style.maxHeight = "230px";
    for (const c of audit) {
      const it = MFX2.el("div", "item");
      const nA = P.nations[c.a], nB = P.nations[c.b];
      const sw = (col) => '<span style="display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid #0006;background:' + col + ';vertical-align:-1px"></span>';
      it.innerHTML =
        '<span style="flex:1">' + sw(nA.color) + " " + (nA.name || c.a) + " ↔ " + sw(nB.color) + " " + (nB.name || c.b) +
        '<br><span class="mini" style="color:' + (c.sev === "err" ? "var(--danger)" : "var(--parch-dim)") + '">' + c.fails.join("; ") + "</span></span>" +
        '<span class="mini">ΔE ' + c.dE.toFixed(3) + " · grey " + c.grey.toFixed(2) + ":1</span>";
      it.onclick = () => {
        const r = P.regions.find(x => x.nation === c.a);
        if (r) { setSelection([r.id]); zoomToSelection(); render(); panel(); }
      };
      list.appendChild(it);
    }
    d.appendChild(list);
  }

  d.appendChild(MFX2.sub("Simulate"));
  const rowP = MFX2.el("div", "btnrow");
  MFX2.PROOFS.forEach(([k, label]) => {
    const b = btn(t(label), () => { MFX2.setProof(k); [...rowP.children].forEach(c => c.classList.remove("on")); b.classList.add("on"); b.style.borderColor = "var(--gold)"; });
    if (MFX2.prefs.proof === k) b.style.borderColor = "var(--gold)";
    rowP.appendChild(b);
  });
  d.appendChild(rowP);

  d.appendChild(MFX2.sub("Regenerate the palette"));
  const optSafe = { safe: MFX2.paletteOpts.safe };
  d.appendChild(MFX.checkbox("Constrain to colour-blind-safe separation", MFX2.paletteOpts.safe, v => { MFX2.paletteOpts.safe = v; optSafe.safe = v; }));
  d.appendChild(MFX.note("Spaces nations evenly in OKLCH hue across two lightness bands, then maximises the worst-case separation across normal, protan, deutan and tritan vision."));
  d.appendChild(MFX2.foot(
    btn("Close", closeModal),
    btn("Recolour all nations", () => { closeModal(); MFX2.applyPalette(MFX2.paletteOpts); }, "gold")
  ));
  openModal(d);
};

/* fold the colour findings into the existing problem list, so there is one
   place to look rather than two */
const _m2FindProblems = findProblems;
findProblems = function () {
  const out = _m2FindProblems();
  if (!P) return out;
  for (const c of MFX2.colourAudit()) {
    const nA = P.nations[c.a], nB = P.nations[c.b];
    out.push({
      sev: c.sev,
      msg: (nA.name || c.a) + " and " + (nB.name || c.b) + " are hard to tell apart",
      sub: "They share a border and " + c.fails.join("; ") + ". ΔE " + c.dE.toFixed(3) + ".",
      focus: () => MFX2.colourReportModal(),
    });
  }
  return out;
};

/* =========================================================================
   5.2 — PATTERN FILLS & MONOCHROME-SAFE RENDERING
   -------------------------------------------------------------------------
   A second, redundant encoding of ownership. Colour tuning alone cannot save
   a map that is photocopied, and pattern is the standard accessibility answer
   where colour has run out of separations.
   ========================================================================= */
MFX2.PATTERNS = {
  none: { label: "None" },
  hatch: { label: "Diagonal hatch", d: s => 'M0,' + s + ' L' + s + ',0', stroke: true },
  hatch2: { label: "Reverse hatch", d: s => 'M0,0 L' + s + ',' + s, stroke: true },
  cross: { label: "Cross-hatch", d: s => 'M0,' + s + ' L' + s + ',0 M0,0 L' + s + ',' + s, stroke: true },
  grid: { label: "Grid", d: s => 'M0,0 H' + s + ' M0,0 V' + s, stroke: true },
  dots: { label: "Dot stipple", dots: true },
  chevron: { label: "Chevron", d: s => 'M0,' + (s * 0.7) + ' L' + (s / 2) + ',' + (s * 0.25) + ' L' + s + ',' + (s * 0.7), stroke: true },
  tartan: { label: "Tartan", d: s => 'M0,0 H' + s + ' M0,' + (s * .5) + ' H' + s + ' M0,0 V' + s, stroke: true, weights: [1.6, .6, .6] },
  wavepat: { label: "Waves", d: s => 'M0,' + (s * .6) + ' Q' + (s * .25) + ',' + (s * .2) + ' ' + (s * .5) + ',' + (s * .6) + ' T' + s + ',' + (s * .6), stroke: true },
  brick: { label: "Brick", d: s => 'M0,0 H' + s + ' M0,' + (s * .5) + ' H' + s + ' M' + (s * .5) + ',0 V' + (s * .5) + ' M0,' + (s * .5) + ' V' + s, stroke: true },
};
MFX2.PATTERN_LIST = Object.keys(MFX2.PATTERNS).map(k => [k, MFX2.PATTERNS[k].label]);
MFX2.patDensitySize = { 1: 14, 2: 9, 3: 6 };

MFX2.natPattern = function (key) {
  const n = P.nations[key];
  if (!n || !n.pat || n.pat === "none") return null;
  return { kind: n.pat, density: n.patD || 2, angle: n.patA || 0, ink: n.patInk || null, weight: n.patW || 1 };
};
MFX2.patternId = key => "mf2-natpat-" + slug(key);

/* Build one <pattern> per nation that carries its base colour *and* its marks.
   Self-contained means the export clone needs no special handling, and the
   print proof is one attribute change rather than a parallel renderer. */
MFX2.buildNationPatterns = function (defs, opts) {
  opts = opts || {};
  const mono = !!opts.mono;
  for (const key in (P.nations || {})) {
    const spec = MFX2.natPattern(key);
    if (!spec) continue;
    const n = P.nations[key];
    const size = MFX2.patDensitySize[spec.density] || 9;
    const base = mono ? "#ffffff" : (n.color || "#888");
    /* ink derives from the fill so the marks read on both light and dark
       nations without the designer having to pick a second colour */
    const ink = mono ? "#000000" : (spec.ink || (CM.relLum(base) > 0.34 ? "#00000099" : "#ffffff99"));
    const pat = el("pattern", {
      id: MFX2.patternId(key), width: size, height: size,
      patternUnits: "userSpaceOnUse",
      patternTransform: spec.angle ? "rotate(" + spec.angle + ")" : null,
    }, defs);
    if (spec.angle) pat.setAttribute("patternTransform", "rotate(" + spec.angle + ")");
    el("rect", { width: size, height: size, fill: base }, pat);
    const def = MFX2.PATTERNS[spec.kind];
    if (def && def.dots) {
      const r = Math.max(0.6, size * 0.11) * spec.weight;
      el("circle", { cx: size * 0.25, cy: size * 0.25, r, fill: ink }, pat);
      el("circle", { cx: size * 0.75, cy: size * 0.75, r, fill: ink }, pat);
    } else if (def && def.d) {
      el("path", {
        d: def.d(size), stroke: ink, fill: "none",
        "stroke-width": (mono ? 1.2 : 0.9) * spec.weight,
        "stroke-linecap": "round",
      }, pat);
    }
  }
};

/* print proof: fills become pattern-only at 100% black on white, which is
   what a monochrome laser printer will actually produce */
MFX2.printProof = false;
MFX2.setPrintProof = function (on) {
  MFX2.printProof = !!on;
  render(); panel();
  if (on) toast("Print proof on — fills render as pattern only, at 100% black.");
};

const _m2BuildDefs = buildDefs;
buildDefs = function (host) {
  const defs = _m2BuildDefs(host);
  try {
    MFX2.buildNationPatterns(defs, { mono: MFX2.printProof });
    MFX2.buildTextureDefs(defs);
    MFX2.buildReliefDefs(defs);
  } catch (e) { console.warn("[MapForge] defs extension failed", e); }
  return defs;
};

/* cellFill is the single choke point every renderer and exporter passes
   through, so patterns and the print proof both attach here. */
const _m2CellFill = cellFill;
cellFill = function (r) {
  if (MFX2.printProof) {
    if (colorBy === "nation" && r.nation && MFX2.natPattern(r.nation)) return "url(#" + MFX2.patternId(r.nation) + ")";
    return "#ffffff";
  }
  if (MFX2.texFillFor && MFX2.texFillFor(r)) return MFX2.texFillFor(r);
  if (colorBy === "nation" && r.nation && MFX2.natPattern(r.nation) && !r.color) {
    return "url(#" + MFX2.patternId(r.nation) + ")";
  }
  return _m2CellFill(r);
};

/* the print proof also needs the paper to go white and the ink to go black,
   otherwise the proof is a lie */
const _m2ApplyTheme = applyTheme;
applyTheme = function () {
  _m2ApplyTheme();
  const root = document.documentElement;
  if (MFX2.printProof) {
    root.style.setProperty("--sea", "#ffffff");
    root.style.setProperty("--landfill", "#ffffff");
    root.style.setProperty("--cellfill", "#ffffff");
    root.style.setProperty("--m-cellstroke", "#000000");
    root.style.setProperty("--m-landstroke", "#000000");
    root.style.setProperty("--m-coast", "#000000");
    root.style.setProperty("--m-label", "#000000");
    root.style.setProperty("--m-labelhalo", "#ffffff");
    const st = $("#stage");
    if (st) st.style.background = "#ffffff";
  } else {
    const st = $("#stage");
    if (st) st.style.background = "";

/* keep the exported CSS honest: the proof and the pattern ink must both
   appear in the export, since the export is what goes to the printer */
const _m2ExportCSS = exportCSS;
exportCSS = function () {
  let css = _m2ExportCSS();
  if (MFX2.printProof) {
    css += "\n.land{fill:#fff;stroke:#000}.cell{fill:#fff;stroke:#000}.coastline{stroke:#000}" +
      "\n.rgname,.maplabel{fill:#000;stroke:#fff}";

/* ===== 02_render.js ===== */
/* =========================================================================
   5.3 — HAND-DRAWN / SKETCH RENDERING MODE
   -------------------------------------------------------------------------
   A post-processor that runs between geometry and the painted DOM, exactly
   as the review suggests. It samples each finished path and re-emits it with
   seeded displacement, so the same object jitters identically on every frame
   — a drag must not make the coastline shimmer.

   Deliberately *not* a global switch: it is a per-layer render style, because
   applied to everything it reads as a filter rather than as a drawing.
   ========================================================================= */
MFX2.sketchDefaults = { on: false, amp: 1.5, wave: 0.035, double: true, misreg: 1.1, taper: true, seed: 7 };
MFX2.sketch = () => (P && P.sketch) || MFX2.sketchDefaults;
MFX2.sketchOn = function (layerId) {
  const s = MFX2.sketch();
  if (!s.on) return false;
  const l = MFX.layer(layerId);
  return !l || l.sketch !== false;
};
MFX2.sketchCSS = function () {
  return ".mf2-sk-under{fill:none;stroke-linecap:round;stroke-linejoin:round}" +
    ".mf2-bathy{fill:none;pointer-events:none}";
};

/* Resample a path to a polyline and push each sample along its normal by a
   low-frequency noise field. Sampling via getPointAtLength means this works
   on quadratics and arcs (rivers, curved labels) as well as on polygons. */
MFX2.jitterPathD = function (node, seedKey, opts) {
  const s = Object.assign({}, MFX2.sketch(), opts || {});
  let len = 0;
  try { len = node.getTotalLength(); } catch (e) { return null; }
  if (!len || !isFinite(len) || len > 60000) return null;
  const step = MFX.clamp(len / 260, 2.2, 9);
  const n = Math.max(3, Math.round(len / step));
  const seed = MFX2.hashStr(String(seedKey) + "|" + s.seed);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    let p;
    try { p = node.getPointAtLength((i / n) * len); } catch (e) { return null; }
    /* two octaves: a slow wander for the overall wobble, a fast one for the
       tooth of the paper */
    const u = (i / n) * len;
    const a = (MFX2.vnoise(u * s.wave, seed % 97, seed) - 0.5) * 2;
    const b = (MFX2.vnoise(u * s.wave * 4.3, (seed >> 3) % 89, seed + 17) - 0.5) * 2;
    const off = (a * 0.75 + b * 0.25) * s.amp;
    /* normal from the local tangent */
    let q;
    try { q = node.getPointAtLength(Math.min(len, (i / n) * len + 1.2)); } catch (e) { q = p; }
    let tx = q.x - p.x, ty = q.y - p.y;
    const tl = Math.hypot(tx, ty) || 1;
    pts.push([p.x + (-ty / tl) * off, p.y + (tx / tl) * off]);
  }
  const closed = Math.hypot(pts[0][0] - pts[n][0], pts[0][1] - pts[n][1]) < step * 1.5;
  let d = pts.map((p, i) => (i ? "L" : "M") + fmt(p[0]) + "," + fmt(p[1])).join("");
  if (closed) {
    /* corner overshoot — a pen that does not stop exactly where it started
       is the single clearest signal that a line was drawn by hand */
    const o = pts[Math.min(2, pts.length - 1)];
    d += "L" + fmt(o[0]) + "," + fmt(o[1]);
  }
  return d;
};

MFX2.applySketch = function () {
  const s = MFX2.sketch();
  if (!s.on) return;
  const targets = [
    ...svg.querySelectorAll("#gCells path.cell"),
    ...svg.querySelectorAll("#gLand path.land"),
    ...svg.querySelectorAll("#gLand path.coastline"),
    ...svg.querySelectorAll("#gTerr path.riverbed, #gTerr path.riverlit, #gTerr path.lake"),
  ];
  if (targets.length > 1400) return;   // past this, the jitter costs more than it earns
  let i = 0;
  for (const node of targets) {
    const id = node.getAttribute("data-id") || node.getAttribute("class") + "#" + (i++);
    const region = node.getAttribute("data-id") ? byId(node.getAttribute("data-id")) : null;
    if (region && !MFX2.sketchOn(region.layer)) continue;
    const d0 = node.getAttribute("d");
    if (!d0) continue;
    const d1 = MFX2.jitterPathD(node, id);
    if (!d1) continue;
    node.setAttribute("d", d1);
    if (node.classList.contains("cell")) {
      /* fill misregistration — the fill sits a hair off its own outline, the
         way a two-plate press drifts */
      if (s.misreg) node.setAttribute("transform", "translate(" + fmt(((MFX2.hashStr(id) % 100) / 100 - .5) * s.misreg * 2) + "," + fmt(((MFX2.hashStr(id + "y") % 100) / 100 - .5) * s.misreg * 2) + ")");
      if (s.double) {
        const twin = node.cloneNode(false);
        twin.setAttribute("class", "mf2-sk-under");
        twin.setAttribute("d", MFX2.jitterPathD(node, id + "|twin") || d1);
        twin.setAttribute("stroke", "var(--m-cellstroke)");
        twin.setAttribute("stroke-width", 0.7);
        twin.setAttribute("opacity", 0.5);
        twin.removeAttribute("data-id");
        twin.setAttribute("pointer-events", "none");
        node.parentNode.insertBefore(twin, node.nextSibling);
      }
    }
  }
};

/* =========================================================================
   5.4 — LAYER BLEND MODES & PER-LAYER EFFECTS
   -------------------------------------------------------------------------
   Layers already carry visibility, lock and opacity but only ever composite
   normally. Multiply on a grain layer is the difference between "a texture
   sits on top of the map" and "the map is printed on this paper".
   ========================================================================= */
MFX2.BLENDS = [
  ["normal", "Normal"], ["multiply", "Multiply"], ["screen", "Screen"],
  ["overlay", "Overlay"], ["darken", "Darken"], ["lighten", "Lighten"],
  ["color-burn", "Colour burn"], ["color-dodge", "Colour dodge"],
  ["soft-light", "Soft light"], ["hard-light", "Hard light"],
  ["difference", "Difference"], ["hue", "Hue"], ["saturation", "Saturation"],
  ["color", "Colour"], ["luminosity", "Luminosity"],

MFX2.applyLayerBlends = function () {
  const layers = (P.layers || []).filter(l => l.blend && l.blend !== "normal");
  if (!layers.length) return;
  const by = {};
  layers.forEach(l => { by[l.id] = l.blend; });
  svg.querySelectorAll("#gCells path.cell[data-id]").forEach(node => {
    const r = byId(node.getAttribute("data-id"));
    if (!r) return;
    const b = by[r.layer || "base"];
    if (b) node.style.mixBlendMode = b;
  });
  /* the grain and vignette are effects, not objects, so they get their own
     blend setting rather than belonging to a layer */
  const fx = (P.fx || {});
  const grain = svg.querySelector('rect[filter="url(#mf-grain)"]');
  if (grain && fx.grainBlend) grain.style.mixBlendMode = fx.grainBlend;
  const vig = svg.querySelector(".vignette");
  if (vig && fx.vigBlend) vig.style.mixBlendMode = fx.vigBlend;
};

/* =========================================================================
   5.5 — DISCRETE BATHYMETRIC ECHO LINES
   -------------------------------------------------------------------------
   The existing coast halo is a continuous four-band glow. Nautical charts
   instead draw *discrete* contours at fixed depths, which reads as surveyed
   rather than as decorative, and gives the sea a sense of shelf and trench.
   ========================================================================= */
MFX2.bathyDefaults = { on: false, count: 5, gap: 13, growth: 1.22, width: 0.9, opacity: 0.42, dash: "", taper: true, wobble: 0.55 };
MFX2.bathy = () => (P && P.bathy) || MFX2.bathyDefaults;
MFX2.drawBathymetry = function () {
  const b = MFX2.bathy();
  if (!b.on || !P.land || !P.land.length) return;
  const host = svg.querySelector("#gLand");
  if (!host) return;
  const g = document.createElementNS(NS, "g");
  g.setAttribute("id", "gBathy");
  g.setAttribute("class", "mf2-bathy");
  host.insertBefore(g, host.firstChild);
  let dist = 0;
  for (let i = 0; i < b.count; i++) {
    dist += b.gap * Math.pow(b.growth, i);
    const rings = [];
    for (let ri = 0; ri < P.land.length; ri++) {
      const src = P.land[ri];
      if (!src || src.length < 3) continue;
      let ring = G2.offsetRing(src, dist);
      if (b.wobble) {
        const seed = MFX2.hashStr("bathy" + ri + "|" + i);
        ring = ring.map((p, k) => {
          const n = (MFX2.vnoise(k * 0.22, i * 3.7, seed) - 0.5) * 2 * b.wobble * (1 + i * 0.35);
          return [p[0] + n, p[1] + n * 0.7];
        });
      }
      rings.push(ring);
    }
    if (!rings.length) continue;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", ringsD(rings));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "var(--m-coast)");
    path.setAttribute("stroke-width", b.width * (b.taper ? Math.max(0.35, 1 - i * 0.13) : 1));
    path.setAttribute("opacity", b.opacity * (b.taper ? Math.max(0.25, 1 - i * 0.15) : 1));
    path.setAttribute("stroke-linejoin", "round");
    if (b.dash) path.setAttribute("stroke-dasharray", b.dash);
    g.appendChild(path);
  }
};

/* =========================================================================
   5.6 — TEXTURE & PHOTO FILLS INSIDE REGIONS
   -------------------------------------------------------------------------
   A parchment scan, a linen weave or a photographed watercolour wash, tiled
   inside a region. Stored on the project so a saved file still renders.
   ========================================================================= */
MFX2.textures = () => (P.textures || (P.textures = {}));
MFX2.texId = k => "mf2-tex-" + slug(k);
MFX2.buildTextureDefs = function (defs) {
  const T = MFX2.textures();
  for (const k in T) {
    const tx = T[k];
    if (!tx || !tx.url) continue;
    const size = tx.size || 120;
    const pat = el("pattern", {
      id: MFX2.texId(k), width: size, height: size, patternUnits: "userSpaceOnUse",
    }, defs);
    if (tx.rot) pat.setAttribute("patternTransform", "rotate(" + tx.rot + ")");
    if (tx.tint) el("rect", { width: size, height: size, fill: tx.tint }, pat);
    const im = el("image", {
      x: 0, y: 0, width: size, height: size, href: tx.url,
      preserveAspectRatio: "xMidYMid slice",
      opacity: tx.opacity === undefined ? 1 : tx.opacity,
    }, pat);

};
MFX2.texFillFor = function (r) {
  if (!r || !r.tex) return null;
