      const cx=r.x,cy=r.y,rx=f.rx||18,ry=f.ry||15;
      el("ellipse",{class:"wood",cx,cy,rx,ry},g);
      const n=Math.max(10,Math.round(rx*ry/34));
      const trees=[];
      for(let i=0;i<n;i++){
        const a=i*2.39996,rr=Math.sqrt(i/n);
        const x=cx+Math.cos(a)*rx*rr*.84, y=cy+Math.sin(a)*ry*rr*.84;
        trees.push([x,y,(f.size||3.4)*(.8+hash2(x,y,11)*.5), Math.floor(hash2(x,y,12)*3)]);
      }
      trees.sort((a,b)=>a[1]-b[1]);
      trees.forEach(([x,y,s,v])=>drawTree(x,y,s,g,v));
      if(hl) el("ellipse",{class:"forestsel",cx,cy,rx:rx+3,ry:ry+3},g);
    } else if(f.t==="river"){
      const pts=riverPts(f);
      const d=smoothPath(pts);
      if(!d) return;
      el("path",{class:"riverbed",d,"stroke-width":f.w||2.2},g);
      el("path",{class:"riverlit",d,"stroke-width":(f.w||2.2)*.45},g);
      if(hl) el("path",{class:"seqhl",d},g);
      const hit=el("path",{class:"terrhit",d,"data-terr":idx},g);
      hit.setAttribute("pointer-events","stroke");
    } else if(f.t==="lake"){
      if(!f.pts||f.pts.length<3) return;
      el("path",{class:"lake"+(hl?" sel":""),d:ringD(f.pts),"data-terr":idx},g).setAttribute("pointer-events","auto");
    } else if(f.t==="border"){
      const pts=f.pts||[];
      if(pts.length<2) return;
      const d="M"+pts.map(p=>fmt(p[0])+","+fmt(p[1])).join("L");
      if(f.style==="river"){
        const sd=smoothPath(pts);
        el("path",{class:"riverbed",d:sd,"stroke-width":f.w||2.6},g);
        el("path",{class:"riverlit",d:sd,"stroke-width":(f.w||2.6)*.45},g);
      } else if(f.style==="forest"){
        treesAlong(pts, f.size||4, g);
      } else if(f.style==="wall"){
        el("path",{class:"borderwall",d},g);
        peaksAlong(pts, (f.s||.5)*.6, g, "peak");
      } else {
        peaksAlong(pts, f.s||.75, g);
      }
      if(f.block) el("path",{class:"blockmark",d},g);
      if(hl) el("path",{class:"seqhl",d},g);
      // fat invisible ribbon so the feature can be clicked
      const hit=el("path",{class:"terrhit",d,"data-terr":idx},g);
      hit.setAttribute("pointer-events","stroke");
    }
  });
}
/* editor overlay: handles, drafts */
function drawOverlay(){
  const g=el("g",{class:"editor-only",id:"gOv"},svg);
  const hs = handleSize();
  // selected polygon handles (region cell or land ring or lake)
  let pts=null, kind=null;
  if(sel){
    if(sel.type==="region" && P.cells[sel.id]) { pts=P.cells[sel.id].pts; kind="cell"; }
    else if(sel.type==="land" && P.land[sel.ring]) { pts=P.land[sel.ring]; kind="land"; }
    else if(sel.type==="terrain" && P.terrain[sel.idx] && P.terrain[sel.idx].t==="lake"){ pts=P.terrain[sel.idx].pts; kind="lake"; }
  }
  // marquee rubber band (A1)
  if(drag && drag.kind==="marquee"){
    const x0=Math.min(drag.start[0],drag.cur[0]), y0=Math.min(drag.start[1],drag.cur[1]);
    el("rect",{class:"marquee",x:x0,y:y0,
      width:Math.abs(drag.cur[0]-drag.start[0]),height:Math.abs(drag.cur[1]-drag.start[1])},g);
  }
  if(pts && pts.length){
    // midpoints
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      el("circle",{class:"mid",cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,r:hs*.7,"data-mid":i},g);
    }
    // vertices shared with a neighbouring region get a green ring (A2)
    const weldTol=Math.max(1.2, hs*0.9);
    pts.forEach((p,i)=>{
      const shared = topoEdit && kind==="cell" &&
        coincidentVerts(p[0],p[1],weldTol,sel.id,i).length>0;
      el("circle",{class:"vx"+(shared?" weld":""),cx:p[0],cy:p[1],r:hs,"data-vx":i},g);
    });
    if(kind==="cell"){
      const c=P.cells[sel.id], a=c.a||[byId(sel.id).x,byId(sel.id).y];
      el("circle",{class:"anchor-h",cx:a[0],cy:a[1],r:hs+2,"data-anchor":1},g);
      el("line",{class:"adjline",x1:a[0]-6,y1:a[1],x2:a[0]+6,y2:a[1]},g);
      el("line",{class:"adjline",x1:a[0],y1:a[1]-6,x2:a[0],y2:a[1]+6},g);
    }
  }
  // selected wall endpoints
  if(sel&&sel.type==="wall" && P.walls[sel.idx]){
    const w=P.walls[sel.idx];
    el("circle",{class:"vx",cx:w[0],cy:w[1],r:hs,"data-wend":0},g);
    el("circle",{class:"vx",cx:w[2],cy:w[3],r:hs,"data-wend":1},g);
  }
  if(sel&&sel.type==="road" && P.roads[sel.idx] && P.roads[sel.idx].p){
    const p=P.roads[sel.idx].p;
    el("circle",{class:"vx",cx:p[0],cy:p[1],r:hs,"data-rend":0},g);
    el("circle",{class:"vx",cx:p[2],cy:p[3],r:hs,"data-rend":1},g);
  }
  // freehand stroke preview
  if(drag && drag.kind==="free" && drag.free && drag.raw.length>1){
    el("path",{class:"draft",d:"M"+drag.raw.map(p=>fmt(p[0])+","+fmt(p[1])).join("L")+"Z"},g);
  }
  // live shape preview
  if(drag && drag.kind==="shape"){
    const [cx,cy,rx,ry]=shapeBox(drag);
    const s=makeShape(shapeOpts.kind,cx,cy,rx,ry);
    el("path",{class:"preview",d:ringD(s.pts)},g);
    if(s.deco) el("path",{class:"preview",d:ringD(s.deco),fill:"none"},g);
  }
  // draft polygon
  if(draft.length){
    let d="M"+draft.map(p=>p.join(",")).join("L");
    el("path",{class:"draft",d},g);
    draft.forEach(p=>el("circle",{class:"draftpt",cx:p[0],cy:p[1],r:hs*.8},g));
  }
  // region sequence highlight
  if(seq.length){
    const pts2=seq.map(REGxy).filter(Boolean);
    if(pts2.length>1) el("path",{class:"seqhl",d:"M"+pts2.map(p=>p.join(",")).join("L")},g);
    pts2.forEach(p=>el("circle",{class:"draftpt",cx:p[0],cy:p[1],r:handleSize()},g));
  }
  if(roadFrom){ const p=REGxy(roadFrom); if(p) el("circle",{class:"draftpt",cx:p[0],cy:p[1],r:handleSize()+2},g); }
  if(adjFrom){ const p=REGxy(adjFrom); if(p) el("circle",{class:"draftpt",cx:p[0],cy:p[1],r:handleSize()+2},g); }
}
/* ---------- C6: minimap ---------- */
let mmBox=null;
function contentBounds(pad){
  pad=pad===undefined?20:pad;
  let xs=[],ys=[];
  P.land.flat().forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  Object.values(P.cells).forEach(c=>c.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  P.regions.forEach(r=>{xs.push(r.x);ys.push(r.y);});
  (P.labels||[]).forEach(L=>{xs.push(L.x);ys.push(L.y);});
  if(!xs.length) return {x:0,y:0,w:P.w,h:P.h};
  const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad;
  return {x:x0,y:y0,w:Math.max(1,Math.max(...xs)+pad-x0),h:Math.max(1,Math.max(...ys)+pad-y0)};
}
function drawMinimap(){
  const host=$("#minimap"), mm=$("#mmsvg");
  host.classList.toggle("show", !!show.minimap);
  if(!show.minimap){ return; }
  const b=contentBounds(30);
  mmBox=b;
  mm.setAttribute("viewBox", b.x+" "+b.y+" "+b.w+" "+b.h);
  mm.setAttribute("preserveAspectRatio","xMidYMid meet");
  mm.innerHTML="";
  if(P.land.length) el("path",{class:"mm-land",d:ringsD(P.land),"fill-rule":"evenodd"},mm);
  for(const r of P.regions){
    const c=P.cells[r.id]; if(!c||c.pts.length<3) continue;
    const a={class:"mm-cell",d:ringD(c.pts)};
    const f=cellFill(r); if(f) a.style="fill:"+f;
    el("path",a,mm);
  }
  el("rect",{class:"mm-view",x:vb.x,y:vb.y,width:vb.w,height:vb.h},mm);
}
$("#minimap").addEventListener("pointerdown",ev=>{
  if(!P||!mmBox) return;
  const mm=$("#mmsvg"), rect=mm.getBoundingClientRect();
  // account for preserveAspectRatio letterboxing
  const sc=Math.min(rect.width/mmBox.w, rect.height/mmBox.h);
  const offX=(rect.width-mmBox.w*sc)/2, offY=(rect.height-mmBox.h*sc)/2;
  const mx=mmBox.x+(ev.clientX-rect.left-offX)/sc, my=mmBox.y+(ev.clientY-rect.top-offY)/sc;
  vb.x=mx-vb.w/2; vb.y=my-vb.h/2; render();
});
function zoomTo(box,pad){
  pad=pad===undefined?40:pad;
  const stage=$("#stage").getBoundingClientRect();
  const ar=(stage.width&&stage.height)? stage.width/stage.height : (vb.w/Math.max(1,vb.h))||1.4;
  let w=box.w+pad*2, h=box.h+pad*2;
  if(w/h < ar) w=h*ar; else h=w/ar;
  vb={x:box.x+box.w/2-w/2, y:box.y+box.h/2-h/2, w, h};
  render();
}
function selectionBounds(){
  const ids=selectedIds();
  let xs=[],ys=[];
  ids.forEach(id=>{
    const c=P.cells[id], r=byId(id);
    if(c&&c.pts.length) c.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
    else if(r){ xs.push(r.x-20,r.x+20); ys.push(r.y-20,r.y+20); }
  });
  if(!ids.length && sel){
    const pts=selPts();
    if(pts&&pts.length) pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
    else if(sel.type==="label"&&P.labels[sel.idx]){
      const L=P.labels[sel.idx]; xs.push(L.x-60,L.x+60); ys.push(L.y-30,L.y+30);
    }
  }
  if(!xs.length) return null;
  const x0=Math.min(...xs),y0=Math.min(...ys);
  return {x:x0,y:y0,w:Math.max(1,Math.max(...xs)-x0),h:Math.max(1,Math.max(...ys)-y0)};
}
function zoomToSelection(){
  const b=selectionBounds();
  if(!b){ fitView(); return; }
  zoomTo(b, Math.max(30, Math.max(b.w,b.h)*.25));
}
function zoom100(){
  const stage=$("#stage").getBoundingClientRect();
  // a zero-size stage (not laid out yet) would collapse the viewBox
  const w=stage.width||vb.w, h=stage.height||vb.h;
  const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
  vb={x:cx-w/2, y:cy-h/2, w, h};
  render();
}
function handleSize(){ return Math.max(2.6, Math.min(6, vb.w/220)); }
/* B6 — a wall that is 4 units wide is a hairline at 20% and a blob at 800%.
   Scale decorative ink by sqrt(zoom) so it stays readable without ballooning. */
function inkScale(){
  const base=(P&&P.w)||1000;
  return Math.max(.45, Math.min(2.6, Math.sqrt(vb.w/base)));
}
function applyInkScale(){
  const k=inkScale(), root=document.documentElement.style;
  root.setProperty("--ink-w",  (1*k).toFixed(3));
  root.setProperty("--wall-w", (4*k).toFixed(3));
  root.setProperty("--road-w", (2*k).toFixed(3));
  root.setProperty("--land-w", (1.4*k).toFixed(3));
}
function byId(id){ return P.regions.find(r=>r.id===id); }

/* ---------------- pointer interaction ---------------- */
function svgPt(ev){
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  return [q.x,q.y];
}
let drag=null; // {kind, ...}
let spaceDown=false;

/* A2 — when a vertex sits on a neighbour's outline, drag them as one point */
function startVxDrag(i){
  const d={kind:"vx", i, linked:[]};
  const pts=selPts();
  if(topoEdit && pts && pts[i] && sel && sel.type==="region"){
    const tol=Math.max(1.2, handleSize()*0.9);
    d.linked=coincidentVerts(pts[i][0], pts[i][1], tol, sel.id, i);
    d.linked.forEach(l=>{ if(P.cells[l.id]&&P.cells[l.id].shape) detachShape(l.id); });
  }
  return d;
}

svg.addEventListener("pointerdown", ev=>{
  if(!P) return;
  svg.setPointerCapture(ev.pointerId);
  const p=svgPt(ev), tgt=ev.target;
  // pan: middle button, space, or pan tool
  if(ev.button===1 || spaceDown || tool==="pan"){
    drag={kind:"pan", start:p.slice(), vb0:Object.assign({},vb)};
    svg.classList.add("panning"); return;
  }
  if(ev.button!==0) return;
  // image drag mode
  if(bgImg.drag && bgImg.url){ drag={kind:"img", start:p, x0:bgImg.x, y0:bgImg.y}; return; }

  // ------- handles first (work in any tool) -------
  if(tgt.dataset.vx!==undefined){ pushUndo(); drag=startVxDrag(+tgt.dataset.vx); return; }
  if(tgt.dataset.mid!==undefined){
    pushUndo();
    const pts=selPts(); const i=+tgt.dataset.mid;
    const a=pts[i], b=pts[(i+1)%pts.length];
    pts.splice(i+1,0,[(a[0]+b[0])/2,(a[1]+b[1])/2]);
    drag={kind:"vx", i:i+1}; render(); return;
  }
  if(tgt.dataset.anchor!==undefined){ pushUndo(); drag={kind:"anchor"}; return; }
  if(tgt.dataset.wend!==undefined){ pushUndo(); drag={kind:"wend", i:+tgt.dataset.wend}; return; }
  if(tgt.dataset.rend!==undefined){ pushUndo(); drag={kind:"rend", i:+tgt.dataset.rend}; return; }
  if(tgt.dataset.node!==undefined && (tool==="select")){
    const id=tgt.dataset.node;
    if(!(sel&&sel.type==="region"&&sel.id===id)){ sel={type:"region",id}; panel(); }
    pushUndo(); drag={kind:"node", id}; render(); return;
  }

  // ------- tool actions -------
  const hitRegion = tgt.dataset.id;
  const hitWall = tgt.dataset.wall, hitRoad = tgt.dataset.road, hitTerr = tgt.dataset.terr;

  switch(tool){
    case "select": {
      const hitLabel = tgt.dataset.label;
      if(hitLabel!==undefined && hitLabel!==""){
        multi.clear();
        sel={type:"label",idx:+hitLabel};
        pushUndo();
        const L=P.labels[+hitLabel];
        drag={kind:"label", idx:+hitLabel, start:p, x0:L.x, y0:L.y, moved:false};
        panel(); render(); return;
      }
      if(hitWall!==undefined){ multi.clear(); sel={type:"wall",idx:+hitWall}; panel(); render(); return; }
      if(hitRoad!==undefined){ multi.clear(); sel={type:"road",idx:+hitRoad}; panel(); render(); return; }
      if(hitTerr!==undefined){ multi.clear(); sel={type:"terrain",idx:+hitTerr}; panel(); render(); return; }
      if(hitRegion){
        // Shift/Ctrl-click toggles membership instead of replacing the selection
        if(ev.shiftKey||ev.metaKey||ev.ctrlKey){
          toggleInSelection(hitRegion); panel(); render(); return;
        }
        const already = (sel&&sel.type==="region"&&sel.id===hitRegion) || multi.has(hitRegion);
        if(!already){ multi.clear(); sel={type:"region",id:hitRegion}; }
        else if(!(sel&&sel.type==="region"&&sel.id===hitRegion)){
          // keep the group, but make the clicked one primary
          multi.delete(hitRegion);
          if(sel&&sel.type==="region") multi.add(sel.id);
          sel={type:"region",id:hitRegion};
        }
        panel();
        pushUndo();
        // snapshot every selected region so a group drag moves as one body
        const ids=selectedIds();
        drag={kind:"region", id:hitRegion, start:p, moved:false, group:ids,
              origs:Object.fromEntries(ids.map(id=>{
                const c=P.cells[id], r=byId(id);
                return [id, JSON.parse(JSON.stringify({
                  pts:c?c.pts:[], a:c?c.a:null,
                  shape:(c&&c.shape)||null, deco:(c&&c.deco)||null, x:r.x, y:r.y}))];

    }

      const pts=selPts();

        pts.splice(ne.i+1,0,[+ne.pt[0].toFixed(2),+ne.pt[1].toFixed(2)]);

      toast((f.block?"Impassable ":"")+BORDER_LABEL[f.style]+" placed between "+byId(a).name+" and "+byId(b).name+
            (f.block?" — the adjacency was removed, so armies must go around.":" — the regions stay connected."));
      return;
    }
    case "draw": case "landdraw": case "lake": case "riverfree": {
      drag={kind:"free", start:snapPt(p), raw:[p.slice()], free:false};
      return;
    }
    case "text": {
      pushUndo();
      P.labels=P.labels||[];
      P.labels.push({x:+p[0].toFixed(1), y:+p[1].toFixed(1), text:"New label",
                     size:+Math.max(12,vb.w/52).toFixed(0), rot:0, curve:0, italic:false, opacity:1});
      multi.clear();
      sel={type:"label",idx:P.labels.length-1};

      drag={kind:"wend", i:1};

    }
    case "road": {
      if(!hitRegion){ toast("Click a region."); return; }
      if(!roadFrom){ roadFrom=hitRegion; hint(); render(); return; }
      if(roadFrom===hitRegion){ roadFrom=null; render(); return; }
      pushUndo();
      const A=byId(roadFrom), B=byId(hitRegion);
      const aA=(P.cells[A.id]&&P.cells[A.id].a)||[A.x,A.y], aB=(P.cells[B.id]&&P.cells[B.id].a)||[B.x,B.y];
      P.roads.push({a:A.id,b:B.id,p:[+aA[0].toFixed(1),+aA[1].toFixed(1),+aB[0].toFixed(1),+aB[1].toFixed(1)],
        gap:+dist(aA,aB).toFixed(1)});
      linkAdj(A.id,B.id,true);
      sel={type:"road",idx:P.roads.length-1}; roadFrom=null;
      panel(); render(); toast("Road + adjacency added: "+A.name+" ↔ "+B.name); return;
    }
    case "adj": {
      if(!hitRegion) return;
      if(!adjFrom){ adjFrom=hitRegion; hint(); render(); return; }
      if(adjFrom!==hitRegion){
        pushUndo();

        linkAdj(adjFrom,hitRegion,!had);
        toast((had?"Removed":"Added")+" adjacency "+adjFrom+" ↔ "+hitRegion);
      }
      adjFrom=null; panel(); render(); return;
    }
    case "ridge": case "river": {
      if(!hitRegion){ return; }
      if(seq[seq.length-1]!==hitRegion) seq.push(hitRegion);
      hint(); render(); return;
    }
    case "forest": {
      if(!hitRegion){ toast("Click a region to plant a forest on it."); return; }
      pushUndo();

      sel={type:"terrain",idx:P.terrain.length-1};
      panel(); render(); return;
    }
  }

  if(drag.kind==="img"){ bgImg.x=drag.x0+(p[0]-drag.start[0]); bgImg.y=drag.y0+(p[1]-drag.start[1]); render(); return; }
  if(drag.kind==="shape"){ drag.cur=q; drag.shift=ev.shiftKey; drag.alt=ev.altKey; render(); return; }
  if(drag.kind==="free"){
    if(!drag.free && dist(p,drag.raw[0])>4) drag.free=true;
    if(drag.free){
      const last=drag.raw[drag.raw.length-1];
      if(dist(p,last)>2.2){ drag.raw.push(p.slice()); render(); }
    }
    return;
  }
  if(drag.kind==="vx"){ const pts=selPts();
    if(pts&&pts[drag.i]){
      if(sel.type==="region") detachShape(sel.id);

      (drag.linked||[]).forEach(l=>{
        const c=P.cells[l.id];
        if(c&&c.pts[l.i]){ c.pts[l.i][0]=q[0]; c.pts[l.i][1]=q[1]; }
      });
      render();
    } return; }
  if(drag.kind==="anchor"){ const c=P.cells[sel.id]; if(c){ c.a=[q[0],q[1]]; render(); } return; }
  if(drag.kind==="wend"){ const w=P.walls[sel.idx]; if(w){ w[drag.i*2]=q[0]; w[drag.i*2+1]=q[1]; render(); } return; }
  if(drag.kind==="rend"){ const r=P.roads[sel.idx]; if(r&&r.p){ r.p[drag.i*2]=q[0]; r.p[drag.i*2+1]=q[1]; render(); } return; }
  if(drag.kind==="node"){ const r=byId(drag.id); if(r){ r.x=q[0]; r.y=q[1]; render(); } return; }
  if(drag.kind==="marquee"){ drag.cur=p.slice(); render(); return; }
  if(drag.kind==="label"){
    const L=P.labels[drag.idx]; if(!L) return;
    const dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
    if(!drag.moved && Math.hypot(dx,dy)<2) return;
    drag.moved=true;
    L.x=+(drag.x0+dx).toFixed(1); L.y=+(drag.y0+dy).toFixed(1);
    if(snap){ const s=snapPt([L.x,L.y]); L.x=s[0]; L.y=s[1]; }
    render(); return;
  }
  if(drag.kind==="region"){
    const dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
    if(!drag.moved && Math.hypot(dx,dy)<2) return;
    drag.moved=true;
    for(const id of drag.group){
      const orig=drag.origs[id], r=byId(id), c=P.cells[id];
      if(!orig||!r) continue;
      r.x=orig.x+dx; r.y=orig.y+dy;
      if(c){ c.pts=orig.pts.map(pt=>[pt[0]+dx,pt[1]+dy]);
             if(orig.a) c.a=[orig.a[0]+dx,orig.a[1]+dy];
             if(c.shape&&orig.shape){ c.shape.cx=orig.shape.cx+dx; c.shape.cy=orig.shape.cy+dy;
                          if(c.deco&&orig.deco) c.deco=orig.deco.map(pt=>[pt[0]+dx,pt[1]+dy]); } }

  }
});
function shapeBox(d){
  let [x0,y0]=d.start, [x1,y1]=d.cur;
  let cx,cy,rx,ry;
  if(d.alt){ cx=x0; cy=y0; rx=Math.abs(x1-x0); ry=Math.abs(y1-y0); }
  else { cx=(x0+x1)/2; cy=(y0+y1)/2; rx=Math.abs(x1-x0)/2; ry=Math.abs(y1-y0)/2; }
  if(d.shift){ const s=Math.max(rx,ry); rx=s; ry=s; }
  if(rx<3&&ry<3){ rx=lastSize?lastSize.rx:26; ry=lastSize?lastSize.ry:26; }  // plain click → default size
  return [cx,cy,Math.max(3,rx),Math.max(3,ry)];
}
svg.addEventListener("pointerup", ev=>{
  if(drag && drag.kind==="free"){
    const d=drag; drag=null;
    if(d.free && d.raw.length>3){
      const eps=Math.max(.7, vb.w/650);
      let pts=rdp(d.raw, eps);
      if(pts.length>2 && dist(pts[0],pts[pts.length-1])<eps*2) pts.pop();
      if(pts.length>2){ draft=pts; commitDraft(); return; }
    }
    // a plain click: add one polygon point, or close the shape
    const q=d.start;
    if(draft.length>2 && dist(q,draft[0])<handleSize()*2.4){ commitDraft(); return; }
    draft.push(q); render(); hint();
    return;
  }
  if(drag && drag.kind==="shape"){
    const [cx,cy,rx,ry]=shapeBox(drag);
    const s=makeShape(shapeOpts.kind,cx,cy,rx,ry);
    pendingMeta=shapeMeta(shapeOpts.kind,cx,cy,rx,ry);
    drag=null;
    openModal(regionModal(s.pts));
    return;
  }
  if(drag && drag.kind==="marquee"){
    const d=drag; drag=null;
    const x0=Math.min(d.start[0],d.cur[0]), x1=Math.max(d.start[0],d.cur[0]);
    const y0=Math.min(d.start[1],d.cur[1]), y1=Math.max(d.start[1],d.cur[1]);
    if(Math.abs(x1-x0)<3 && Math.abs(y1-y0)<3){ render(); return; }   // a plain click
    const hits=P.regions.filter(r=>{
      const b=regionBox(r.id);
      return b && b.cx>=x0 && b.cx<=x1 && b.cy>=y0 && b.cy<=y1;
    }).map(r=>r.id);
    const ids = d.add? [...new Set(d.keep.concat(hits))] : hits;
    setSelection(ids);
    panel(); render();
    if(ids.length) toast(ids.length+" region"+(ids.length>1?"s":"")+" selected.");
    return;
  }
  if(drag && drag.kind==="label"){
    if(!drag.moved && undoStack.length) undoStack.pop();
    drag=null; panel(); render(); return;
  }
  if(drag && drag.kind==="pan") svg.classList.remove("panning");
  if(drag && drag.kind==="region" && !drag.moved && undoStack.length) undoStack.pop(); // click, not move
  if(drag && ["vx","node","region","anchor"].includes(drag.kind)){ refreshBorders(); render(); }
  if(drag && (drag.kind==="node"||drag.kind==="region")) panel();
  drag=null;
});

function selPts(){
  if(!sel) return null;
  if(sel.type==="region"&&P.cells[sel.id]) return P.cells[sel.id].pts;
  if(sel.type==="land") return P.land[sel.ring];
  if(sel.type==="terrain"&&P.terrain[sel.idx]){
    const f=P.terrain[sel.idx];
    if(f.t==="lake") return f.pts;
    if(f.t==="river"&&f.free&&f.pts) return f.pts;   // A10 free rivers are vertex-editable
  }
  return null;
}

/* ---------------- A1: multi-selection ---------------- */
/* `sel` stays the primary/most-recent selection; `multi` holds the whole set so
   the two never disagree about what's highlighted. */
function selectedIds(){
  const out=[...multi];
  if(sel&&sel.type==="region"&&!multi.has(sel.id)) out.push(sel.id);
  return out.filter(id=>byId(id));
}
function selCount(){ return selectedIds().length; }
function setSelection(ids, primary){
  multi=new Set(ids);
  const p = primary || ids[ids.length-1] || null;
  sel = p? {type:"region", id:p} : null;
  if(p) multi.delete(p);
}
function toggleInSelection(id){
  if(sel&&sel.type==="region"&&sel.id===id){
    const rest=[...multi];
    multi.clear();
    sel = rest.length? {type:"region",id:rest.pop()} : null;
    multi=new Set(rest);
    return;
  }
  if(multi.has(id)) multi.delete(id);
  else { if(sel&&sel.type==="region") multi.add(sel.id); sel={type:"region",id}; }
}
function clearSelection(){ multi.clear(); sel=null; }
/* move a region and everything attached to it by (dx,dy) */
function moveRegionBy(id,dx,dy){
  const r=byId(id), c=P.cells[id];
  if(!r) return;
  r.x=+(r.x+dx).toFixed(2); r.y=+(r.y+dy).toFixed(2);
  if(!c) return;
  c.pts=c.pts.map(p=>[+(p[0]+dx).toFixed(2),+(p[1]+dy).toFixed(2)]);
  if(c.a) c.a=[+(c.a[0]+dx).toFixed(2),+(c.a[1]+dy).toFixed(2)];
  if(c.shape){ c.shape.cx+=dx; c.shape.cy+=dy; }
  if(c.deco) c.deco=c.deco.map(p=>[p[0]+dx,p[1]+dy]);
}
function nudgeSelection(dx,dy){
  const ids=selectedIds();
  if(ids.length){
    pushUndo();
    ids.forEach(id=>moveRegionBy(id,dx,dy));
    refreshBorders(); render(); panel();
    return true;
  }
  if(sel&&sel.type==="label"&&P.labels[sel.idx]){
    pushUndo();
    P.labels[sel.idx].x+=dx; P.labels[sel.idx].y+=dy; render(); panel(); return true;
  }
  const pts=selPts();
  if(pts){ pushUndo(); pts.forEach(p=>{p[0]+=dx;p[1]+=dy;}); refreshBorders(); render(); return true; }
  return false;
}
function regionBox(id){
  const c=P.cells[id], r=byId(id);
  if(c&&c.pts.length>2){
    const xs=c.pts.map(p=>p[0]), ys=c.pts.map(p=>p[1]);
    const x0=Math.min(...xs),y0=Math.min(...ys);
    return {x:x0,y:y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0,cx:(x0+Math.max(...xs))/2,cy:(y0+Math.max(...ys))/2};
  }
  return r? {x:r.x,y:r.y,w:0,h:0,cx:r.x,cy:r.y} : null;
}
function alignSelection(mode){
  const ids=selectedIds();
  if(ids.length<2){ toast("Select at least two regions to align."); return; }
  pushUndo();
  const boxes=ids.map(id=>({id,b:regionBox(id)})).filter(o=>o.b);
  const L=Math.min(...boxes.map(o=>o.b.x)), R=Math.max(...boxes.map(o=>o.b.x+o.b.w));
  const T=Math.min(...boxes.map(o=>o.b.y)), B=Math.max(...boxes.map(o=>o.b.y+o.b.h));
  const CX=(L+R)/2, CY=(T+B)/2;
  boxes.forEach(({id,b})=>{
    let dx=0,dy=0;
    if(mode==="left")   dx=L-b.x;
    if(mode==="right")  dx=R-(b.x+b.w);
    if(mode==="hcenter")dx=CX-b.cx;
    if(mode==="top")    dy=T-b.y;
    if(mode==="bottom") dy=B-(b.y+b.h);
    if(mode==="vcenter")dy=CY-b.cy;
    if(dx||dy) moveRegionBy(id,dx,dy);
  });
  refreshBorders(); render(); panel();
  toast("Aligned "+ids.length+" regions.");
}
function distributeSelection(axis){
  const ids=selectedIds();
  if(ids.length<3){ toast("Select at least three regions to distribute."); return; }
  pushUndo();
  const boxes=ids.map(id=>({id,b:regionBox(id)})).filter(o=>o.b)
    .sort((p,q)=>axis==="h"? p.b.cx-q.b.cx : p.b.cy-q.b.cy);
  const first=boxes[0].b, last=boxes[boxes.length-1].b;
  const span=(axis==="h"? last.cx-first.cx : last.cy-first.cy);
  const step=span/(boxes.length-1);
  boxes.forEach((o,i)=>{
    if(i===0||i===boxes.length-1) return;
    const want=(axis==="h"? first.cx : first.cy)+step*i;
    const have=(axis==="h"? o.b.cx : o.b.cy);
    if(axis==="h") moveRegionBy(o.id, want-have, 0); else moveRegionBy(o.id, 0, want-have);
  });
  refreshBorders(); render(); panel();
  toast("Distributed "+ids.length+" regions.");
}

function pasteClipboard(){

/* slug() consults P.regions; paste needs to also avoid ids it just minted */
function slugFor(name, taken){
  let s=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "region";
  const used=new Set(P.regions.map(r=>r.id).concat(Object.values(taken||{})));
  let id=s,n=2; while(used.has(id)) id=s+"_"+n++;
  return id;
}
function pickStyle(id){

/* ---------------- A2: shared-edge (topological) editing ----------------
   Regions still store independent rings — that's what the engine reads — but
   vertices that sit on top of each other are treated as one point, so dragging
   a border moves both sides and the hairline gap never comes back. */
function allCellVerts(){
  const out=[];
  for(const r of P.regions){
    const c=P.cells[r.id];
    if(!c||c.pts.length<3) continue;
    c.pts.forEach((p,i)=>out.push({id:r.id,i,p}));
  }
  return out;
}
/* every vertex within `tol` of (x,y) that belongs to a *different* region */
function coincidentVerts(x,y,tol,skipId,skipI){
  const out=[];
  for(const r of P.regions){
    const c=P.cells[r.id];
    if(!c||c.pts.length<3) continue;
    c.pts.forEach((p,i)=>{
      if(r.id===skipId && i===skipI) return;
      if(Math.abs(p[0]-x)<=tol && Math.abs(p[1]-y)<=tol && dist(p,[x,y])<=tol)
        out.push({id:r.id,i});
    });
  }
  return out;
}
/* snap near-coincident vertices across regions onto a shared position */
function weldVertices(tol, onlySelected){
  const verts=allCellVerts();
  if(!verts.length){ toast("Nothing to weld — draw some regions first."); return 0; }
  const pick = onlySelected? new Set(selectedIds()) : null;
  const grid=new Map(), key=(x,y)=>Math.floor(x/tol)+":"+Math.floor(y/tol);
  verts.forEach(v=>{
    const k=key(v.p[0],v.p[1]);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(v);
  });
  const seen=new Set(), clusters=[];
  verts.forEach(v=>{
    const vk=v.id+"#"+v.i;
    if(seen.has(vk)) return;
    const gx=Math.floor(v.p[0]/tol), gy=Math.floor(v.p[1]/tol), group=[];
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      const bucket=grid.get((gx+dx)+":"+(gy+dy));
      if(!bucket) continue;
      bucket.forEach(o=>{
        const ok=o.id+"#"+o.i;
        if(seen.has(ok)) return;
        if(dist(o.p,v.p)<=tol) group.push(o);
      });
    }
    group.forEach(o=>seen.add(o.id+"#"+o.i));
    if(group.length>1) clusters.push(group);
  });
  let moved=0, welded=0;
  clusters.forEach(group=>{
    const regions=new Set(group.map(o=>o.id));
    if(regions.size<2) return;                       // only weld across regions
    if(pick && ![...regions].some(id=>pick.has(id))) return;
    const cx=group.reduce((s,o)=>s+o.p[0],0)/group.length;
    const cy=group.reduce((s,o)=>s+o.p[1],0)/group.length;
    group.forEach(o=>{
      const pt=P.cells[o.id].pts[o.i];
      if(pt[0]!==cx||pt[1]!==cy) moved++;
      pt[0]=+cx.toFixed(2); pt[1]=+cy.toFixed(2);
    });
    welded++;
  });
  // welding invalidates any parametric shape it touched
  clusters.forEach(g=>new Set(g.map(o=>o.id)).forEach(id=>{ if(P.cells[id]&&P.cells[id].shape) detachShape(id); }));
  return {clusters:welded, points:moved};
}
/* C7 — confirm anything that destroys more than one thing, and always offer Undo */
function deleteSelection(){
  const ids=selectedIds();
  if(!ids.length) return;
  const go=()=>{
    pushUndo();
    ids.forEach(id=>{
      P.regions=P.regions.filter(r=>r.id!==id);
      delete P.cells[id];
      P.regions.forEach(o=>{ if(o.adj) o.adj=o.adj.filter(a=>a!==id); });
      P.roads=P.roads.filter(rd=>rd.a!==id&&rd.b!==id);
      P.terrain=P.terrain.filter(f=>f.at!==id && f.a!==id && f.b!==id)
        .map(f=>{ if(f.via) f.via=f.via.filter(a=>a!==id); return f; })
        .filter(f=>!f.via||f.via.length>1);
    });
    clearSelection(); panel(); render();
    toast("Deleted "+ids.length+" region"+(ids.length>1?"s":"")+".",{undo:true});
  };
  if(ids.length>1){
    confirmModal("Delete "+ids.length+" regions?",
      "Their outlines, adjacencies, roads and any terrain attached to them go too. This can be undone.",
      "Delete "+ids.length, go);
  } else go();
}
function setNationOnSelection(nat){
  const ids=selectedIds();
  if(!ids.length) return;
  pushUndo();
  ids.forEach(id=>{ byId(id).nation=nat||null; });
  panel(); render();
  toast((nat? (P.nations[nat].name||nat) : "No nation")+" applied to "+ids.length+
        " region"+(ids.length>1?"s":"")+".",{undo:true});
}
function setTerrOnSelection(t){
  const ids=selectedIds();
  if(!ids.length) return;
  pushUndo();
  ids.forEach(id=>{ const r=byId(id); if(t) r.terr=t; else delete r.terr; });
  panel(); render();
}
function selectByNation(nat){
  const ids=P.regions.filter(r=>(r.nation||"")===nat).map(r=>r.id);
  if(!ids.length){ toast("No regions in that nation."); return; }
  setSelection(ids); panel(); render();
  toast("Selected "+ids.length+" region"+(ids.length>1?"s":"")+".");
}
function linkAdj(a,b,on){
  const A=byId(a),B=byId(b); if(!A||!B) return;
  A.adj=A.adj||[]; B.adj=B.adj||[];
  if(on){ if(!A.adj.includes(b)) A.adj.push(b); if(!B.adj.includes(a)) B.adj.push(a); }
  else { A.adj=A.adj.filter(x=>x!==b); B.adj=B.adj.filter(x=>x!==a); }
}
function commitDraft(){
  const pts=draft.slice(); draft=[];
  if(pts.length < (tool==="riverfree"?2:3)){ render(); return; }
  if(tool==="landdraw"){
    pushUndo(); P.land.push(pts);
    sel={type:"land",ring:P.land.length-1};
    setTool("landedit"); panel(); render();
    toast("Landmass ring added — drag its vertices to refine.");
    return;
  }
  if(tool==="lake"){
    pushUndo(); P.terrain.push({t:"lake",pts});
    sel={type:"terrain",idx:P.terrain.length-1};
    panel(); render(); toast("Lake added. (Editor/SVG feature — the WotR engine ignores lakes.)");
    return;
  }
  if(tool==="riverfree"){   // A10 — a river that meanders on its own points
    pushUndo(); P.terrain.push({t:"river",free:true,pts,w:2.4});
    sel={type:"terrain",idx:P.terrain.length-1};
    panel(); render();
    toast("Free river added — drag its vertices to meander it. It ignores region nodes.");
    return;
  }
  // region
  openModal(regionModal(pts));
}
function commitSeq(){
  if(seq.length<2){ seq=[]; render(); return; }
  pushUndo();
  if(tool==="ridge") P.terrain.push({t:"ridge",via:seq.slice(),s:.8});
  else P.terrain.push({t:"river",via:seq.slice(),w:2.2});
  sel={type:"terrain",idx:P.terrain.length-1};
  seq=[]; panel(); render();
  toast((tool==="ridge"?"Mountain ridge":"River")+" added along "+P.terrain[P.terrain.length-1].via.length+" regions.");
}

function buildTools(){
  const host=$("#tools"); host.innerHTML="";
  for(const t of TOOLS){
    if(t[0]==="#"){
      const h=document.createElement("div"); h.className="tool-group"; h.textContent=t[1];
      host.appendChild(h); continue;
    }
    if(t[0]==="-"){ host.appendChild(Object.assign(document.createElement("div"),{className:"tool-sep"})); continue; }
    const b=document.createElement("button");
    b.className="tool"+(tool===t[0]?" on":""); b.dataset.tool=t[0];
    b.setAttribute("aria-label",t[2]);
    b.innerHTML=`<span>${t[1]}</span><span class="key">${t[3]}</span><span class="tip">${t[2]}</span>`;
    b.onclick=()=>setTool(t[0]);
    host.appendChild(b);
  }
}
function setTool(t){
  tool=t; draft=[]; seq=[]; roadFrom=null; adjFrom=null;
  svg.className.baseVal="tool-"+t;
  buildTools(); render(); hint();
}

/* section open/closed state survives re-renders, which happen constantly (C5) */
const secOpen={};
function mkSec(title, open){
  const base=title.split(" (")[0].split(" —")[0];
  const isOpen = (base in secOpen)? secOpen[base] : open;
  const d=document.createElement("div"); d.className="sec"+(isOpen?"":" closed");
  d.dataset.sec=base;
  d.innerHTML=`<h3>${title}</h3><div class="body"></div>`;
  d.querySelector("h3").onclick=()=>{
    d.classList.toggle("closed");
    secOpen[base]=!d.classList.contains("closed");
  };
  return d;
}
function openSection(base){
  secOpen[base]=true;
  panel();
  const node=$(`#panel .sec[data-sec="${base}"]`);
  if(node) node.scrollIntoView({block:"nearest"});
}
function row(label, ctrl){
  const r=document.createElement("div"); r.className="row";
  const l=document.createElement("label"); l.textContent=label; r.appendChild(l);
  r.appendChild(ctrl); return r;
}
let sliderSeq=0;
function inp(type,val,cb,attrs){
  const i=document.createElement("input"); i.type=type; if(val!==undefined) i.value=val;
  const undoLabel=(attrs&&attrs.undo)||null;
  for(const k in attrs||{}) if(k!=="undo") i.setAttribute(k,attrs[k]);
  if(type==="range"){
    /* C3 — a slider drag fires dozens of input events; coalesce them into a
       single undo step taken at the start of the gesture, and close the
       gesture on release so the next drag is its own step. */
    const key="slider"+(++sliderSeq);
    i.addEventListener("input",()=>{
      pushUndo(undoLabel||"adjust value",{coalesce:key});
      cb(i.value,i);
    });
    const done=()=>endCoalesce();
    i.addEventListener("change",done);
    i.addEventListener("pointerup",done);
    i.addEventListener("blur",done);
  } else {
    i.addEventListener("change",()=>cb(i.value,i));
  }
  return i;
}
function selInp(opts,val,cb){
  const s=document.createElement("select");
  for(const [v,l] of opts){ const o=document.createElement("option"); o.value=v; o.textContent=l; if(v===String(val))o.selected=true; s.appendChild(o); }
  s.onchange=()=>cb(s.value); return s;
}
function btn(label,cb,cls){
  const b=document.createElement("button"); b.className="small-btn"+(cls?" "+cls:""); b.textContent=label; b.onclick=cb; return b;
}

/* ---------- A1: bulk operations on a multi-selection ---------- */
function secBulkBody(b){
  const ids=selectedIds(), n=ids.length;
  const head=document.createElement("div"); head.className="mini";
  head.innerHTML=`<b style="color:var(--gold)">${n} regions selected.</b> Edits below apply to all of them.`;
  b.appendChild(head);
  const natOpts=[["","— none —"]].concat(Object.keys(P.nations).map(k=>[k,P.nations[k].name||k]));
  b.appendChild(row("Nation", selInp(natOpts,"",v=>setNationOnSelection(v))));
  b.appendChild(row("Terrain", selInp(Object.entries(TERR_TYPES).map(([k,v])=>[k,v.name]),"",
    v=>setTerrOnSelection(v))));
  b.appendChild(row("Settlement", selInp([["","— leave —"]].concat(Object.entries(SETTLE)),"",v=>{
    pushUndo(); ids.forEach(id=>{ byId(id).settle=v||null; }); panel(); render();
  })));
  const cw=document.createElement("div"); cw.style.display="flex"; cw.style.gap="6px"; cw.style.flex="1";
  cw.appendChild(inp("color","#888888",v=>{ pushUndo(); ids.forEach(id=>{byId(id).color=v;}); render(); }));
  cw.appendChild(btn("clear",()=>{ pushUndo(); ids.forEach(id=>{delete byId(id).color;}); render(); }));
  b.appendChild(row("Colour", cw));

  const nudge=document.createElement("div"); nudge.className="mini"; nudge.style.marginTop="8px";
  nudge.textContent="Nudge with the arrow keys — hold Shift for ×10.";
  b.appendChild(nudge);

  const al=document.createElement("div"); al.className="btnrow";
  [["⇤","left","Align left"],["⇔","hcenter","Align centres horizontally"],["⇥","right","Align right"],
   ["⤒","top","Align top"],["⇕","vcenter","Align centres vertically"],["⤓","bottom","Align bottom"]]
   .forEach(([g,mode,title])=>{ const x=btn(g,()=>alignSelection(mode)); x.title=title; al.appendChild(x); });
  b.appendChild(al);
  const ds=document.createElement("div"); ds.className="btnrow";
  ds.appendChild(btn("Distribute across",()=>distributeSelection("h")));
  ds.appendChild(btn("Distribute down",()=>distributeSelection("v")));
  b.appendChild(ds);

  const ops=document.createElement("div"); ops.className="btnrow";
  ops.appendChild(btn("Copy",copySelection));
  ops.appendChild(btn("Duplicate",()=>{ copySelection(); pasteClipboard(); }));
  ops.appendChild(btn("Link all as adjacent",()=>{
    pushUndo(); let k=0;
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
      if(!(byId(ids[i]).adj||[]).includes(ids[j])) k++;
      linkAdj(ids[i],ids[j],true);
    }
    panel(); render(); toast("Added "+k+" adjacencies.",{undo:true});
  }));
  b.appendChild(ops);
  const ops2=document.createElement("div"); ops2.className="btnrow";
  if(styleClip) ops2.appendChild(btn("Paste style",()=>applyStyle(ids)));
  ops2.appendChild(btn("Weld outlines",()=>{
    const r=weldVertices(Math.max(2,handleSize()*1.4), true);
    if(r&&r.clusters){ refreshBorders(); render(); panel();
      toast("Welded "+r.points+" vertices into "+r.clusters+" shared corners.",{undo:true}); }
    else toast("No near-coincident vertices found in the selection.");
  }));
  ops2.appendChild(btn("Delete "+n,()=>deleteSelection(),"danger"));
  b.appendChild(ops2);
  const clr=document.createElement("div"); clr.className="btnrow";
  clr.appendChild(btn("Deselect all",()=>{ clearSelection(); panel(); render(); }));
  b.appendChild(clr);
}

      pb.appendChild(btn("Smooth",()=>{ pushUndo(); detachShape(r.id); c.pts=chaikin(c.pts); refreshBorders(); panel(); render(); }));

function colName(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-1-m)/26; } return s; }
function generateGrid(st){
  pushUndo();
  const R=st.size/2, g=st.gap, ids=[];
  const put=(c,r,cx,cy,rx,ry)=>{
    const name=colName(c)+(r+1);
    let id=(st.prefix||"")+name.toLowerCase();
    let n=2, base=id; while(P.regions.some(x=>x.id===id)) id=base+"_"+n++;
    P.regions.push({id,name,nation:null,settle:null,x:+cx.toFixed(1),y:+cy.toFixed(1),adj:[],start:null});
    const meta=shapeMeta(st.kind,cx,cy,rx,ry,{rotd:0});
    P.cells[id]={pts:[],a:[cx,cy],r:10,shape:meta};
    rebuildShape(P.cells[id]);
    P.cells[id].r=+inradius(P.cells[id].pts,P.cells[id].a).toFixed(1);
    ids[r*st.cols+c]=id;
  };
  if(st.kind==="hexP"){
    const cw=Math.sqrt(3)*R+g, ch=1.5*R+g;
    for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++)
      put(c,r, st.x+c*cw+(r%2?cw/2:0), st.y+r*ch, R, R);
    if(st.link) for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++){
      const me=ids[r*st.cols+c], odd=r%2;
      const nb=[[c-1,r],[c+1,r],[c-(odd?0:1),r-1],[c+(odd?1:0),r-1],[c-(odd?0:1),r+1],[c+(odd?1:0),r+1]];
      for(const [nc,nr] of nb) if(nc>=0&&nc<st.cols&&nr>=0&&nr<st.rows) linkAdj(me, ids[nr*st.cols+nc], true);
    }
  } else if(st.kind==="hexF"){
    const cw=1.5*R+g, ch=Math.sqrt(3)*R+g;
    for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++)
      put(c,r, st.x+c*cw, st.y+r*ch+(c%2?ch/2:0), R, R);
    if(st.link) for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++){
      const me=ids[r*st.cols+c], odd=c%2;
      const nb=[[c,r-1],[c,r+1],[c-1,r-(odd?0:1)],[c-1,r+(odd?1:0)],[c+1,r-(odd?0:1)],[c+1,r+(odd?1:0)]];
      for(const [nc,nr] of nb) if(nc>=0&&nc<st.cols&&nr>=0&&nr<st.rows) linkAdj(me, ids[nr*st.cols+nc], true);
    }
  } else {
    const pitch=st.size+g;
    for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++)
      put(c,r, st.x+c*pitch+R, st.y+r*pitch+R, R, R);
    if(st.link) for(let r=0;r<st.rows;r++) for(let c=0;c<st.cols;c++){
      const me=ids[r*st.cols+c];

        if(nc>=0&&nc<st.cols&&nr>=0&&nr<st.rows) linkAdj(me, ids[nr*st.cols+nc], true);
    }
  }
  sel=null; panel(); render();
  toast("Generated "+(st.cols*st.rows)+" tiles"+(st.link?" with adjacency":"")+".");

function pointInPoly(p,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if(((yi>p[1])!==(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }

function generateCoastline(opt){

      if(x<b.x0||x>b.x1||y<b.y0||y>b.y1) continue;
      if(pointInPoly([x,y], b.c.pts)) return true;
      if(polyDist([x,y], b.c.pts)<=opt.offset) return true;
    }
    return false;
  };
  const field=new Uint8Array(W*H);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++)
    field[j*W+i]= isLand(X0+i*step, Y0+j*step)?1:0;
  const IN=(i,j)=> (i<0||j<0||i>=W||j>=H)?0:field[j*W+i];
  // boundary edges, wound so each closed loop keeps land on one side
  const edges=new Map(), key=(i,j)=>i+","+j;
  const add=(a,b)=>{ const k=key(a[0],a[1]); if(!edges.has(k)) edges.set(k,[]); edges.get(k).push(b); };
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    if(!IN(i,j)) continue;
    if(!IN(i,j-1)) add([i,j],[i+1,j]);
    if(!IN(i+1,j)) add([i+1,j],[i+1,j+1]);
    if(!IN(i,j+1)) add([i+1,j+1],[i,j+1]);
    if(!IN(i-1,j)) add([i,j+1],[i,j]);
  }
  // chain the edges into closed rings
  const rings=[];
  while(edges.size){
    const startK=edges.keys().next().value;
    let cur=startK.split(",").map(Number);
    const ring=[];
    let guard=0;
    while(guard++ < W*H*4){
      const k=key(cur[0],cur[1]);
      const outs=edges.get(k);
      if(!outs||!outs.length){ edges.delete(k); break; }
      const nxt=outs.pop();
      if(!outs.length) edges.delete(k);
      ring.push(cur);
      cur=nxt;
      if(key(cur[0],cur[1])===startK){ break; }
    }
    if(ring.length>7) rings.push(ring);
  }
  if(!rings.length){ toast("Couldn't trace a coastline — try a larger offset."); return 0; }
  const out=rings.map(ring=>{
    let pts=ring.map(([i,j])=>[X0+i*step, Y0+j*step]);
    pts=simplifyRing(pts, step*0.62);
    for(let k=0;k<opt.smooth;k++) pts=chaikin(pts);
    if(pts.length>240) pts=simplifyRing(pts, 1.1);
    return pts.map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]);
  }).filter(pts=>{
    // drop specks: keep rings with a meaningful area
    let a=0;
    for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; a+=x1*y2-x2*y1; }
    return Math.abs(a/2) > (step*step*12);
  });
  if(!out.length){ toast("Couldn't trace a coastline — try a larger offset."); return 0; }
  pushUndo();
  if(opt.replace) P.land=out; else P.land=P.land.concat(out);
  sel=null; multi.clear(); panel(); render();
  return out.length;
}
function autoLink(tol){
  pushUndo();
  let n=0;
  const R=P.regions.filter(r=>P.cells[r.id]&&P.cells[r.id].pts.length>2);
  const near=(A,B)=>{
    for(const p of A) for(let i=0;i<B.length;i++)
      if(ptSegDist(p,B[i],B[(i+1)%B.length])<=tol) return true;
    return false;
  };
  for(let i=0;i<R.length;i++) for(let j=i+1;j<R.length;j++){
    const a=P.cells[R[i].id], b=P.cells[R[j].id];
    if(dist(a.a||[R[i].x,R[i].y], b.a||[R[j].x,R[j].y]) > (a.r+b.r)*3+tol+60) continue;
    if(near(a.pts,b.pts)||near(b.pts,a.pts)){
      if(!(R[i].adj||[]).includes(R[j].id)) n++;
      linkAdj(R[i].id,R[j].id,true);
    }
  }
  panel(); render();
  toast("Auto-link added "+n+" adjacencies (tolerance "+tol+").");
}

function toHex(c){
  if(/^#/.test(c)) return c.length===4? "#"+[...c.slice(1)].map(x=>x+x).join("") : c;

  return "#"+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,"0")).join("");
}

function renameRegion(oldId,newIdRaw){
  const newId=newIdRaw.toLowerCase().replace(/[^a-z0-9_]+/g,"_");
  if(!newId||newId===oldId) { panel(); return; }
  if(P.regions.some(r=>r.id===newId)){ toast("ID already in use."); panel(); return; }
  pushUndo();
  const r=byId(oldId); r.id=newId;
  if(P.cells[oldId]){ P.cells[newId]=P.cells[oldId]; delete P.cells[oldId]; }
  P.regions.forEach(o=>{ if(o.adj) o.adj=o.adj.map(a=>a===oldId?newId:a); });
  P.roads.forEach(rd=>{ if(rd.a===oldId)rd.a=newId; if(rd.b===oldId)rd.b=newId; });
  P.terrain.forEach(f=>{ if(f.at===oldId)f.at=newId; if(f.via)f.via=f.via.map(a=>a===oldId?newId:a); });
  sel={type:"region",id:newId};
  panel(); render();
}
function deleteRegion(id){
  P.regions=P.regions.filter(r=>r.id!==id);
  delete P.cells[id];
  P.regions.forEach(o=>{ if(o.adj)o.adj=o.adj.filter(a=>a!==id); });
  P.roads=P.roads.filter(rd=>rd.a!==id&&rd.b!==id);
  P.terrain=P.terrain.filter(f=>f.at!==id).map(f=>{ if(f.via)f.via=f.via.filter(a=>a!==id); return f; })
    .filter(f=>!f.via||f.via.length>1||f.t==="lake");
  sel=null; panel(); render();
}
function fitView(){
  let xs=[],ys=[];
  P.land.flat().forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  Object.values(P.cells).forEach(c=>c.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  P.regions.forEach(r=>{xs.push(r.x);ys.push(r.y);});
  if(!xs.length){ vb={x:0,y:0,w:P.w,h:P.h}; render(); return; }
  const x0=Math.min(...xs)-30,y0=Math.min(...ys)-30,x1=Math.max(...xs)+30,y1=Math.max(...ys)+30;
  vb={x:x0,y:y0,w:x1-x0,h:y1-y0}; render();
}

/* ---------------- A7: validation ----------------
   The same instincts that were buried in serializeGEO's `suspect` list, but
   surfaced where you can actually act on them. */
function findProblems(){
  const out=[];
  const focusRegion=id=>()=>{ setSelection([id]); const b=regionBox(id);
    if(b) zoomTo({x:b.x,y:b.y,w:b.w||40,h:b.h||40}, 90); panel(); render(); };
  // no polygon
  P.regions.filter(r=>!P.cells[r.id]||P.cells[r.id].pts.length<3).forEach(r=>{
    out.push({sev:"warn",msg:r.name+" has no outline",
      sub:"It still works as a tap-node if it has a tap radius.",focus:focusRegion(r.id)});
  });
  // orphans in the movement graph
  P.regions.filter(r=>!(r.adj||[]).length).forEach(r=>{
    out.push({sev:"err",msg:r.name+" has no adjacencies",
      sub:"Nothing can move in or out of it.",focus:focusRegion(r.id)});
  });
  // dangling adjacency / road / terrain references
  P.regions.forEach(r=>(r.adj||[]).forEach(a=>{
    if(!byId(a)) out.push({sev:"err",msg:r.name+" links to a missing region",
      sub:"Adjacency points at “"+a+"”, which no longer exists.",focus:focusRegion(r.id)});
  }));
  P.terrain.forEach((f,i)=>{
    const refs=f.t==="border"? [f.a,f.b] : (f.via||(f.at?[f.at]:[]));
    const bad=refs.filter(id=>id&&!byId(id));
    if(bad.length) out.push({sev:"err",msg:"Terrain feature references a missing region",
      sub:"“"+bad.join(", ")+"” is gone — the feature will not draw.",
      focus:()=>{ sel={type:"terrain",idx:i}; multi.clear(); panel(); render(); }});
  });
  // duplicate names (ids are already unique by construction)
  const byName={};
  P.regions.forEach(r=>{ (byName[r.name]=byName[r.name]||[]).push(r); });
  Object.keys(byName).filter(n=>byName[n].length>1).forEach(n=>{
    out.push({sev:"warn",msg:"“"+n+"” is used by "+byName[n].length+" regions",
      sub:"Duplicate names make labels and lists ambiguous.",focus:focusRegion(byName[n][0].id)});
  });
  // overlapping outlines
  const withPts=P.regions.filter(r=>P.cells[r.id]&&P.cells[r.id].pts.length>2);
  for(let i=0;i<withPts.length;i++) for(let j=i+1;j<withPts.length;j++){
    const A=P.cells[withPts[i].id], B=P.cells[withPts[j].id];
    const aA=A.a||centroid(A.pts), aB=B.a||centroid(B.pts);
    if(dist(aA,aB) > (A.r+B.r)*3+140) continue;
    if(pointInPoly(aA,B.pts)||pointInPoly(aB,A.pts)){
      out.push({sev:"warn",msg:withPts[i].name+" overlaps "+withPts[j].name,
        sub:"One region's centre sits inside the other.",focus:focusRegion(withPts[i].id)});
    }
  }
  // adjacent on paper but visibly apart
  const seenPair=new Set();
  P.regions.forEach(r=>(r.adj||[]).forEach(b=>{
    const k=[r.id,b].sort().join("|"); if(seenPair.has(k)) return; seenPair.add(k);
    const A=P.cells[r.id], B=P.cells[b];
    if(!A||!B||A.pts.length<3||B.pts.length<3) return;
    let gap=Infinity;
    for(const p of A.pts){ const d=polyDist(p,B.pts); if(d<gap) gap=d; }
    if(gap>14) out.push({sev:"warn",msg:r.name+" and "+(byId(b)?byId(b).name:b)+" are linked but "+Math.round(gap)+" apart",
      sub:"Players won't read them as neighbours. Weld or move them together.",focus:focusRegion(r.id)});
  }));
  // unreachable clusters in the movement graph
  if(P.regions.length>1){
    const seen=new Set(); let comps=[];
    for(const r of P.regions){
      if(seen.has(r.id)) continue;
      const stack=[r.id], comp=[];
      seen.add(r.id);
      while(stack.length){
        const id=stack.pop(); comp.push(id);
        (byId(id)?.adj||[]).forEach(n=>{ if(byId(n)&&!seen.has(n)){ seen.add(n); stack.push(n); } });
      }
      comps.push(comp);
    }
    if(comps.length>1){
      comps.sort((a,b)=>b.length-a.length);
      comps.slice(1).forEach(c=>{
        const nm=byId(c[0])?byId(c[0]).name:c[0];
        out.push({sev:"err",msg:"Island of "+c.length+" region"+(c.length>1?"s":"")+" (from "+nm+")",
          sub:"Cut off from the main board — nothing can reach it.",focus:focusRegion(c[0])});
      });
    }
  }
  // suspiciously long road links
  P.roads.forEach((rd,i)=>{
    const g = rd.p&&rd.p.length===4 ? Math.hypot(rd.p[2]-rd.p[0],rd.p[3]-rd.p[1]) : (rd.gap||0);
    if(g>60) out.push({sev:"warn",msg:"Very long road: "+(byId(rd.a)?byId(rd.a).name:rd.a)+" ↔ "+(byId(rd.b)?byId(rd.b).name:rd.b),
      sub:Math.round(g)+" units — usually a mis-drawn link.",
      focus:()=>{ sel={type:"road",idx:i}; multi.clear(); panel(); render(); }});
  });
  // empty labels
  (P.labels||[]).forEach((L,i)=>{ if(!String(L.text||"").trim())
    out.push({sev:"warn",msg:"An empty map label",sub:"It renders as nothing.",
      focus:()=>{ sel={type:"label",idx:i}; multi.clear(); panel(); render(); }}); });
  return out;
}

function regionModal(pts){
  const d=document.createElement("div");
  d.innerHTML=`<h2>${pendingShapeFor? "Attach shape" : "New region"}</h2>`;
  if(pendingShapeFor){
    const id=pendingShapeFor; pendingShapeFor=null;
    const r=byId(id), c={pts, a:centroid(pts)};
    c.r=+inradius(pts,c.a).toFixed(1);
    pushUndo(); P.cells[id]=c;
    if(!r.x||!r.y){ r.x=c.a[0]; r.y=c.a[1]; }
    sel={type:"region",id}; setTool("select"); panel(); render(); closeModal();
    return d;
  }
  const nameI=inp("text","",()=>{},{placeholder:"e.g. Weather Hills"});
  const natS=selInp([["","— none —"]].concat(Object.keys(P.nations).map(k=>[k,P.nations[k].name||k])),"",()=>{});
  const setS=selInp(Object.entries(SETTLE),"",()=>{});
  d.appendChild(row("Name",nameI));
  d.appendChild(row("Nation",natS));
  d.appendChild(row("Settlement",setS));

  foot.appendChild(btn("Cancel",()=>{closeModal(); render();}));
  const ok=btn("Create region",()=>{
    const name=nameI.value.trim()||("Region "+(P.regions.length+1));
    pushUndo();
    const a=centroid(pts);
    const id=slug(name);
    const r={id,name,nation:natS.value||null,settle:setS.value||null,
      x:+a[0].toFixed(1),y:+a[1].toFixed(1),adj:[],start:null};
    P.regions.push(r);
    P.cells[id]={pts, a:[+a[0].toFixed(1),+a[1].toFixed(1)], r:+inradius(pts,a).toFixed(1)};
    if(pendingMeta){ P.cells[id].shape=pendingMeta; rebuildShape(P.cells[id]);
      r.x=pendingMeta.cx; r.y=pendingMeta.cy; pendingMeta=null; }
    sel={type:"region",id};
    closeModal(); panel(); render();
    toast("Region created — link its neighbours with the adjacency tool (A), or use Auto-link in the Map section.");
  },"gold"); ok.classList.add("small-btn");
  foot.appendChild(ok);
  d.appendChild(foot);

  nameI.addEventListener("keydown",e=>{ if(e.key==="Enter") ok.click(); });

/* Toasts live in their own stack above the canvas so they never clobber the
   status-bar hint you may still be reading mid-drawing (C2/C7). */
function toast(msg, opts){
  opts=opts||{};
  const host=$("#toasts");
  const t=document.createElement("div"); t.className="toast";
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  let timer=null;
  const kill=()=>{ clearTimeout(timer); t.remove(); };
  if(opts.undo){
    const b=document.createElement("button"); b.className="act"; b.textContent="Undo";
    b.onclick=()=>{ doUndo(); kill(); };
    t.appendChild(b);
  }
  if(opts.action){
    const b=document.createElement("button"); b.className="act"; b.textContent=opts.action;
    b.onclick=()=>{ opts.onAction&&opts.onAction(); kill(); };
    t.appendChild(b);
  }
  host.appendChild(t);
  while(host.children.length>3) host.firstChild.remove();
  timer=setTimeout(kill, opts.ms||(opts.undo||opts.action?7000:4200));
  return t;
}
/* C7 — one confirm path for every destructive action */
function confirmModal(title, msg, okLabel, cb){
  const d=document.createElement("div");
  d.innerHTML=`<h2>${title}</h2><p>${msg}</p>`;
  const foot=document.createElement("div"); foot.className="foot";
  foot.appendChild(btn("Cancel",closeModal));
  const ok=btn(okLabel||"Delete",()=>{ closeModal(); cb(); },"danger");
  foot.appendChild(ok);
  d.appendChild(foot);
  openModal(d);
  setTimeout(()=>ok.focus(),50);
}

/* ---------------- keyboard ---------------- */
window.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT"||ev.target.tagName==="SELECT"||ev.target.tagName==="TEXTAREA") return;
  if(ev.code==="Space"){ spaceDown=true; svg.classList.add("tool-pan"); ev.preventDefault(); return; }
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod&&ev.key.toLowerCase()==="z"){ ev.shiftKey?doRedo():doUndo(); ev.preventDefault(); return; }
  if(mod&&ev.key.toLowerCase()==="y"){ doRedo(); ev.preventDefault(); return; }
  if(!P) return;
  // A3 — clipboard
  if(mod&&ev.key.toLowerCase()==="c"){ copySelection(); ev.preventDefault(); return; }
  if(mod&&ev.key.toLowerCase()==="v"){ pasteClipboard(); ev.preventDefault(); return; }
  if(mod&&ev.key.toLowerCase()==="d"){ copySelection(); pasteClipboard(); ev.preventDefault(); return; }
  if(mod&&ev.key.toLowerCase()==="a"){
    setSelection(P.regions.map(r=>r.id)); panel(); render();
    toast(P.regions.length+" regions selected."); ev.preventDefault(); return;
  }
  // A1 — arrow-key nudge, Shift for x10
  if(ev.key.startsWith("Arrow")){
    const step=(ev.shiftKey?10:1)*(snap? Math.max(1,snap/5) : 1);
    const d={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[ev.key];
    if(d && nudgeSelection(d[0],d[1])){ endCoalesce(); ev.preventDefault(); }
    return;
  }
  // C6 — viewport shortcuts
  if(ev.key==="f"||ev.key==="F"){ zoomToSelection(); return; }
  if(ev.key==="0"){ zoom100(); return; }
  if(ev.key==="1"){ fitView(); return; }
  const k=ev.key.toLowerCase();
  const map={v:"select",h:"pan",s:"shape",d:"draw",p:"points",b:"border",l:"landdraw",
             e:"landedit",w:"wall",r:"road",a:"adj",m:"ridge",t:"forest",n:"river",
             k:"lake",x:"text",i:"eyedrop",j:"riverfree"};
  if(map[k]&&!mod){ setTool(map[k]); return; }
  if(ev.key==="Escape"){
    draft=[]; seq=[]; roadFrom=null; adjFrom=null; pendingShapeFor=null;
    closeModal(); closeCtx(); render(); hint(); return;
  }
  if(ev.key==="Enter"){ if(draft.length > (tool==="riverfree"?1:2)) commitDraft(); else if(seq.length>1) commitSeq(); return; }
  if(ev.key==="Delete"||ev.key==="Backspace"){
    if(selCount()>0){ deleteSelection(); ev.preventDefault(); return; }
    if(!sel) return;
    pushUndo("delete");
    if(sel.type==="wall"){ P.walls.splice(sel.idx,1); sel=null; }
    else if(sel.type==="road"){ P.roads.splice(sel.idx,1); sel=null; }
    else if(sel.type==="label"){ P.labels.splice(sel.idx,1); sel=null; }
    else if(sel.type==="terrain"){
      const f=P.terrain[sel.idx];
      if(f&&f.t==="border"&&f.block) linkAdj(f.a,f.b,true);
      P.terrain.splice(sel.idx,1); sel=null;
    }
    else if(sel.type==="land"){ P.land.splice(sel.ring,1); sel=null; }
    panel(); render();
    toast("Deleted.",{undo:true});
  }
});

/* ---------------- C6: pinch-zoom & two-finger pan ---------------- */
const touches=new Map();
let pinch=null;
svg.addEventListener("pointerdown",ev=>{
  if(ev.pointerType!=="touch") return;
  touches.set(ev.pointerId,[ev.clientX,ev.clientY]);
  if(touches.size===2){
    drag=null;                       // a second finger cancels any 1-finger drag
    const [a,b]=[...touches.values()];
    pinch={ d0:Math.hypot(a[0]-b[0],a[1]-b[1]),
            c0:[(a[0]+b[0])/2,(a[1]+b[1])/2],
            vb0:Object.assign({},vb) };
  }
},true);
svg.addEventListener("pointermove",ev=>{
  if(ev.pointerType!=="touch"||!touches.has(ev.pointerId)) return;
  touches.set(ev.pointerId,[ev.clientX,ev.clientY]);
  if(touches.size!==2||!pinch) return;
  ev.preventDefault();
  const [a,b]=[...touches.values()];
  const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  const c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const rect=svg.getBoundingClientRect();
  const k=Math.max(.08, Math.min(12, pinch.d0/Math.max(1,d)));
  const nw=Math.max(40, Math.min(8000, pinch.vb0.w*k));
  const scale=nw/pinch.vb0.w;
  // keep the point under the pinch centre pinned while scaling and panning
  const fx=(pinch.c0[0]-rect.left)/rect.width, fy=(pinch.c0[1]-rect.top)/rect.height;
  const wx=pinch.vb0.x+fx*pinch.vb0.w, wy=pinch.vb0.y+fy*pinch.vb0.h;
  const nh=pinch.vb0.h*scale;
  vb.w=nw; vb.h=nh;
  vb.x=wx-fx*nw-((c[0]-pinch.c0[0])/rect.width)*nw;
  vb.y=wy-fy*nh-((c[1]-pinch.c0[1])/rect.height)*nh;
  render();
},{capture:true,passive:false});
function endTouch(ev){
  if(ev.pointerType!=="touch") return;
  touches.delete(ev.pointerId);
  if(touches.size<2) pinch=null;
}
svg.addEventListener("pointerup",endTouch,true);
svg.addEventListener("pointercancel",endTouch,true);

/* =========================================================================
   MAP FORGE — EXTENSIONS  (feature-review items 1–15)
   -------------------------------------------------------------------------
   Everything below layers on top of the editor above by wrapping its
   functions rather than editing them, so the original code paths stay
   intact and readable. Load order matters: this block must come last.

    1  Playtest sandbox            9  Vector-page PDF + tiled poster
    2  Custom region attributes   10  Start / deployment zones
    3  Balance analytics          11  Theme editor
    4  Auto-generated legend      12  Incremental render + spatial index
    5  Voronoi region generator   13  Symmetry & mirror tools
    6  Map furniture              14  Layers, groups & isolation
    7  Auto-trace bitmap          15  Typography: fonts + text-on-path
    8  Icon library & scatter
   ========================================================================= */
const MFX = {};

/* ---------------- 12a: schema version & migration ---------------- */
const MF_VERSION = 4;
MFX.ensure = function(){
  if(!P) return;
  if(P.version === MF_VERSION) return;
  P.version       = MF_VERSION;
  P.schema        = P.schema        || [];
  P.layers        = P.layers        || [{id:"base", name:"Base", visible:true, locked:false, opacity:1}];
  P.tokens        = P.tokens        || [];
  P.stamps        = P.stamps        || [];
  P.icons         = P.icons         || {};
  P.fonts         = P.fonts         || {};
  P.customThemes  = P.customThemes  || {};
  P.mapScale      = P.mapScale      || {per:10, unit:"km"};
  P.legend        = P.legend        || {show:false, x:40, y:40, w:190, title:"Key",
                                        cols:1, size:11, frame:true, hide:{}};
  P.furniture     = P.furniture     || {
    compass:   {show:false, x:0, y:0, size:52, style:"star", rot:0},
    scalebar:  {show:false, x:0, y:0, len:200, style:"stepped"},
    frame:     {show:false, style:"double", inset:14},
    cartouche: {show:false, x:0, y:0, w:230, title:"", sub:"", style:"ribbon"}
  };
  for(const k in P.customThemes) if(!THEMES[k]) THEMES[k]=P.customThemes[k];
  P.regions.forEach(r=>{ if(!r.attrs) r.attrs={}; if(!r.layer) r.layer="base"; });
};
MFX.layer = function(id){ return (P.layers||[]).find(l=>l.id===(id||"base")) || P.layers[0]; };
MFX.layerVisible = function(id){
  const l=MFX.layer(id); if(!l||!l.visible) return false;
  if(MFX.isolate && (id||"base")!==MFX.isolate) return false;
  return true;
};
MFX.layerOpacity = function(id){
  const l=MFX.layer(id); if(!l) return 1;
  if(MFX.isolate && (id||"base")!==MFX.isolate) return 0.12;
  return l.opacity===undefined?1:l.opacity;
};
MFX.isolate = null;

/* ---------------- 12b: render coalescing ----------------
   The original render() rebuilt the whole SVG tree synchronously, and
   pointermove called it on every event — dozens of full rebuilds per
   second during a drag. Coalescing into one rebuild per animation frame
   is the single largest performance win available, and it is invisible
   to every existing call site. */
const _mfRender = render;
let mfRafPending=false, mfSuspend=0;
MFX.stats = {last:0, cells:0, culled:0};

MFX.renderNow = function(){
  if(!P) return;
  MFX.ensure();
  const t0=performance.now();
  const R0=P.regions;
  let culled=0;
  /* Regions are addressed by id everywhere (byId / P.cells[id] / sel.id),
     never by array position, so filtering the array for the duration of
     the base render is safe and lets us hide layers and skip off-screen
     work without touching the original renderer. */
  const keep = P.regions.filter(r=>{
    if(!MFX.layerVisible(r.layer)) return false;
    if(MFX.cull && !show.minimap && P.regions.length>60){
      const c=P.cells[r.id];
      const pad=Math.max(60, vb.w*0.12);
      const x=c&&c.a?c.a[0]:r.x, y=c&&c.a?c.a[1]:r.y;
      const rad=(c&&c.r)?c.r+pad:pad;
      if(x+rad<vb.x || x-rad>vb.x+vb.w || y+rad<vb.y || y-rad>vb.y+vb.h) return false;
    }
    return true;
  });
  culled = P.regions.length-keep.length;
  P.regions = keep;
  try { _mfRender(); }
  finally { P.regions = R0; }
  MFX.drawExtras();
  MFX.stats={last:performance.now()-t0, cells:keep.length, culled};
  const pl=$("#mf-perf"); if(pl) pl.textContent=MFX.stats.last.toFixed(1)+"ms";
};
render = function(){
  if(!P) return;
  if(mfSuspend){ return; }
  if(mfRafPending) return;
  mfRafPending=true;
  requestAnimationFrame(()=>{ mfRafPending=false; MFX.renderNow(); });
};
MFX.cull = true;

/* terrain culling & layer filtering, index-preserving */
const _mfTerrainOrder = terrainOrder;
terrainOrder = function(){
  let list=_mfTerrainOrder();
  if(MFX.isolate || (P.layers||[]).some(l=>!l.visible))
    list=list.filter(({f})=>MFX.layerVisible(f.layer));
  return list;
};

/* ---------------- spatial index (12c) ----------------
   A uniform grid over region anchors. Used by the token, stamp and
   auto-trace tools, which all need "which region is under this point"
   thousands of times in a loop where a linear scan would be visible. */
MFX.index = {grid:null, cell:0, stamp:-1};
MFX.buildIndex = function(force){
  const stamp = P.regions.length*1e6 + Object.keys(P.cells).length;
  if(!force && MFX.index.stamp===stamp && MFX.index.grid) return MFX.index;
  const b=contentBounds(10)||{x:0,y:0,w:P.w,h:P.h};
  const cell=Math.max(20, Math.sqrt((b.w*b.h)/Math.max(1,P.regions.length))*1.4);
  const grid=new Map();
  const key=(i,j)=>i+":"+j;
  P.regions.forEach(r=>{
    const c=P.cells[r.id];
    const pts=(c&&c.pts&&c.pts.length>2)?c.pts:[[r.x,r.y]];
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    pts.forEach(p=>{ x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]); });
    const pad=(c&&c.tap)?c.tap:8;
    for(let i=Math.floor((x0-pad-b.x)/cell); i<=Math.floor((x1+pad-b.x)/cell); i++)
      for(let j=Math.floor((y0-pad-b.y)/cell); j<=Math.floor((y1+pad-b.y)/cell); j++){
        const k=key(i,j); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(r.id);
      }
  });
  MFX.index={grid, cell, ox:b.x, oy:b.y, stamp};
  return MFX.index;
};
MFX.regionAt = function(p){
  const ix=MFX.buildIndex();
  const i=Math.floor((p[0]-ix.ox)/ix.cell), j=Math.floor((p[1]-ix.oy)/ix.cell);
  const bucket=ix.grid.get(i+":"+j)||[];
  let best=null, bestD=Infinity;
  for(const id of bucket){
    const c=P.cells[id], r=byId(id); if(!r) continue;
    if(c&&c.pts&&c.pts.length>2 && pointInPoly(p,c.pts)) return id;
    const a=(c&&c.a)||[r.x,r.y], d=dist(p,a), tap=(c&&c.tap)||10;
    if(d<tap && d<bestD){ best=id; bestD=d; }
  }
  return best;
};

/* ---------------- shared helpers ---------------- */
MFX.uid = p => (p||"x")+Math.random().toString(36).slice(2,8);
MFX.clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
MFX.hexToRgb = h => { h=(h||"#000").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
MFX.rgbToHex = c => "#"+c.map(v=>MFX.clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("");
MFX.mix = (a,b,t)=>{ const A=MFX.hexToRgb(a),B=MFX.hexToRgb(b);
  return MFX.rgbToHex([0,1,2].map(i=>A[i]+(B[i]-A[i])*t)); };
/* perceptually-ordered ramp for the analytics heat maps */
MFX.ramp = function(t){
  t=MFX.clamp(t,0,1);
  const stops=["#2c3e66","#2f7d8c","#63a85f","#d8c64a","#dd7a3a","#c1392b"];
  const s=t*(stops.length-1), i=Math.min(stops.length-2,Math.floor(s));
  return MFX.mix(stops[i],stops[i+1],s-i);
};
MFX.area = function(pts){
  if(!pts||pts.length<3) return 0;
  let a=0;
  for(let i=0,n=pts.length;i<n;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%n]; a+=x1*y2-x2*y1; }
  return Math.abs(a/2);
};
MFX.perimeter = function(pts){
  if(!pts||pts.length<2) return 0;
  let L=0; for(let i=0,n=pts.length;i<n;i++) L+=dist(pts[i],pts[(i+1)%n]);
  return L;
};
MFX.checkbox = function(label, val, cb){

MFX.head = function(text){

/* ---------------- graph utilities (shared by 1 & 3) ---------------- */
/* Adjacency with impassable border features removed — the graph the game
   actually plays on, as opposed to the one stored on the regions. */
MFX.graph = function(){
  const g=new Map();
  P.regions.forEach(r=>g.set(r.id,new Set()));
  P.regions.forEach(r=>(r.adj||[]).forEach(b=>{
    if(!g.has(b)) return;
    g.get(r.id).add(b); g.get(b).add(r.id);
  }));
  P.terrain.forEach(f=>{
    if(f.t==="border" && f.block && g.has(f.a) && g.has(f.b)){
      g.get(f.a).delete(f.b); g.get(f.b).delete(f.a);
    }
  });
  return g;
};
MFX.cost = function(a,b){
  /* 7: per-crossing cost from border terrain, plus per-region entry cost */
  let c = 1;
  const f=P.terrain.find(t=>t.t==="border" && ((t.a===a&&t.b===b)||(t.a===b&&t.b===a)));
  if(f && f.cost) c += +f.cost;
  const r=byId(b);
  if(r && r.terr && MFX.terrCost[r.terr]) c += MFX.terrCost[r.terr];
  return c;
};
MFX.terrCost = {};
MFX.bfs = function(from, g){
  g=g||MFX.graph();
  const d=new Map([[from,0]]), q=[from];
  while(q.length){
    const cur=q.shift();
    for(const n of (g.get(cur)||[])) if(!d.has(n)){ d.set(n,d.get(cur)+1); q.push(n); }
  }
  return d;
};
/* Dijkstra when movement costs are in play, BFS otherwise */
MFX.shortestPath = function(from, to, g){
  g=g||MFX.graph();
  const weighted = MFX.useCosts;
  const distm=new Map([[from,0]]), prev=new Map();
  const seen=new Set();
  while(true){
    let cur=null, best=Infinity;
    for(const [k,v] of distm) if(!seen.has(k) && v<best){ best=v; cur=k; }
    if(cur===null) break;
    if(cur===to) break;
    seen.add(cur);
    for(const n of (g.get(cur)||[])){
      const nd=best+(weighted?MFX.cost(cur,n):1);
      if(!distm.has(n)||nd<distm.get(n)){ distm.set(n,nd); prev.set(n,cur); }
    }
  }
  if(!distm.has(to)) return null;
  const path=[to]; let c=to;
  while(prev.has(c)){ c=prev.get(c); path.unshift(c); }
  return {path, cost:distm.get(to)};
};

};

/* =========================================================================
   2 — CUSTOM REGION ATTRIBUTES (open schema)
   -------------------------------------------------------------------------
   nation / settle / terr encode one game's assumptions. A user-defined
   schema lets a Euro carry resource yields, a 4X carry production, and a
   dungeon crawl carry a threat level, without forking the file.
   ========================================================================= */
const ATTR_TYPES = {number:"Number", text:"Text", bool:"Yes / no", enum:"Choice", color:"Colour"};

MFX.attrDef = key => (P.schema||[]).find(f=>f.key===key);
MFX.attrVal = function(r, f){
  const v = r.attrs && r.attrs[f.key];
  return v===undefined || v==="" ? (f.def===undefined?"":f.def) : v;
};
MFX.setAttr = function(r, f, v){
  r.attrs = r.attrs||{};
  if(v===""||v===null||v===undefined) delete r.attrs[f.key];
  else r.attrs[f.key] = f.type==="number" ? (+v||0) : (f.type==="bool" ? !!v : v);
};
MFX.attrRange = function(f){
  let lo=Infinity, hi=-Infinity;
  P.regions.forEach(r=>{ const v=+MFX.attrVal(r,f); if(isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v); } });
  return isFinite(lo)? {lo,hi} : {lo:0,hi:1};
};

/* attribute editors, reused by the single- and multi-selection panels */
MFX.attrControl = function(f, get, set){
  if(f.type==="bool"){
    const c=MFX.checkbox(f.label||f.key, get(), v=>{ pushUndo("set "+f.key); set(v); render(); });
    return c;
  }
  if(f.type==="enum"){
    const opts=[["","— none —"]].concat((f.options||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>[s,s]));
    return row(f.label||f.key, selInp(opts, get()||"", v=>{ pushUndo("set "+f.key); set(v); render(); }));
  }
  if(f.type==="color"){
    const w=document.createElement("div"); w.style.cssText="display:flex;gap:6px;flex:1";
    w.appendChild(inp("color", get()||"#888888", v=>{ pushUndo("set "+f.key); set(v); render(); }));
    w.appendChild(btn("clear",()=>{ pushUndo("clear "+f.key); set(""); render(); panel(); }));
    return row(f.label||f.key, w);
  }
  if(f.type==="number")
    return row(f.label||f.key, inp("number", get(), v=>{ pushUndo("set "+f.key); set(v); render(); }, {step:f.step||1}));
  return row(f.label||f.key, inp("text", get(), v=>{ pushUndo("set "+f.key); set(v); render(); }));
};
